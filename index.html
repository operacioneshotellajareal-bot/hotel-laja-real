}
function saveRoomEdit(oldNum){
  const nuevo = parseInt(document.getElementById('ed-num').value);
  const piso = parseInt(document.getElementById('ed-piso').value);
  const tipo = document.getElementById('ed-tipo').value;
  if(!nuevo||!piso){ alert('Revisa número y piso'); return; }
  const r = rooms();
  if(nuevo!==oldNum && r.find(x=>x.num===nuevo)){ alert('Ya existe la habitación '+nuevo); return; }
  const i = r.findIndex(x=>x.num===oldNum);
  r[i].num=nuevo; r[i].piso=piso; r[i].tipo=tipo; r[i].tarifa=parseFloat(document.getElementById('ed-tarifa').value)||0;
  saveRooms(r);
  if(nuevo!==oldNum){ // actualizar reportes que apuntaban a esta hab
    const reps=DB.get('reportes',[]); reps.forEach(x=>{ if(x.hab===oldNum) x.hab=nuevo; }); DB.set('reportes',reps);
  }
  cerrarModal(); render();
}
function deleteRoom(num){
  const r = findRoom(num);
  if(r.estado==='ocupada'){ alert('No puedes eliminar una habitación ocupada. Haz check-out primero.'); return; }
  if(!confirm('¿Eliminar la habitación '+num+'?')) return;
  saveRooms(rooms().filter(x=>x.num!==num));
  const reps=DB.get('reportes',[]).filter(x=>x.hab!==num); DB.set('reportes',reps);
  render();
}
function agregarTipo(){
  const el=document.getElementById('tipo-nuevo'); if(!el) return;
  const v=el.value.trim(); if(!v){ alert('Escribe un nombre para el tipo.'); return; }
  const ts=getTipos(); if(ts.some(x=>x.toLowerCase()===v.toLowerCase())){ alert('Ese tipo ya existe.'); return; }
  const pe=document.getElementById('tipo-nuevo-precio'); const precio=pe?(parseFloat(pe.value)||0):0;
  ts.push(v); saveTipos(ts); setPrecioBaseTipo(v, precio); render();
}
function guardarTipo(i){
  const el=document.getElementById('tipo-'+i); if(!el) return;
  const v=el.value.trim(); if(!v){ alert('El nombre no puede quedar vacío.'); return; }
  const ts=getTipos(); if(ts.some((x,j)=>j!==i && x.toLowerCase()===v.toLowerCase())){ alert('Ya existe otro tipo con ese nombre.'); return; }
  const pe=document.getElementById('tipo-precio-'+i); const precio=pe?(parseFloat(pe.value)||0):0;
  const viejo=ts[i]; ts[i]=v; saveTipos(ts);
  // mover el precio base al nombre nuevo
  const pm=getPreciosTipo(); if(viejo!==v){ delete pm[viejo]; } pm[v]=precio; DB.set('preciosTipo', pm);
  // renombrar el tipo en las habitaciones que lo usaban
  if(viejo!==v){ const r=rooms(); r.forEach(x=>{ if(x.tipo===viejo) x.tipo=v; }); saveRooms(r); }
  render(); alert('Tipo actualizado.');
}
function eliminarTipo(i){
  const ts=getTipos(); if(ts.length<=1){ alert('Debe quedar al menos un tipo de habitación.'); return; }
  const usadas=rooms().filter(x=>x.tipo===ts[i]).length;
  const aviso='¿Eliminar el tipo "'+ts[i]+'"?'+(usadas?(' Hay '+usadas+' habitación(es) con este tipo; quedarán sin tipo hasta que las edites.'):'');
  if(!confirm(aviso)) return;
  const pm=getPreciosTipo(); delete pm[ts[i]]; DB.set('preciosTipo', pm);
  ts.splice(i,1); saveTipos(ts); render();
}

  h += '<p style="font-size:12px;color:#8893a5;margin-top:6px;line-height:1.6">Todas las tarifas se guardan en USD y se muestran también en Bs usando esta tasa. Si la cambias, todos los precios en bolívares se recalculan al instante.</p></div>';
  return h;
}
function guardarTasaManual(){

  setTasa(v); render();
}
async function actualizarTasaBCV(){
  const msg = document.getElementById('ts-msg');
  msg.innerText = 'Consultando al BCV…';
  try{
    const resp = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
    if(!resp.ok) throw new Error();
    const d = await resp.json();
    if(!d.promedio) throw new Error();
    setTasa(Number(d.promedio.toFixed(2)));
    render();
  }catch(e){
    msg.innerText = 'No se pudo conectar con el BCV. Verifica tu internet o fija la tasa a mano.';
  }

function eliminarPromo(id){ if(!confirm('¿Eliminar esta promoción?')) return; const a=getPromos().filter(x=>x.id!==id); savePromos(a); render(); }
function promoActivas(){ return getPromos().filter(p=>p.activa!==false); }
function promoTituloPorId(id){ const p=getPromos().find(x=>x.id===id); return p?(p.titulo||''):''; }
function promoDescById(id){ const p=getPromos().find(x=>x.id===id); return p?Math.max(0,Math.min(100,Number(p.descuento||0))):0; }
function promoPct(r){ return Math.max(0,Math.min(100,Number((r&&r.promoDesc)||0))); }
/* ---- Cobro por tramos cuando el huésped cambia de habitación ---- */
function tramosDe(r){
  if(!r) return [];
  var t=Array.isArray(r.tramos)?r.tramos:[];
  return t.filter(function(x){ return x && Number(x.tarifa)>=0 && Number(x.noches)>0; });
}
function tramosActivos(r){
  if(!r) return [];
  var t=tramosDe(r);
  return (t.length && r.tramosCobro!==false)?t:[];
}
function brutoHab(r){
  if(!r) return 0;
  var t=tramosActivos(r);
  if(t.length) return t.reduce(function(s,x){ return s+Number(x.tarifa||0)*Number(x.noches||0); },0);
  return Number(r.tarifa||0)*(r.noches||1);
}
function nochesHab(r){
  if(!r) return 0;
  var t=tramosActivos(r);
  if(t.length) return t.reduce(function(s,x){ return s+Number(x.noches||0); },0);
  return Number(r.noches||1);
}
function tarifaEfectiva(r){
  if(!r) return 0;
  var t=tramosActivos(r);
  if(t.length){ var n=nochesHab(r); if(n>0) return Math.round((brutoHab(r)/n)*100)/100; }
  return Number(r.tarifa||0);
}
function lineaTarifaHab(r){
  var t=tramosActivos(r);
  if(t.length){
    return t.map(function(x){ return fmtUSD(x.tarifa)+' × '+x.noches+(x.hab?(' (Hab. '+x.hab+')'):''); }).join(' + ')+' = '+fmtUSD(brutoHab(r));
  }
  return fmtUSD(r.tarifa)+' × '+(r.noches||1)+' = '+fmtUSD(brutoHab(r));
}
function tramosRenglonesHTML(r){
  var t=tramosActivos(r);
  if(!t.length) return '';
  var h='<div style="background:#f3f6fb;border:1px solid #d9e2f0;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px;color:#2a4a73">';
  h+='<div style="font-weight:700;margin-bottom:4px">Cobro por tramos (el huésped cambió de habitación)</div>';
  t.forEach(function(x){ h+='<div>• '+x.noches+' noche'+(x.noches===1?'':'s')+(x.hab?(' en la Hab. '+esc(x.hab)):'')+' × '+fmtUSD(x.tarifa)+' = <b>'+fmtUSD(Number(x.tarifa)*Number(x.noches))+'</b></div>'; });
  h+='<div style="margin-top:4px;font-weight:800">Total hospedaje: '+fmtUSD(brutoHab(r))+'</div>';
  h+='</div>';
  return h;
}
function hospBruto(r){ return brutoHab(r); }
function descUsd(r){ return hospBruto(r)*promoPct(r)/100; }

/* ====== PESTAÑA COBRAR (búsqueda cómoda + cargos extra) ====== */
let cobrarQ='';
function renderCobrar(){
  return '<div style="background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);max-width:900px;margin-bottom:14px">'+
    '<div class="section-title" style="font-size:16px;margin:0 0 10px">💵 Cobrar</div>'+
    '<input id="cobrar-q" value="'+escA(cobrarQ)+'" placeholder="Buscar por nombre, cédula, N° de control o N° de habitación" oninput="cobrarQ=this.value;cobrarPintar()" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #d7deea;border-radius:10px;font-size:15px">'+
    '<div style="font-size:12px;color:#8893a5;margin-top:6px;line-height:1.55">Escribe parte del <b>nombre</b>, la <b>cédula</b>, el <b>número de control</b> de un pago o el <b>número de habitación</b>. Si lo dejas vacío, se muestran todas las habitaciones ocupadas.</div>'+
    '</div><div id="cobrar-res"></div>';
}
function cobrarMatchRooms(q){
  q=(q||'').trim().toLowerCase();
  const ocup=rooms().filter(r=>r.estado==='ocupada');
  if(!q) return ocup;
  let habsCtrl=[];
  try{ DB.get('pagos',[]).forEach(p=>{ const ctrl=String(p.control||''); if(ctrl && (ctrl.toLowerCase().indexOf(q)>=0 || fmtControl(p.control).toLowerCase().indexOf(q)>=0)){ if(p.hab) habsCtrl.push(Number(p.hab)); } }); }catch(e){}
  return ocup.filter(r=>{
    if(String(r.num).indexOf(q)>=0) return true;
    if((r.huesped||'').toLowerCase().indexOf(q)>=0) return true;
    const c=r.clienteId?clientes().find(x=>x.id===r.clienteId):null;
    if(c){
      const nom=((c.nombre||'')+' '+(c.apellido||'')).toLowerCase();
      if(nom.indexOf(q)>=0) return true;
      if((c.docNum||'').toLowerCase().indexOf(q)>=0) return true;
      if(normDoc(c.docNum) && normDoc(c.docNum)===normDoc(q)) return true;
      if((c.codigo||'').toLowerCase().indexOf(q)>=0) return true;
    }
    if(habsCtrl.indexOf(Number(r.num))>=0) return true;
    return false;
  });
}
function saldoGrupo(list){
  let gCost=0,gAb=0;
  list.forEach(r=>{ const noches=nochesHab(r); const hosp=brutoHab(r); const d=descUsd(r); const cons=cargosDe(r).filter(x=>!x.pagado).reduce((s,x)=>s+Number(x.montoUsd||0),0); const ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce((s,a)=>s+Number(a.montoUsd||0),0); gCost+=(hosp-d+cons); gAb+=ab; });
  return Math.max(0,gCost-gAb);
}
function ocultarPagadosCobrar(){
  const ocup=rooms().filter(r=>r.estado==='ocupada');
  const groups={}; ocup.forEach(r=>{ const k=r.tituId||r.clienteId||('h:'+(r.huesped||r.num)); (groups[k]=groups[k]||[]).push(r); });
  let n=0;
  Object.keys(groups).forEach(k=>{ const list=groups[k]; if(saldoGrupo(list)<=0.009){ list.forEach(r=>{ updateRoom(r.num,{ocultarCobrar:true}); n++; }); } });
  return n;
}
function cobrarPintar(){
  const cont=document.getElementById('cobrar-res'); if(!cont) return;
  const q=cobrarQ; const matches=cobrarMatchRooms(q);
  if(!matches.length){ cont.innerHTML='<div class="empty">'+(q?'No se encontró ninguna habitación ocupada con “'+esc(q)+'”.':'No hay habitaciones ocupadas en este momento.')+'</div>'; return; }
  const groups={}; const order=[];
  matches.forEach(r=>{ const k=r.tituId||r.clienteId||('h:'+(r.huesped||r.num)); if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(r); });
  const gs = order.map(k=>{ const list=groups[k].sort((a,b)=>a.num-b.num); const saldo=saldoGrupo(list); return {list:list, pagado:saldo<=0.009}; });
  const visibles = gs.filter(g=> !(g.pagado && g.list.every(r=>r.ocultarCobrar)) );
  visibles.sort((a,b)=>(a.pagado?1:0)-(b.pagado?1:0));
  if(!visibles.length){ cont.innerHTML='<div class="empty">'+(q?'No se encontró ninguna habitación ocupada con “'+esc(q)+'”.':'No hay cuentas pendientes por cobrar en este momento.')+'</div>'; return; }
  let h=''; let paidHeaderDone=false;
  visibles.forEach(g=>{
    if(g.pagado && !paidHeaderDone){ h+='<div style="font-weight:800;color:#1d6b38;margin:4px 0 12px;font-size:14px;border-top:2px dashed #cfe4d6;padding-top:12px">✓ Ya pagados (se quitan al cerrar el turno)</div>'; paidHeaderDone=true; }
    const list=g.list; const first=list[0];
    let _gTitu=''; list.forEach(function(r){ if(r.tituId) _gTitu=r.tituId; }); if(!_gTitu) _gTitu=first.clienteId||'';
    const c=_gTitu?clientes().find(x=>x.id===_gTitu):null;
    const nombre=(c?((c.nombre||'')+' '+(c.apellido||'')).trim():'')||first.huesped||'Huésped';
    const numsStr=list.map(r=>r.num).join(',');
    let gCost=0,gAb=0;
    list.forEach(r=>{ const noches=nochesHab(r); const hosp=brutoHab(r); const d=descUsd(r); const cons=cargosDe(r).filter(x=>!x.pagado).reduce((s,x)=>s+Number(x.montoUsd||0),0); const ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce((s,a)=>s+Number(a.montoUsd||0),0); gCost+=(hosp-d+cons); gAb+=ab; });
    const gSaldo=Math.max(0,gCost-gAb); const pagado=gSaldo<=0.009;
    h+='<div style="background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:16px 18px;margin-bottom:14px">';
    h+='<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:flex-start">';
    h+='<div><div style="font-weight:800;color:var(--azul);font-size:17px">'+esc(nombre)+'</div>';
    if(c&&c.docNum) h+='<div style="font-size:12.5px;color:#8893a5;margin-top:2px">'+esc(docLabel(c.docTipo)||'Documento')+' '+esc(c.docNum)+'</div>';
    h+='<div style="font-size:12.5px;color:#55637a;margin-top:2px">'+(list.length>1?('Cuenta combinada · '+list.length+' habitaciones ('+esc(numsStr)+')'):('Habitación '+esc(numsStr)))+'</div></div>';
    h+='<div>'+(pagado?'<span style="background:#e9f8ee;color:#1d6b38;border:1px solid #9fdcb4;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800">✓ PAGADO</span>':'<span style="background:#fff4e5;color:#9a6a00;border:1px solid #f3c96b;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:800">SIN PAGAR</span>')+'</div>';
    h+='</div>';
    list.forEach(r=>{
      const noches=nochesHab(r); const hosp=brutoHab(r); const d=descUsd(r);
      const cgs=cargosDe(r);
      h+='<div style="border:1px solid #e4e9f2;border-radius:10px;padding:12px 14px;margin-top:12px">';
      h+='<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div style="font-weight:700">Hab. '+r.num+' · '+esc(r.tipo||'')+(r.huesped?(' · <span style="font-weight:600;color:#55637a">'+esc(r.huesped)+'</span>'):'')+'</div><div style="font-size:12.5px;color:#55637a">Entrada: '+esc(r.checkin||'—')+' · '+noches+' noche(s)</div></div>';
      h+='<div style="font-size:13px;color:#44526a;margin-top:4px">Tarifa: '+lineaTarifaHab(r)+'</div>';
      if(tramosActivos(r).length) h+='<div style="font-size:12.5px;color:#2a4a73;margin-top:2px">🔄 Incluye tramos de habitaciones anteriores</div>';
      if(d>0.009) h+='<div style="font-size:13px;color:var(--verde);margin-top:2px">Promoción '+esc(r.promoTitulo||'')+' · −'+promoPct(r)+'% ('+fmtUSD(d)+' menos)</div>';
      if(cgs.length){
        h+='<div style="margin-top:8px;font-size:12.5px;color:#55637a;font-weight:600">Consumos / cargos</div>';
        h+='<table class="users-table" style="margin-top:4px"><tr><th>Concepto</th><th>Monto</th><th>Estado</th><th></th></tr>';
        cgs.forEach(cg=>{ h+='<tr><td>'+esc(cg.tipo+(cg.desc?' · '+cg.desc:''))+'</td><td>'+fmtUSD(cg.montoUsd)+'</td><td>'+(cg.pagado?'<span style="color:var(--verde)">Cobrado</span>':'<span style="color:#b5651d">Pendiente</span>')+'</td><td style="text-align:right">'+(cg.pagado?'':'<button class="btn-ghost" style="padding:3px 8px;font-size:12px" onclick="quitarCargoCobrar('+r.num+',\''+cg.id+'\')">Quitar</button>')+'</td></tr>'; });

      }
      h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">';
      h+='<button class="btn-ghost" style="padding:5px 10px;font-size:12.5px" onclick="cargoExtraModal('+r.num+')">+ Consumo / cargo</button>';
      h+='<button class="btn-ghost" style="padding:5px 10px;font-size:12.5px" onclick="extenderEstadiaModal('+r.num+')">+ Extender estadía (noches)</button>';
      h+='</div></div>';
    });
    h+='<div style="background:#f3f6fb;border-radius:10px;padding:14px;margin-top:12px">';

  const p=DB.get('pagos',[]).find(x=>x.id===id); if(!p){ alert('No se encontró el cobro.'); return; }
  let body='<button class="close" onclick="cerrarModal()">×</button><h2>Anular cobro</h2>';
  body+='<div style="background:#fdecea;border:1px solid #f3b4ac;border-radius:8px;padding:10px 12px;font-size:13px;color:#8a2a1c;margin-bottom:12px">Vas a <b>anular</b> este cobro. Queda registrado quién lo anula, cuándo y por qué, para poder revisarlo después.</div>';
  body+='<div style="background:#f3f6fb;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px">';
  body+='<div><b>'+(p.hab?('Hab. '+p.hab):'Cobro manual')+'</b> '+esc(p.huesped||p.concepto||'')+'</div>';
  body+='<div style="color:#55637a;margin-top:3px">'+(p.control?('Control N° '+fmtControl(p.control)+' · '):'')+esc(p.metodo||'')+' · '+esc(p.fechaStr||'')+'</div>';
  body+='<div style="font-weight:800;color:var(--azul);margin-top:3px">'+fmtBs(p.montoBs)+' · '+fmtUSD(p.montoUsd)+'</div></div>';
  body+='<div class="field"><label>¿Por qué anulas este cobro? (obligatorio)</label><textarea id="anul-motivo" rows="3" placeholder="Ej: cobro duplicado, monto equivocado, el cliente no pagó, error de forma de pago…"></textarea></div>';
  body+='<div class="divider"></div><div class="actions"><button class="btn-red" onclick="confirmarAnularPago('+id+', this)">Anular cobro</button><button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';
  showModal(body);
}
function confirmarAnularPago(id, btn){
  if(procesoDoble(btn)) return;
  if(!(session().rol==='admin'||puedeSup('anularPagos'))){ alert('No tienes permiso para anular cobros.'); cerrarModal(); return; }
  const pagos=DB.get('pagos',[]); const p=pagos.find(x=>x.id===id);
  if(!p){ alert('No se encontró el cobro.'); cerrarModal(); return; }
  const motivo=(document.getElementById('anul-motivo')||{}).value||'';
  if(!motivo.trim()){ alert('Escribe el motivo de la anulación.'); return; }
  const s=session();
  const detalle='ANULADO por '+(s?s.nombre:'')+' ('+(s?s.rol:'')+')'+(p.control?(' · Control N° '+fmtControl(p.control)):'')+(p.metodo?(' · '+p.metodo):'')+' · Motivo: '+motivo.trim();
  logKardex('anulacion', {hab:p.hab||0, huesped:p.huesped||p.concepto||'', clienteId:p.clienteId||'', detalle:detalle, montoUsd:p.montoUsd, montoBs:p.montoBs, metodo:p.metodo, motivo:motivo.trim(), control:p.control||'', anuladoPor:(s?s.nombre:''), anuladoRol:(s?s.rol:'')});
  DB.set('pagos', pagos.filter(x=>x.id!==id));
  cerrarModal(); render();
  alert('Cobro anulado. Quedó registrado en el Kardex con el motivo y quién lo anuló.');
}

function resumenCaja(fecha){
  const pagos = DB.get('pagos',[]).filter(p=>p.dia===fecha);
  const porMetodo = {}; let totBs=0, totUsd=0;
  METODOS.forEach(m=>porMetodo[m]={bs:0,usd:0,n:0});
  pagos.forEach(p=>{ if(Array.isArray(p.metodos)&&p.metodos.length){ p.metodos.forEach(m=>{ if(!porMetodo[m.metodo]) porMetodo[m.metodo]={bs:0,usd:0,n:0}; porMetodo[m.metodo].bs+=Number(m.montoBs)||0; porMetodo[m.metodo].usd+=Number(m.montoUsd)||0; porMetodo[m.metodo].n++; }); } else { if(!porMetodo[p.metodo]) porMetodo[p.metodo]={bs:0,usd:0,n:0}; porMetodo[p.metodo].bs+=p.montoBs; porMetodo[p.metodo].usd+=p.montoUsd; porMetodo[p.metodo].n++; } totBs+=p.montoBs; totUsd+=p.montoUsd; });
  return {pagos:pagos, porMetodo:porMetodo, totBs:totBs, totUsd:totUsd};
}
function fechaLarga(dia){
  const p = dia.split('-'); const d = new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString('es-VE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}

function exportarCajaCSV(){
  const pagos = DB.get('pagos',[]).filter(p=>p.dia===cajaFecha);
  if(!pagos.length){ alert('No hay movimientos en esta caja para exportar.'); return; }
  const headers=['Control','Ubicacion','Huesped/Concepto','Metodo','Fecha','Monto Bs','Monto USD','Usuario'];
  const rows=pagos.map(p=>[p.control?fmtControl(p.control):'', p.hab?('Hab '+p.hab):'Manual', p.huesped||p.concepto||'', p.metodo, p.fechaStr, Number(p.montoBs).toFixed(2), Number(p.montoUsd).toFixed(2), p.usuario||'']);
  _descargarXLS('arqueo_'+cajaFecha+'.xls', headers, rows);
}
function corteDatos(fecha, turno){
  let pagos = DB.get('pagos',[]).filter(p=>p.dia===fecha);
  let cargos = kardexAll().filter(k=>k.tipo==='cargo' && diaKey(new Date(k.ts))===fecha);
  let anul = kardexAll().filter(k=>k.tipo==='anulacion' && diaKey(new Date(k.ts))===fecha);
  let cred = kardexAll().filter(k=>k.tipo==='credito' && diaKey(new Date(k.ts))===fecha);
  let autoriz = kardexAll().filter(k=>k.tipo==='autorizada' && diaKey(new Date(k.ts))===fecha);
  let listaMan = kardexAll().filter(k=>k.tipo==='listamanual' && diaKey(new Date(k.ts))===fecha);
  let hkRep = kardexAll().filter(k=>k.tipo==='limpieza' && k.hkReporte && diaKey(new Date(k.ts))===fecha);
  if(turno && turno!=='todos'){
    pagos = pagos.filter(p=>turnoDePago(p)===turno);
    cargos = cargos.filter(k=>turnoDeTs(k.ts)===turno);
    anul = anul.filter(k=>turnoDeTs(k.ts)===turno);
    cred = cred.filter(k=>turnoDeTs(k.ts)===turno);
    autoriz = autoriz.filter(k=>turnoDeTs(k.ts)===turno);
    listaMan = listaMan.filter(k=>turnoDeTs(k.ts)===turno);
    hkRep = hkRep.filter(k=>turnoDeTs(k.ts)===turno);
  }
  let totBs=0, totUsd=0; const porRecep={};
  pagos.forEach(p=>{ totBs+=Number(p.montoBs)||0; totUsd+=Number(p.montoUsd)||0;
    const u=p.usuario||'(sin nombre)'; if(!porRecep[u]) porRecep[u]={n:0,bs:0,usd:0}; porRecep[u].n++; porRecep[u].bs+=Number(p.montoBs)||0; porRecep[u].usd+=Number(p.montoUsd)||0; });
  let credUsd=0, credBs=0; cred.forEach(k=>{ credUsd+=Number(k.credUsd||0); credBs+=Number(k.credBs||0); });
  return {pagos:pagos, cargos:cargos, anul:anul, cred:cred, autoriz:autoriz, listaMan:listaMan, hkRep:hkRep, totBs:totBs, totUsd:totUsd, credUsd:credUsd, credBs:credBs, porRecep:porRecep};
}

  let estadoHtml='<h2>Estado de las habitaciones</h2>';

function tipoCobroDe(p){
  var c=String((p&&p.concepto)||'');
  if(p && (p.tipoPago==='abono' || p.abono===true || /abono/i.test(c))) return 'abono';
  if(/consumo|habitaci[oó]n/i.test(c)) return 'consumo';
  if(/check-?out|salida|estad[ií]a|noche/i.test(c)) return 'estadia';
  if(/comida|restaurante|desayuno|almuerzo|cena/i.test(c)) return 'comida';
  return 'otro';
}

  let d = repDesde, h = repHasta;

  return DB.get('pagos',[]).filter(p=>{
    if(!p.dia || p.dia<d || p.dia>h) return false;
    if(repMetodo && String(p.metodo||'')!==repMetodo) return false;
    if(repUsuario && String(p.usuario||'').trim()!==repUsuario) return false;
    if(repTipo && tipoCobroDe(p)!==repTipo) return false;
    return true;
  });
}

function diasVencidoISO(venc){ if(!venc) return null; try{ const a=new Date(venc+'T00:00:00'); const b=new Date(hoyISO()+'T00:00:00'); if(isNaN(a))return null; return Math.round((b-a)/86400000); }catch(e){ return null; } }
function morosidadDatos(){
  const l=cxc().filter(e=>!cxcPagada(e));
  const vencidas=[], porVencer=[], sinFecha=[];
  l.forEach(e=>{ const d=diasVencidoISO(e.vencimiento);
    if(d===null) sinFecha.push(Object.assign({_d:null},e));
    else if(d>0) vencidas.push(Object.assign({_d:d},e));
    else porVencer.push(Object.assign({_d:d},e));
  });
  vencidas.sort((a,b)=>b._d-a._d);
  porVencer.sort((a,b)=>b._d-a._d);
  const buckets={b1:{n:0,s:0},b2:{n:0,s:0},b3:{n:0,s:0},b4:{n:0,s:0}};
  let totVenc=0; vencidas.forEach(e=>{ const s=cxcSaldo(e); totVenc+=s; const d=e._d;
    if(d<=30){buckets.b1.n++;buckets.b1.s+=s;} else if(d<=60){buckets.b2.n++;buckets.b2.s+=s;} else if(d<=90){buckets.b3.n++;buckets.b3.s+=s;} else {buckets.b4.n++;buckets.b4.s+=s;} });
  let totPorVenc=0; porVencer.forEach(e=>totPorVenc+=cxcSaldo(e));
  let totSin=0; sinFecha.forEach(e=>totSin+=cxcSaldo(e));
  return {vencidas:vencidas, porVencer:porVencer, sinFecha:sinFecha, buckets:buckets, totVenc:totVenc, totPorVenc:totPorVenc, totSin:totSin, total:totVenc+totPorVenc+totSin};
}

function repararCodigosEmpresas(){
  if(!esMaster(session().rol)){ alert('Solo el Master puede reparar los códigos.'); return; }
  const list=clientes();
  const emps=list.filter(c=>c.tipo==='empresa');
  if(!emps.length){ alert('No hay empresas registradas.'); return; }
  const cnt={};
  emps.forEach(e=>{ const k=String(e.codigo||'').trim().toUpperCase(); cnt[k]=(cnt[k]||0)+1; });
  const esUnicoValido=e=>{ const k=String(e.codigo||'').trim().toUpperCase(); return /^EMP-\d+$/.test(k) && cnt[k]===1; };
  const usados=new Set();
  emps.forEach(e=>{ if(esUnicoValido(e)) usados.add(String(e.codigo||'').trim().toUpperCase()); });
  const nextCod=()=>{ let mx=0; usados.forEach(k=>{ const m=/^EMP-(\d+)$/.exec(k); if(m){ const n=parseInt(m[1],10); if(n>mx) mx=n; } }); const nc='EMP-'+String(mx+1).padStart(4,'0'); usados.add(nc); return nc; };
  let cambiados=0;
  emps.forEach(e=>{ if(!esUnicoValido(e)){ e.codigo=nextCod(); cambiados++; } });
  if(!cambiados){ alert('Todo en orden ✅\n\nCada empresa ya tiene su propio código único. No hubo nada que reparar.'); return; }
  if(!confirm('Se van a renumerar '+cambiados+' empresa(s) para que cada una tenga su propio código único.\n\n¿Deseas continuar?')) return;
  saveClientes(list); render();
  alert('Listo ✅\n\nSe repararon '+cambiados+' empresa(s). Ahora cada una tiene su propio código único.');
}
function empresaPorRef(ref){
  ref=(ref||'').trim(); if(!ref) return null;
  const low=ref.toLowerCase();
  const emps=clientes().filter(c=>c.tipo==='empresa');
  let e=emps.find(x=>String(x.codigo||'').toLowerCase()===low);
  if(!e) e=emps.find(x=>x.codigo && low.indexOf(String(x.codigo).toLowerCase())===0);
  if(!e) e=emps.find(x=>String(x.nombre||'').toLowerCase()===low);
  if(!e) e=emps.find(x=>x.codigo && low.indexOf(String(x.codigo).toLowerCase())>=0);
  if(!e) e=emps.find(x=>x.nombre && low.indexOf(String(x.nombre).toLowerCase())>=0);
  return e||null;
}

function autoLlenarEmpresaCheckin(){
  const inp=document.getElementById('m-empresaref'); if(!inp) return;
  const info=document.getElementById('m-empresa-info');
  const _pc=document.getElementById('m-empcred'); const _prevChecked=_pc?_pc.checked:false;
  const e=empresaPorRef(inp.value);
  if(!e){
    if(info){
      const typed=inp.value.trim();
      if(typed){
        info.style.background='#fff7e6'; info.style.border='1px solid #f0c674'; info.style.color='#8a5a00'; info.style.display='';
        let hh='⚠️ Esta empresa no está registrada.';
        hh+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">';
        hh+='<input id="m-emp-nuevo-nom" placeholder="Nombre de la empresa" value="'+escA(typed)+'" style="flex:1;min-width:150px;padding:7px 9px;border:1px solid #d7deea;border-radius:7px">';
        hh+='<input id="m-emp-nuevo-rif" placeholder="RIF (obligatorio) ej: J-12345678" style="flex:1;min-width:150px;padding:7px 9px;border:1px solid #d7deea;border-radius:7px">';
        hh+='<button type="button" class="btn-primary" style="padding:7px 12px;white-space:nowrap" onclick="agregarEmpresaRapida()">➕ Agregarla</button>';
        hh+='</div>';
        info.innerHTML=hh;
      } else { info.style.display='none'; info.innerHTML=''; info.style.background='#e9f8ee'; info.style.border='1px solid #9fdcb4'; info.style.color='#1d6b38'; }
    }
    return;
  }
  if(info){ info.style.background='#e9f8ee'; info.style.border='1px solid #9fdcb4'; info.style.color='#1d6b38'; }
  if(info){
    let txt='✅ Empresa encontrada: <b>'+esc(e.nombre||'')+'</b>'+(e.codigo?(' ['+esc(e.codigo)+']'):'');
    const d=[];
    const _dc=parseInt(e.diasCredito||0)||0;
    if(e.diasCredito) d.push('Crédito: '+esc(e.diasCredito)+' días');
    if(e.tipoComp) d.push('Tipo: '+esc(e.tipoComp));
    if(e.telefono) d.push('Tel: '+esc(e.telefono));
    if(e.direccion) d.push('Dir: '+esc(e.direccion));
    if(d.length) txt+='<br>'+d.join(' · ');
    txt+='<label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;font-weight:800;color:#1d6b38"><input type="checkbox" id="m-empcred" '+(_prevChecked?'checked':'')+' style="width:auto;margin:0"> 💳 Cargar el hospedaje a la cuenta de la empresa (paga la empresa a crédito)</label>';
    txt+='<div style="font-size:12px;color:#1d6b38;margin-top:4px">El huésped no paga el hospedaje aquí; queda en <b>CXC</b> a nombre de <b>'+esc(e.nombre||'')+'</b>'+(_dc>0?(' (crédito '+_dc+' días)'):'')+'. En el check-out no se vuelve a cobrar el hospedaje.</div>';
    info.innerHTML=txt; info.style.display='';
  }
}
function limpiarEmpresaRef(){
  const inp=document.getElementById('m-empresaref'); if(inp) inp.value='';
  const info=document.getElementById('m-empresa-info'); if(info){ info.style.display='none'; info.innerHTML=''; info.style.background='#e9f8ee'; info.style.border='1px solid #9fdcb4'; info.style.color='#1d6b38'; }
}
function agregarEmpresaRapida(){
  const nomEl=document.getElementById('m-emp-nuevo-nom'); const rifEl=document.getElementById('m-emp-nuevo-rif');
  const nom=nomEl?nomEl.value.trim():''; const rifTxt=rifEl?rifEl.value.trim():'';
  if(!nom){ alert('Escribe el nombre de la empresa.'); if(nomEl) nomEl.focus(); return; }
  if(!rifTxt){ alert('El RIF es obligatorio para registrar la empresa.'); if(rifEl) rifEl.focus(); return; }
  let dt='J', dn=rifTxt.toUpperCase().replace(/[\s]+/g,'');
  const m=/^([VEJGP])[-]?([0-9].*)$/.exec(dn); if(m){ dt=m[1]; dn=m[2]; } dn=dn.replace(/[^0-9]/g,'');
  if(!dn){ alert('El RIF debe tener números. Ejemplo: J-12345678'); if(rifEl) rifEl.focus(); return; }
  const list=clientes();
  const dup=list.find(c=>c.tipo==='empresa' && ((String(c.docNum||'').replace(/[^0-9]/g,'')===dn) || String(c.nombre||'').trim().toLowerCase()===nom.toLowerCase()));
  let emp;
  if(dup){ emp=dup; }
  else {
    emp={id:'c'+Date.now(), tipo:'empresa', nombre:nom, apellido:'', docTipo:dt, docNum:dn, correo:'', ocupacion:'', ciudad:'', telefono:'', direccion:'', notas:'', historial:[], creado:new Date().toISOString(), codigo:nuevoCodigoEmpresa()};
    list.push(emp); saveClientes(list);
  }
  const inp=document.getElementById('m-empresaref'); if(inp){ inp.value=((emp.codigo||'')+(emp.nombre?(' — '+emp.nombre):'')).trim(); }
  const dl=document.getElementById('m-empresas-list'); if(dl){ dl.innerHTML=clientes().filter(c=>c.tipo==='empresa').map(x=>'<option value="'+escA(((x.codigo||'')+(x.nombre?(' — '+x.nombre):'')).trim())+'">').join(''); }
  autoLlenarEmpresaCheckin();
}

function clienteRows(){
  const q = clientBuscar.trim().toLowerCase();
  let list = clientes().slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  if(clientFiltro==='empresa') list=list.filter(c=>c.tipo==='empresa');
  else if(clientFiltro==='persona') list=list.filter(c=>c.tipo!=='empresa');
  if(q){
    const strip=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const words=q.split(/\s+/).filter(Boolean);
    list = list.filter(c=>{
      const campos=strip((c.nombre||'')+' '+(c.apellido||'')+' '+(c.ciudad||'')+' '+(c.correo||'')+' '+(c.codigo||'')+' '+(c.telefono||'')+' '+(c.empresaRef||'')+' '+(c.tipoComp||''));
      const docN=normDoc(c.docNum);
      return words.every(w=>campos.includes(strip(w)) || (normDoc(w) && docN.includes(normDoc(w))));
    });
  }
  if(list.length===0) return '<div class="empty">No hay clientes que coincidan.</div>';
  let t='<table class="users-table"><tr><th>Nombre / Empresa</th><th>Documento</th><th>Correo</th><th>Ocupación</th><th>Ciudad</th><th style="text-align:right">Acciones</th></tr>';
  list.forEach(c=>{
    const nom = c.tipo==='empresa' ? esc(c.nombre) : esc(((c.nombre||'')+' '+(c.apellido||'')).trim());
    const doc = c.docNum ? esc((c.docTipo||'')+'-'+c.docNum) : '—';
    t += '<tr><td><b>'+nom+'</b>'+(c.tipo==='empresa'?' <span style="font-size:11px;color:#8893a5">(Empresa)</span>':'')+(c.tipo==='empresa'&&c.codigo?' <span style="font-size:11px;color:#1b6ca8;font-weight:700">['+esc(c.codigo)+']</span>':'')+cxcBadgeCliente(c)+'</td>'+
      '<td>'+doc+'</td><td>'+esc(c.correo||'—')+'</td><td>'+esc(c.ocupacion||'—')+'</td><td>'+esc(c.ciudad||'—')+'</td>'+
      '<td style="text-align:right;white-space:nowrap"><button class="btn-ghost" style="padding:6px 12px;margin-right:6px" onclick="verClienteModal(\''+c.id+'\')">Ver</button>'+
      '<button class="btn-ghost" style="padding:6px 12px;margin-right:6px" onclick="editClienteModal(\''+c.id+'\')">Editar</button>'+
      '<button class="btn-red" style="padding:6px 12px" onclick="deleteCliente(\''+c.id+'\')">Eliminar</button></td></tr>';
  });
  t+='</table>'; return t;
}

function resumenHuesped(c){
  const hist=Array.isArray(c.historial)?c.historial:[];
  const completas=hist.filter(e=>e.estado!=='activa' && e.estado!=='cargo').length;
  const activas=hist.filter(e=>e.estado==='activa').length;
  const noches=hist.reduce((s,e)=>s+Number(e.noches||0),0);
  const totUsd=hist.reduce((s,e)=>s+Number(e.montoUsd||0),0);
  const fechas=hist.map(e=>e.entrada).filter(Boolean).sort();
  return {estadias:hist.length, completas:completas, activas:activas, noches:noches, totUsd:totUsd, ultima:fechas.length?fechas[fechas.length-1]:''};
}
function imprimirResumenHuespedes(){
  const list=clientes().slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));

    const r=resumenHuesped(c);
    totNoches+=r.noches; totUsd+=r.totUsd; totEst+=r.completas;
    const nom = c.tipo==='empresa'?(c.nombre||''):((c.nombre||'')+' '+(c.apellido||'')).trim();

  });
  let html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Resumen de huéspedes</title>';
  html+='<style>*{font-family:Arial,sans-serif;box-sizing:border-box}body{margin:0;padding:30px;color:#1c2430}h1{font-size:19px;color:#0d3b66;margin:0}.sub{color:#667;font-size:13px;margin:4px 0 16px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ccd;padding:6px 8px;text-align:left}th{background:#eef3fa;color:#44526a}.r{text-align:right}.c{text-align:center}.tot td{font-weight:800;background:#f3f6fb}@media print{body{padding:0}}</style></head><body style="zoom:'+escalaImpresion()+'">';
  const _hl=hotel(); const _lsz=Math.max(40,(parseInt(_hl.logoSize)||52)+6); const _lwv=parseInt(_hl.logoWidth)||0; const _lw=_lwv>0?(_lwv+'px'):'auto';
  const _logo=(_hl.logo && impConfig().mostrarLogo)?('<img src="'+_hl.logo+'" alt="logo" style="height:'+_lsz+'px;width:'+_lw+';max-width:280px;object-fit:contain;border-radius:10px;flex:0 0 auto">'):'';
  html+='<div style="display:flex;align-items:center;gap:14px">'+_logo+'<div><h1>'+esc(hotelNombre())+' · '+esc(tituloDoc('resumen','Resumen de huéspedes'))+'</h1>'+hotelLinePrint()+'</div></div>';

  html+='<table><tr><th>Nombre</th><th>Documento</th><th>Correo</th><th>Ocupación</th><th>Ciudad</th><th class="c">Estadías</th><th class="c">Noches</th><th class="r">Total hospedado</th><th>Última visita</th></tr>'+filas;
  html+='<tr class="tot"><td colspan="5">TOTALES</td><td class="c">'+totEst+'</td><td class="c">'+totNoches+'</td><td class="r">'+fmtUSD(totUsd)+'</td><td></td></tr></table>';
  html+=piePaginaHTML()+'</body></html>';
  return imprimirHTML(html);

function recopilarInvitados(){
  const out=[];
  clientes().forEach(function(c){
    const acs=Array.isArray(c.acompanantes)?c.acompanantes:[];
    acs.forEach(function(a){
      if(!(a.nombre||'').trim() && !(a.docNum||'').trim()) return;
      out.push({ nombre:(a.nombre||'').trim(), docTipo:a.docTipo||'', docNum:(a.docNum||'').trim(), hab:a.hab||'', fecha:a.fecha||'', huesped:nombreCliente(c) });
    });
  });
  out.sort(function(x,y){ return String(y.fecha||'').localeCompare(String(x.fecha||'')); });
  return out;
}

function _csvDelim(text){
  const first=(text.split(/\r?\n/)[0]||'');
  const c=(first.match(/,/g)||[]).length, s=(first.match(/;/g)||[]).length, t=(first.match(/\t/g)||[]).length;
  if(t>=c && t>=s && t>0) return '\t';
  return s>c?';':',';
}
function _parseCSV(text, delim){
  const rows=[]; let row=[]; let field=''; let inQ=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===delim){ row.push(field); field=''; } else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; } else if(ch==='\r'){} else field+=ch; }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function _descargarXLS(filename, headers, rows){
  let html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">';
  html+='<tr>'+headers.map(x=>'<th style="background:#eef2f7">'+esc(String(x==null?'':x))+'</th>').join('')+'</tr>';
  rows.forEach(r=>{ html+='<tr>'+r.map(c=>'<td style="mso-number-format:\'\\@\'">'+esc(String(c==null?'':c))+'</td>').join('')+'</tr>'; });
  html+='</table></body></html>';
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function _rowsFromHTML(text){

  return rows;
}

function procesarImportClientes(text){
  text=text.replace(/^\ufeff/,'');
  let rows;
  if(/<\s*table|<\s*tr[\s>]/i.test(text.slice(0,2000))){ rows=_rowsFromHTML(text); }
  else { const delim=_csvDelim(text); rows=_parseCSV(text, delim); }
  rows=rows.filter(r=>r.some(x=>String(x).trim()!==''));
  if(rows.length<2){ alert('El archivo no tiene datos. Debe tener una fila de títulos y al menos una fila con un cliente.'); return; }
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  const headers=rows[0].map(norm);
  const idx=names=>{ for(const n of names){ const k=headers.indexOf(n); if(k>=0) return k; } return -1; };
  const col={ tipo:idx(['tipo']), nombre:idx(['nombre','razon social','nombre de la empresa']), apellido:idx(['apellido','apellidos']),
    docTipo:idx(['tipo documento','tipo de documento']), docNum:idx(['numero documento','numero de documento','n documento','nro documento']),
    doc:idx(['documento','cedula','rif']), correo:idx(['correo','email','e-mail']), telefono:idx(['telefono','telefono movil','celular','movil']),
    direccion:idx(['direccion']), edad:idx(['edad']), empresaRef:idx(['viene por empresa','viene por una empresa','empresa','empresa asociada']),
    tipoComp:idx(['tipo compania','tipo de compania','tipo de empresa']), diasCredito:idx(['dias credito','dias de credito','credito']),
    ocupacion:idx(['ocupacion','actividad','rubro']), ciudad:idx(['ciudad','ciudad de procedencia','procedencia']),
    codigo:idx(['codigo','codigo empresa']), notas:idx(['notas','observaciones']) };
  if(col.nombre<0){ alert('No encontré la columna "Nombre" en los títulos del archivo. Descarga la plantilla para ver el formato correcto.'); return; }
  const g=(r,k)=> (k>=0 && k<r.length) ? String(r[k]||'').trim() : '';
  const L2C={'cedula':'V','extranjero':'E','pasaporte':'P','rif':'J','gubernamental':'G','v':'V','e':'E','p':'P','j':'J','g':'G'};
  const parseDoc=r=>{ let dt=g(r,col.docTipo), dn=g(r,col.docNum);
    if(!dn && col.doc>=0){ const raw=g(r,col.doc); if(raw){ const parts=raw.split(/[\s-]+/).filter(Boolean); if(parts.length>=2 && L2C[norm(parts[0])]){ dt=parts[0]; dn=parts.slice(1).join(''); } else { dn=raw.replace(/\s+/g,''); } } }
    if(dt){ dt=L2C[norm(dt)]||dt.toUpperCase().slice(0,1); }
    if(['V','E','P','J','G'].indexOf(dt)<0) dt='V';
    return {dt:dt, dn:dn}; };
  const list=clientes();
  const docKey=(dt,dn)=>norm(dt)+'|'+norm(dn);
  const existDocs=new Set(list.filter(c=>c.docNum).map(c=>docKey(c.docTipo,c.docNum)));
  const existCod=new Set(list.filter(c=>c.tipo==='empresa'&&c.codigo).map(c=>norm(c.codigo)));
  const existNom=new Set(list.filter(c=>c.tipo==='empresa').map(c=>norm(c.nombre)));
  let maxEmpNum=0; list.forEach(c=>{ if(c.tipo==='empresa'){ const m=/^EMP-(\d+)$/.exec(String(c.codigo||'')); if(m){ const n=parseInt(m[1],10); if(n>maxEmpNum) maxEmpNum=n; } } });
  let addP=0,addE=0,skip=0; const base=Date.now();
  for(let i=1;i<rows.length;i++){ const r=rows[i];
    const nombre=g(r,col.nombre); if(!nombre) continue;
    const esEmp = norm(g(r,col.tipo)).indexOf('empresa')>=0 || norm(g(r,col.tipo))==='company';
    if(esEmp){
      const nkey=norm(nombre);
      const d=parseDoc(r);
      /* Reconocer por RIF (documento) o por nombre: si ya existe, no duplicar y respetar su código */
      if((d.dn && existDocs.has(docKey(d.dt,d.dn))) || existNom.has(nkey)){ skip++; continue; }
      /* La app asigna el código ella misma e IGNORA el que venga en el archivo */
      const codigo='EMP-'+String(++maxEmpNum).padStart(4,'0');
      const nuevo={id:'c'+(base+i), tipo:'empresa', nombre:nombre, apellido:'', docTipo:(d.dn?d.dt:'J'), docNum:d.dn, correo:g(r,col.correo), ocupacion:g(r,col.ocupacion), ciudad:g(r,col.ciudad), telefono:g(r,col.telefono), direccion:g(r,col.direccion), notas:g(r,col.notas), historial:[], creado:new Date().toISOString(), codigo:codigo, tipoComp:g(r,col.tipoComp), diasCredito:g(r,col.diasCredito)};
      list.push(nuevo); existCod.add(norm(codigo)); existNom.add(nkey); if(d.dn) existDocs.add(docKey(d.dt,d.dn)); addE++;
    } else {
      const d=parseDoc(r);
      if(d.dn && existDocs.has(docKey(d.dt,d.dn))){ skip++; continue; }
      const nuevo={id:'c'+(base+i), tipo:'persona', nombre:nombre, apellido:g(r,col.apellido), docTipo:d.dt, docNum:d.dn, correo:g(r,col.correo), ocupacion:g(r,col.ocupacion), ciudad:g(r,col.ciudad), telefono:g(r,col.telefono), direccion:g(r,col.direccion), edad:g(r,col.edad), empresaRef:g(r,col.empresaRef), notas:g(r,col.notas), historial:[], creado:new Date().toISOString()};
      list.push(nuevo); if(d.dn) existDocs.add(docKey(d.dt,d.dn)); addP++;
    }
  }
  saveClientes(list); render();
  alert('Importación terminada.\n\nAgregados: '+addP+' persona(s) y '+addE+' empresa(s).'+(skip?('\nOmitidos por estar repetidos: '+skip+'.'):'')+'\n\nYa quedaron guardados y sincronizados.');
}
function guardarCliente(){

function cargarLogo(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ alert('Elige un archivo de imagen (PNG o JPG).'); return; }
  if(f.size>8000000){ alert('La imagen es demasiado pesada (máximo 8 MB). Usa una un poco más liviana.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=512; let w=img.width, hg=img.height;
      if(w>MAX||hg>MAX){ const s=Math.min(MAX/w, MAX/hg); w=Math.round(w*s); hg=Math.round(hg*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=hg;
      cv.getContext('2d').drawImage(img,0,0,w,hg);
      const data = /png/i.test(f.type) ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.85);
      const h=leerHotelForm(); h.logo=data; saveHotel(h); pintarMarca(); render();
    };
    img.onerror=function(){ alert('No se pudo leer la imagen. Prueba con otra.'); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

/* ====== INICIO (con sincronización en la nube) ====== */
function hayFormularioActivo(){
  const a = document.activeElement;
  if(a){ const t=(a.tagName||'').toLowerCase(); if(t==='input'||t==='textarea'||t==='select') return true; }
  const mb = document.getElementById('modal-bg');
  if(mb && mb.style.display==='flex') return true;
  return false;
}

function startPolling(){
  if(!CLOUD.enabled) return;
  setInterval(async ()=>{
    try{
      const antes = {};
      SYNC_KEYS.forEach(k=> antes[k]=localStorage.getItem('hotel_'+k));
      try{ await CLOUD.flushQueue(); }catch(e){}  /* sube lo pendiente ANTES de bajar */
      await CLOUD.pullAll();
      revisarCierreForzado();
      try{ if(session()) revisarMensajesNuevos(); }catch(e){}
      let cambio=false;
      SYNC_KEYS.forEach(k=>{ if(antes[k]!==localStorage.getItem('hotel_'+k)) cambio=true; });
      if(cambio && !hayFormularioActivo()){
        const _sy = (window.scrollY||window.pageYOffset||0);
        aplicarTema(); pintarMarca();
        if(session()) render();
        try{ window.scrollTo(0, _sy); }catch(e){}
      }
    }catch(e){ /* sin conexión: seguimos con los datos del equipo */ }
  }, 6000);
}

/* ====== APP INSTALABLE (PWA) ====== */
let _promptInstalar = null;
function esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function yaInstalada(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function mostrarBotonInstalar(mostrar){ const b=document.getElementById('btn-instalar'); if(b) b.style.display = mostrar ? 'inline-flex' : 'none'; }
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  _promptInstalar = e;
  if(!yaInstalada()) mostrarBotonInstalar(true);
});
window.addEventListener('appinstalled', function(){
  _promptInstalar = null;
  mostrarBotonInstalar(false);
});
function instalarApp(){
  if(_promptInstalar){
    _promptInstalar.prompt();
    _promptInstalar.userChoice.finally(function(){ _promptInstalar=null; mostrarBotonInstalar(false); });
    return;
  }
  var pasos;
  if(esIOS()){
    pasos = '<ol style="margin:10px 0 0 18px;line-height:1.7;font-size:14px">'+
      '<li>Toca el botón <b>Compartir</b> (el cuadro con la flecha hacia arriba, abajo en Safari).</li>'+
      '<li>Baja y toca <b>“Agregar a inicio”</b> / <b>“Añadir a pantalla de inicio”</b>.</li>'+
      '<li>Toca <b>Agregar</b>. Ya tendrás el ícono del hotel en tu teléfono.</li></ol>';
  } else {
    pasos = '<ol style="margin:10px 0 0 18px;line-height:1.7;font-size:14px">'+
      '<li>En la barra de direcciones, arriba a la derecha, busca el ícono de <b>instalar</b> (una pantallita con una flecha) o abre el menú <b>⋮</b>.</li>'+
      '<li>Elige <b>“Instalar Gestión Hotel Laja Real”</b> o <b>“Instalar aplicación”</b>.</li>'+
      '<li>Confirma. La app quedará en tu escritorio o pantalla de inicio.</li></ol>'+
      '<p style="font-size:12.5px;color:#667;margin-top:10px">Nota: debes abrir la página desde su enlace de internet (no desde un archivo), y con el candado de seguridad (https).</p>';
  }
  showModal('<div style="max-width:460px"><div class="section-title" style="font-size:16px">⬇️ Instalar la app</div>'+
    '<p style="font-size:14px;color:#44526a">Puedes dejar el Hotel Laja Real como una aplicación en tu equipo o teléfono:</p>'+
    pasos+
    '<div style="text-align:right;margin-top:16px"><button class="btn-primary" onclick="cerrarModal()">Entendido</button></div></div>');
}
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* sin service worker: la app funciona igual */ });
  });
  // En iPhone no existe beforeinstallprompt: mostramos el botón con instrucciones.
  if(esIOS() && !yaInstalada()) mostrarBotonInstalar(true);
}

async function bootstrap(){
  try{ await CLOUD.pullAll(); }catch(e){ /* sin conexión al iniciar: usamos datos del equipo */ }
  seed();                 // completa cajas que falten (sin pisar lo que ya hay)
  CLOUD.ready = true;
  try{ await CLOUD.pushMissing(); }catch(e){}  // primer equipo: sube lo que la nube aún no tiene
  try{ await CLOUD.flushQueue(); }catch(e){}   // sube lo que haya quedado pendiente de una sesion previa
  aplicarTema(); pintarMarca(); openApp();
  startPolling();
}
/* Apenas vuelve el internet, intenta subir la cola de una vez */
window.addEventListener('online', function(){ try{ CLOUD.flushQueue(); }catch(e){} });
bootstrap();
