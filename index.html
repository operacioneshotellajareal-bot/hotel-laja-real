<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Hotel · 65 Habitaciones</title>
<!-- ===== App instalable (PWA) ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hotel Laja Real">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--azul:#0d3b66;--azul2:#1b6ca8;--verde:#2e9e5b;--rojo:#d64045;--naranja:#e8871e;--gris:#7a8699;--morado:#6a4c93;--bg:#eef1f6;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1c2430;min-height:100vh;}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:10px 16px;transition:.15s;}
button:active{transform:scale(.97);}
.btn-primary{background:var(--azul2);color:#fff;}
.btn-primary:hover{background:var(--azul);}
.btn-ghost{background:#e3e8f0;color:#2c3a4f;}
.btn-green{background:var(--verde);color:#fff;}
.btn-red{background:var(--rojo);color:#fff;}
.btn-orange{background:var(--naranja);color:#fff;}
.btn-gray{background:var(--gris);color:#fff;}
input,select,textarea{width:100%;padding:11px;border:1px solid #c7d0dd;border-radius:8px;font-size:15px;margin-top:4px;font-family:inherit;box-sizing:border-box;}
textarea{resize:vertical;}
label{font-size:13px;font-weight:600;color:#44526a;}
/* LOGIN */
#view-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--card);width:360px;max-width:100%;padding:34px;border-radius:16px;box-shadow:0 10px 40px rgba(13,59,102,.15);}
.login-card h1{font-size:22px;color:var(--azul);text-align:center;margin-bottom:4px;}
.login-card p.sub{text-align:center;color:#8893a5;font-size:13px;margin-bottom:22px;}
.login-card .field{margin-bottom:14px;}
.login-card button{width:100%;margin-top:8px;padding:12px;}
.login-err{color:var(--rojo);font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.hint{margin-top:18px;font-size:11.5px;color:#9aa4b4;text-align:center;line-height:1.6;}
/* TOPBAR */
#view-app{display:none;}
.topbar{background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.topbar .brand{font-size:17px;font-weight:700;}
.topbar .right{display:flex;align-items:center;gap:14px;font-size:13px;}
.role-badge{background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-weight:600;}
.notif-wrap{position:relative;}
.bell{background:rgba(255,255,255,.18);border:none;color:#fff;cursor:pointer;font-size:16px;line-height:1;padding:7px 11px;border-radius:20px;position:relative;}
.bell:hover{background:rgba(255,255,255,.3);}
.bell .cnt{position:absolute;top:-5px;right:-5px;background:#e53935;color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px var(--azul);}
.notif-panel{position:absolute;top:46px;right:0;width:330px;max-width:88vw;max-height:72vh;overflow:auto;background:#fff;color:#1c2430;border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.28);z-index:60;padding:8px;}
.notif-head{font-weight:700;font-size:14px;padding:8px 8px 4px;color:#0d3b66;}
.notif-item{border-radius:11px;padding:11px 13px;margin:7px 4px;border:1px solid;}
.notif-item .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.notif-item .d{font-size:12.5px;margin-top:4px;line-height:1.45;}
.notif-item .a{margin-top:9px;}
.notif-empty{padding:22px 10px;text-align:center;color:#8893a5;font-size:13px;}
.content{max-width:1150px;margin:0 auto;padding:20px;}
.section-title{font-size:19px;color:var(--azul);margin:6px 0 14px;font-weight:700;}
/* STATS */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.stat{flex:1;min-width:120px;background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:5px solid var(--gris);}
.stat .n{font-size:26px;font-weight:800;}
.stat .l{font-size:12px;color:#7a8699;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
/* ROOM GRID */
.floor{margin-bottom:22px;}
.floor h3{font-size:14px;color:#55637a;margin-bottom:10px;font-weight:700;}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
.room{border-radius:12px;padding:12px 8px;text-align:center;color:#fff;cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:.15s;}
.room:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.2);}
.room .num{font-size:19px;font-weight:800;}
.room .st{font-size:10.5px;font-weight:600;opacity:.95;margin-top:3px;text-transform:uppercase;letter-spacing:.3px;}
.room .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85);}
.room .badge-pago{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#ffd400;color:#7a2e00;font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap;border:1px solid #d9a400;}
@keyframes pulsoPago{0%,100%{box-shadow:0 1px 4px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 4px rgba(255,212,0,.45)}}
.room .badge-pago.urgente{background:#e23b3b;color:#fff;border-color:#b02525;animation:pulsoPago 1.1s infinite;}
.e-libre{background:var(--verde);}
.e-ocupada{background:var(--rojo);}
.e-sucia{background:var(--naranja);}
.e-limpieza{background:var(--azul2);}
.e-mantenimiento{background:var(--gris);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:12.5px;}
.legend span{display:flex;align-items:center;gap:6px;color:#55637a;font-weight:600;}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;}
/* LIST */
.task-list{display:flex;flex-direction:column;gap:10px;}
.task{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05);gap:12px;flex-wrap:wrap;}
.task .info{flex:1;min-width:180px;}
.task .info b{font-size:16px;color:var(--azul);}
.task .info .meta{font-size:12.5px;color:#7a8699;margin-top:3px;}
.task .acts{display:flex;gap:8px;flex-wrap:wrap;}
.empty{text-align:center;color:#9aa4b4;padding:40px;font-size:15px;}
.prio{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;}
.prio-alta{background:#fde2e2;color:#c0392b;}
.prio-media{background:#fff3d6;color:#b8791a;}
.prio-baja{background:#e2f0e4;color:#2e7d46;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(13,30,55,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:16px;width:420px;max-width:100%;padding:24px;max-height:90vh;overflow:auto;}
.modal h2{font-size:19px;color:var(--azul);margin-bottom:4px;}
.modal .rstate{font-size:13px;font-weight:600;margin-bottom:16px;}
.modal .field{margin-bottom:12px;}
.modal .actions{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.modal .close{float:right;background:none;color:#8893a5;font-size:22px;padding:0;margin-top:-8px;}
.divider{height:1px;background:#eef1f6;margin:14px 0;}
/* ADMIN users */
.users-table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);border-collapse:collapse;}
.users-table th{background:#f3f6fb;text-align:left;padding:11px 14px;font-size:12.5px;color:#55637a;}
.users-table td{padding:11px 14px;border-top:1px solid #eef1f6;font-size:14px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab{background:#e3e8f0;color:#2c3a4f;padding:9px 16px;border-radius:20px;font-weight:600;font-size:13.5px;cursor:pointer;}
.tab.active{background:var(--azul);color:#fff;}
@media(max-width:600px){
  .content{padding:14px;}
  .section-title{font-size:17px;}
  .topbar{padding:10px 14px;}
  .topbar .brand{font-size:15px;}
  .topbar .right{gap:8px;font-size:12px;}
  .role-badge{padding:4px 9px;}
  .stats{gap:8px;}
  .stat{min-width:calc(50% - 4px);padding:11px 12px;}
  .stat .n{font-size:21px;}
  .rooms{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px;}
  .tab{flex:0 0 auto;white-space:nowrap;padding:8px 13px;font-size:13px;}
  .users-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  .modal{padding:18px;}
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="view-login">
  <div class="login-card">
    <h1>🏨 Gestión Hotel</h1>
    <p class="sub">Sistema de operaciones · 65 habitaciones</p>
    <div class="field"><label>Usuario</label><input id="in-user" autocomplete="username" placeholder="ej: recepcion"></div>
    <div class="field"><label>Contraseña</label><input id="in-pass" type="password" autocomplete="current-password" placeholder="••••"></div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="hint" id="login-hint"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="view-app">
  <div class="topbar">
    <div class="brand">🏨 Gestión Hotel</div>
    <div class="right">
      <button class="btn-orange" id="btn-instalar" style="display:none;padding:7px 12px;font-size:12.5px" onclick="instalarApp()">⬇️ Instalar app</button>
      <div class="notif-wrap" id="notif-wrap" style="display:none">
        <button class="bell" id="btn-notif" title="Notificaciones" onclick="toggleNotif(event)">🔔<span class="cnt" id="notif-count" style="display:none">0</span></button>
        <div class="notif-panel" id="notif-panel" style="display:none" onclick="event.stopPropagation()"></div>
      </div>
      <span id="who"></span>
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-ghost" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ====== CONEXIÓN A LA NUBE (Supabase) ====== */
const SB_URL = 'https://wazhhzbwmzitqlgoxjuf.supabase.co';
const SB_KEY = 'sb_publishable_PJfzZshU0tA9FigMiysl1Q_1wMFjKHJ';
/* Cuenta con la que la app "entra" a la nube (seguridad nivel suficiente).
   Debes crear ESTE MISMO usuario en Supabase (Authentication). */
const SB_APP_EMAIL = 'operador@hotellajareal.com';
const SB_APP_PASS  = 'LajaReal2026-Caja';
/* Cajas de datos que se comparten entre todos los equipos.
   OJO: 'session' NO se comparte (cada equipo inicia sesión aparte). */
const SYNC_KEYS = ['rooms','users','clientes','pagos','reportes','turnos','kardex','tasa','hotel','metodosPago','pagoControl','tiposHab','preciosTipo','permisos','presencia','impresion','reservas','promos','forzarCierre'];

/* ====== ALMACENAMIENTO (local + nube) ====== */
const DB = {
  get(k, def){ try{ const v = localStorage.getItem('hotel_'+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k, val){
    localStorage.setItem('hotel_'+k, JSON.stringify(val));
    try{ if(typeof CLOUD!=='undefined') CLOUD.push(k, val); }catch(e){}
  }
};

const CLOUD = {
  ready:false,
  enabled: !!(SB_URL && SB_KEY),
  _cloudKeys:[],
  _token:null, _refresh:null, _exp:0,
  _authEnabled: !!(SB_APP_EMAIL && SB_APP_PASS),
  _h(extra){ const auth = this._token ? ('Bearer '+this._token) : ('Bearer '+SB_KEY); return Object.assign({'apikey':SB_KEY,'Authorization':auth,'Content-Type':'application/json'}, extra||{}); },
  async signIn(){
    if(!this._authEnabled) return;
    try{
      const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body: JSON.stringify({email:SB_APP_EMAIL, password:SB_APP_PASS})});
      if(!r.ok) throw new Error('signin '+r.status);
      const d = await r.json();
      this._token=d.access_token; this._refresh=d.refresh_token; this._exp=Date.now()+((d.expires_in||3600)*1000);
    }catch(e){ this._token=null; this._refresh=null; this._exp=0; }
  },
  async _refreshTok(){
    if(!this._authEnabled || !this._refresh){ return this.signIn(); }
    try{
      const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body: JSON.stringify({refresh_token:this._refresh})});
      if(!r.ok) throw new Error('refresh '+r.status);
      const d = await r.json();
      this._token=d.access_token; this._refresh=d.refresh_token; this._exp=Date.now()+((d.expires_in||3600)*1000);
    }catch(e){ await this.signIn(); }
  },
  async ensureAuth(){
    if(!this._authEnabled) return;
    if(!this._token){ await this.signIn(); return; }
    if(Date.now() > (this._exp - 60000)){ await this._refreshTok(); }
  },
  async pullAll(){
    if(!this.enabled) return;
    await this.ensureAuth();
    let r = await fetch(SB_URL+'/rest/v1/estado_app?select=clave,valor', {headers:this._h()});
    if(r.status===401 && this._authEnabled){ await this.signIn(); r = await fetch(SB_URL+'/rest/v1/estado_app?select=clave,valor', {headers:this._h()}); }
    if(!r.ok) throw new Error('pull '+r.status);
    const rows = await r.json();
    this._cloudKeys = rows.map(x=>x.clave);
    rows.forEach(row=>{ if(SYNC_KEYS.includes(row.clave)){ localStorage.setItem('hotel_'+row.clave, JSON.stringify(row.valor)); } });
  },
  async push(k, val){
    if(!this.enabled || !this.ready) return;
    if(!SYNC_KEYS.includes(k)) return;
    try{
      await this.ensureAuth();
      const body = JSON.stringify({clave:k, valor:val, actualizado:new Date().toISOString()});
      let r = await fetch(SB_URL+'/rest/v1/estado_app?on_conflict=clave', {method:'POST', headers:this._h({'Prefer':'resolution=merge-duplicates'}), body});
      if(r.status===401 && this._authEnabled){ await this.signIn(); await fetch(SB_URL+'/rest/v1/estado_app?on_conflict=clave', {method:'POST', headers:this._h({'Prefer':'resolution=merge-duplicates'}), body}); }
    }catch(e){ /* sin conexión: queda guardado en el equipo y se subirá luego */ }
  },
  async pushMissing(){
    if(!this.enabled) return;
    await this.ensureAuth();
    for(const k of SYNC_KEYS){
      const local = DB.get(k);
      if(local!==undefined && local!==null && !this._cloudKeys.includes(k)){ await this.push(k, local); }
    }
  },
  async clearAll(){
    if(!this.enabled) return;
    await this.ensureAuth();
    let r = await fetch(SB_URL+'/rest/v1/estado_app?clave=not.is.null', {method:'DELETE', headers:this._h()});
    if(r.status===401 && this._authEnabled){ await this.signIn(); r = await fetch(SB_URL+'/rest/v1/estado_app?clave=not.is.null', {method:'DELETE', headers:this._h()}); }
    this._cloudKeys=[];
  }
};

/* ====== DATOS INICIALES ====== */
const ESTADOS = {
  libre:{t:'Libre',c:'e-libre'},
  ocupada:{t:'Ocupada',c:'e-ocupada'},
  sucia:{t:'Por limpiar',c:'e-sucia'},
  limpieza:{t:'En limpieza',c:'e-limpieza'},
  mantenimiento:{t:'Mantenimiento',c:'e-mantenimiento'}
};
const TIPOS = ['Individual','Matrimonial','Doble','Triple','Dúplex','Suite'];

function seed(){
  if(!DB.get('rooms')){
    const rooms = [];
    for(let p=1; p<=5; p++){
      for(let n=1; n<=13; n++){
        rooms.push({ num: p*100+n, piso:p, tipo:'Individual', tarifa:0, estado:'libre', huesped:'', personas:0, checkin:'', salida:'', nota:'' });
      }
    }
    DB.set('rooms', rooms);
  }
  if(!DB.get('users')){
    DB.set('users', [
      {user:'admin', pass:'admin', rol:'admin', nombre:'Administrador'},
      {user:'recepcion', pass:'1234', rol:'recepcion', nombre:'Recepción'},
      {user:'limpieza', pass:'1234', rol:'housekeeping', nombre:'Ama de Llaves'},
      {user:'mantenimiento', pass:'1234', rol:'mantenimiento', nombre:'Mantenimiento'}
    ]);
  }
  if(!DB.get('reportes')) DB.set('reportes', []);
  if(DB.get('tasa')===undefined) DB.set('tasa', 888.12);
  if(!DB.get('pagos')) DB.set('pagos', []);
  if(!DB.get('metodosPago')) DB.set('metodosPago', METODOS.slice());
  if(DB.get('pagoControl')===undefined) DB.set('pagoControl', 0);
  if(!DB.get('tiposHab')) DB.set('tiposHab', TIPOS.slice());
  if(!DB.get('preciosTipo')) DB.set('preciosTipo', {});
  if(!DB.get('permisos')) DB.set('permisos', {});
}

const ROLES = {
  master:'Master / Dueño', admin:'Master / Dueño',
  recepcion:'Recepcionista', supervisor:'Supervisor de recepción',
  housekeeping:'Ama de Llaves', mantenimiento:'Mantenimiento'
};
function esMaster(rol){ return rol==='master'||rol==='admin'; }
function rolOptions(sel){
  const opts=[['recepcion','Recepcionista'],['supervisor','Supervisor de recepción'],['housekeeping','Ama de Llaves'],['mantenimiento','Mantenimiento'],['master','Master / Dueño']];
  return opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>').join('');
}
function countMasters(){ return DB.get('users',[]).filter(u=>esMaster(u.rol)).length; }
/* ---- Permisos configurables por rol (los decide el Master) ---- */
const PERMISOS_CATALOGO=[
  ['anularPagos','Anular cobros en caja','Permite borrar/anular un cobro ya registrado en Caja.'],
  ['verReportePagos','Ver el reporte de pagos por fechas','Muestra la pestaña “Reporte de pagos” con los totales por rango.'],
  ['gestionHab','Gestionar habitaciones, tipos y precios','Le da la pestaña “Habitaciones” para crear/editar habitaciones, tipos y precios base.'],
  ['verResumenOcupacion','Ver resumen de ocupación','Muestra en el Mapa de habitaciones el panel con el % de ocupación y cuántas habitaciones hay libres y ocupadas (sin montos de dinero).'],
  ['verOcupacionTipo','Ver ocupación por tipo de habitación','Muestra en el Mapa de habitaciones una tabla con cada tipo: cuántas habitaciones hay, ocupadas, libres y el % de ocupación (sin montos de dinero).'],
  ['editarTasa','Modificar la tasa Bs/$','Le da la pestaña “Tasa Bs/$” para fijar la tasa a mano o traer la oficial del BCV.'],
  ['verMantenimiento','Ver la pestaña de Mantenimiento','Muestra la pestaña “Mantenimiento” con los reportes de habitaciones en reparación y resueltos, y el botón para imprimir el reporte.']
];
const ROLES_CONFIGURABLES=['recepcion','supervisor'];
function permisosDefault(rol){ return {anularPagos:false, gestionHab:false, verReportePagos:true, verResumenOcupacion:(rol==='supervisor'), verOcupacionTipo:true, editarTasa:true, verMantenimiento:(rol==='supervisor')}; }
function permisosDe(rol){ const p=DB.get('permisos',null); const sp=(p&&p[rol])?p[rol]:{}; return Object.assign(permisosDefault(rol), sp); }
function setPermiso(rol,k,v){ const p=DB.get('permisos',{})||{}; if(!p[rol]) p[rol]={}; p[rol][k]=!!v; DB.set('permisos', p); }
function puede(k){ const rol=session().rol; if(esMaster(rol)) return true; if(ROLES_CONFIGURABLES.indexOf(rol)>=0) return !!permisosDe(rol)[k]; return false; }
/* compatibilidad con código anterior */
function permisosSup(){ return permisosDe('supervisor'); }
function setPermisoSup(k,v){ setPermiso('supervisor',k,v); }
function puedeSup(k){ return puede(k); }

/* ====== SESIÓN / LOGIN ====== */
async function login(){
  const u = document.getElementById('in-user').value.trim().toLowerCase();
  const p = document.getElementById('in-pass').value;
  const found = DB.get('users',[]).find(x=>x.user===u && x.pass===p);
  if(!found){ document.getElementById('login-err').innerText='Usuario o contraseña incorrectos'; return; }
  // Traer el estado más reciente de la nube para saber quién está conectado
  try{ if(typeof CLOUD!=='undefined' && CLOUD.enabled){ await CLOUD.pullAll(); } }catch(e){}
  if(usuarioYaConectado(u)){ document.getElementById('login-err').innerText='Este usuario ya tiene una sesión abierta en otro equipo. Cierra la sesión allí o espera un momento e inténtalo de nuevo.'; return; }
  DB.set('session', Object.assign({}, found, {loginTs:Date.now()}));
  document.getElementById('login-err').innerText='';
  document.getElementById('in-pass').value='';
  presenciaLatido();
  openApp();
}
function logout(){
  const act = turnoActivo();
  const s = session();
  if(act && s && act.usuario===s.user){

/* ====== PRESENCIA: quién está conectado ====== */
function deviceId(){

  if(!d){ d='dev'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('hotel_deviceId', d); }
  return d;
}
function presenciaObj(){ const p=DB.get('presencia',{}); return (p&&typeof p==='object'&&!Array.isArray(p))?p:{}; }
function presenciaActivos(maxMs){
  maxMs=maxMs||40000; const now=Date.now(); const o=presenciaObj(); const out=[];
  Object.keys(o).forEach(k=>{ const e=o[k]; if(e&&e.ts&&(now-e.ts)<maxMs) out.push(e); });
  return out;
}
function presenciaLatido(){
  const s=session(); if(!s) return;
  const o=presenciaObj(); const now=Date.now();
  Object.keys(o).forEach(k=>{ if(!o[k]||!o[k].ts||(now-o[k].ts)>120000) delete o[k]; });
  o[deviceId()]={ deviceId:deviceId(), user:s.user, nombre:s.nombre, rol:s.rol, ts:now };
  DB.set('presencia', o);
}
function presenciaSalir(){ const o=presenciaObj(); delete o[deviceId()]; DB.set('presencia', o); }
function usuarioYaConectado(user){
  const now=Date.now(); const o=presenciaObj(); const my=deviceId();
  return Object.keys(o).some(k=>{ const e=o[k]; return e && e.user===user && e.deviceId!==my && e.ts && (now-e.ts)<40000; });
}

function cerrarSesionRemota(dev, nombre){
  if(dev===deviceId()){ alert('Esa es tu propia sesión en este equipo. Para salir usa el botón “Salir” de arriba.'); return; }
  if(!confirm('¿Cerrar la sesión de '+(nombre||'este equipo')+'?\n\nLa persona tendrá que iniciar sesión otra vez.')) return;
  const fc=DB.get('forzarCierre',{})||{};
  const lim=Date.now()-86400000; Object.keys(fc).forEach(k=>{ if(!fc[k]||fc[k]<lim) delete fc[k]; });
  fc[dev]=Date.now(); DB.set('forzarCierre', fc);
  const o=presenciaObj(); if(o[dev]){ delete o[dev]; DB.set('presencia', o); }
  render();

}

function pmSyncSingle(prefix, totalUsd){
  if(PM_STATE[prefix]) PM_STATE[prefix].total=Number(totalUsd)||0;

  if(rows.length===1){ const inp=rows[0].querySelector('.'+prefix+'-pm-monto'); if(inp) inp.value=(Number(totalUsd)||0)>0?Number(totalUsd).toFixed(2):''; }

function pmRecalc(prefix){
  const st=PM_STATE[prefix]||{total:0};
  const asig=pmAsignado(prefix);
  const a=document.getElementById(prefix+'-pm-asig'); if(a) a.innerText=fmtUSD(asig);

  else if(Math.abs(dif)<0.01) f.innerHTML='<span style="color:var(--verde);font-weight:700">✓ Completo</span>';
  else if(dif>0) f.innerHTML='Falta: <b style="color:#c0392b">'+fmtUSD(dif)+'</b>';

function pmLeer(prefix){
  const st=PM_STATE[prefix]||{total:0};
  const rows=Array.prototype.slice.call(document.querySelectorAll('#'+prefix+'-pm-lineas .pm-linea'));
  let lineas=[];
  rows.forEach(row=>{ const met=row.querySelector('.'+prefix+'-pm-met').value; const mo=parseFloat(row.querySelector('.'+prefix+'-pm-monto').value)||0; const refEl=row.querySelector('.'+prefix+'-pm-ref'); const ref=refEl?(refEl.value||'').trim():''; if(mo>0) lineas.push({metodo:met, montoUsd:mo, ref:ref}); });
  if(lineas.length===0 && rows.length===1 && (st.total||0)>0){ const r0=rows[0]; const refEl=r0.querySelector('.'+prefix+'-pm-ref'); lineas.push({metodo:r0.querySelector('.'+prefix+'-pm-met').value, montoUsd:st.total, ref:refEl?(refEl.value||'').trim():''}); }
  if(lineas.length===0) return {ok:false, msg:'Indica al menos una forma de pago con su monto.'};
  const suma=lineas.reduce((s,l)=>s+l.montoUsd,0);
  if((st.total||0)>0 && Math.abs(suma-st.total)>0.01) return {ok:false, msg:'Los montos de las formas de pago ('+fmtUSD(suma)+') no coinciden con el total a cobrar ('+fmtUSD(st.total)+'). Ajusta los montos.'};
  lineas.forEach(l=>{ l.montoBs=precioBs(l.montoUsd); });
  const metodoStr=lineas.map(l=>{ let s=l.metodo; if(lineas.length>1) s+=' ('+fmtUSD(l.montoUsd)+')'; if(l.ref) s+=' [Ref: '+l.ref+']'; return s; }).join(' + ');
  return {ok:true, metodos:lineas, metodoStr:metodoStr, totalUsd:suma};
}

function roomCard(r){
  const e = ESTADOS[r.estado];

  if(r.estado==='ocupada' && habSinPagar(r)){
    badge='<div class="badge-pago'+(pasoHoraSalida()?' urgente':'')+'">SIN PAGAR</div>';
  }
  return '<div class="room '+e.c+'" onclick="abrirHab('+r.num+')"><div class="dot"></div>'+badge+
    '<div class="num">'+r.num+'</div><div class="st">'+e.t+'</div><div class="st" style="opacity:.8;font-size:9.5px">'+(r.tipo||'')+'</div></div>';
}
function saldoDeHab(r){
  if(!r || r.estado!=='ocupada') return 0;
  const noches=r.noches||1; const hosp=Number(r.tarifa||0)*noches; const d=descUsd(r);
  const cons=cargosDe(r).filter(c=>!c.pagado).reduce((s,c)=>s+Number(c.montoUsd||0),0);
  const ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce((s,a)=>s+Number(a.montoUsd||0),0);
  return Math.max(0,(hosp-d+cons)-ab);
}
function habSinPagar(r){ return saldoDeHab(r)>0.009; }
function pasoHoraSalida(){ const n=new Date(); return n.getHours()>=12; }

function statsNegocio(soloOcupacion){
  const rs=rooms(); const total=rs.length||1;
  const ocup=rs.filter(r=>r.estado==='ocupada').length;
  const pct=Math.round(ocup*100/total);
  const libres=rs.filter(r=>r.estado==='libre').length;
  let h='<div class="stats">';
  h+='<div class="stat" style="border-left-color:var(--morado)"><div class="n">'+pct+'%</div><div class="l">Ocupación ahora ('+ocup+' de '+total+')</div></div>';
  if(soloOcupacion){
    h+='<div class="stat" style="border-left-color:var(--verde)"><div class="n">'+libres+'</div><div class="l">Habitaciones libres</div></div>';
    h+='<div class="stat" style="border-left-color:var(--rojo)"><div class="n">'+ocup+'</div><div class="l">Habitaciones ocupadas</div></div>';
    h+='</div>';
    return h;
  }
  const pad=n=>String(n).padStart(2,'0'); const now=new Date();
  const hoy=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  const mes=now.getFullYear()+'-'+pad(now.getMonth()+1);
  let hoyBs=0, mesBs=0, nHoy=0, nMes=0;
  DB.get('pagos',[]).forEach(p=>{
    if(!p.dia) return; const bs=Number(p.montoBs)||0; const d=String(p.dia);
    if(d===hoy){ hoyBs+=bs; nHoy++; }
    if(d.slice(0,7)===mes){ mesBs+=bs; nMes++; }
  });
  let nombreMes=now.toLocaleDateString('es-VE',{month:'long',year:'numeric'});
  nombreMes=nombreMes.charAt(0).toUpperCase()+nombreMes.slice(1);
  h+='<div class="stat" style="border-left-color:var(--verde)"><div class="n" style="font-size:20px">'+fmtBs(hoyBs)+'</div><div class="l">Ingresos de hoy ('+nHoy+' cobros)</div></div>';
  h+='<div class="stat" style="border-left-color:var(--azul2)"><div class="n" style="font-size:20px">'+fmtBs(mesBs)+'</div><div class="l">Ingresos de '+esc(nombreMes)+' ('+nMes+' cobros)</div></div>';
  h+='</div>';
  return h;
}
function legend(){
  let h='<div class="legend">';

}

function waNum(tel){
  var d=String(tel||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.slice(0,2)==='58') return d;
  if(d.charAt(0)==='0') return '58'+d.slice(1);
  if(d.length===10) return '58'+d;
  return d;
}
function abrirWa(tel, msg){
  var n=waNum(tel);
  if(!n){ alert('No hay un número de WhatsApp válido. Escríbelo e inténtalo de nuevo.'); return; }
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg||''), '_blank');
}
function abrirMail(correo, asunto, cuerpo){
  correo=String(correo||'').trim();
  if(!correo || correo.indexOf('@')<1){ alert('No hay un correo válido. Escríbelo e inténtalo de nuevo.'); return; }
  window.location.href='mailto:'+correo+'?subject='+encodeURIComponent(asunto||'')+'&body='+encodeURIComponent(cuerpo||'');
}

let resBuscar='';

function nuevoLocalizador(){
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin O,0,I,1
  const usados = reservas().map(r=>String(r.loc||'').toUpperCase());
  let loc='';
  do{
    loc='LR-';
    for(let i=0;i<5;i++) loc+=abc.charAt(Math.floor(Math.random()*abc.length));
  }while(usados.indexOf(loc)>=0);

  const a=new Date(ent+'T00:00:00'), b=new Date(sal+'T00:00:00');

  return d>0?d:1;
}

function guardarReserva(loc){
  const nombre=document.getElementById('res-nombre').value.trim();
  const docNum=document.getElementById('res-docnum').value.trim();
  const entrada=document.getElementById('res-entrada').value;
  const salida=document.getElementById('res-salida').value;
  if(!nombre){ alert('Escribe el nombre del huésped.'); return; }
  if(!docNum){ alert('Escribe la cédula o pasaporte del huésped. Así al llegar lo registramos automáticamente.'); return; }
  if(!entrada || !salida){ alert('Elige la fecha de llegada y la de salida.'); return; }
  if(diffNoches(entrada,salida)<1 || new Date(salida)<=new Date(entrada)){ alert('La fecha de salida debe ser después de la de llegada.'); return; }
  const empRaw=document.getElementById('res-empresaref').value.trim();
  const emp=empRaw?empresaPorRef(empRaw):null;
  const empRef=emp?((emp.codigo||emp.nombre||empRaw)):empRaw;
  const datos={
    canal:document.getElementById('res-canal').value,
    nombre:nombre,
    apellido:document.getElementById('res-apellido').value.trim(),
    docTipo:document.getElementById('res-doctipo').value,
    docNum:docNum,
    telefono:document.getElementById('res-telefono').value.trim(),
    correo:document.getElementById('res-correo').value.trim(),
    empresaRef:empRef,
    fechaEntrada:entrada,
    fechaSalida:salida,
    noches:diffNoches(entrada,salida),
    tipoPreferido:document.getElementById('res-tipo').value,
    personas:parseInt(document.getElementById('res-personas').value)||1,
    ninos:parseInt(document.getElementById('res-ninos').value)||0,
    acompanantes:colectarAcomp('res', parseInt(document.getElementById('res-personas').value)||1),
    tarifa:parseFloat(document.getElementById('res-tarifa').value)||0,
    notas:document.getElementById('res-notas').value.trim()
  };
  const list=reservas();
  if(loc){
    const r=list.find(x=>x.loc===loc); if(!r){ alert('No se encontró la reserva.'); return; }
    Object.assign(r, datos);
    saveReservas(list); cerrarModal(); render();
    alert('Reserva '+loc+' actualizada.');
  } else {
    const nuevaLoc=nuevoLocalizador();
    list.push(Object.assign({loc:nuevaLoc, estado:'pendiente', hab:'', creado:new Date().toISOString()}, datos));
    saveReservas(list); cerrarModal(); render();
    const _rc=reservas().find(x=>x.loc===nuevaLoc)||Object.assign({loc:nuevaLoc}, datos);
    modalEnvio({ titulo:'✅ Reserva creada', sub:'Número localizador: <b style="font-family:monospace;font-size:16px;color:var(--azul)">'+esc(nuevaLoc)+'</b><br>Puedes enviarlo al huésped ahora mismo:', tel:datos.telefono, correo:datos.correo, asunto:'Tu reserva en '+nombreHotelMsg()+' · '+nuevaLoc, mensaje:msgReservaTxt(_rc) });
  }
}

function confirmarCheckinReserva(loc){
  if(guardTurno()) return;
  const list=reservas(); const r=list.find(x=>x.loc===loc); if(!r){ alert('No se encontró la reserva.'); return; }
  const num=parseInt(document.getElementById('cr-hab').value);
  const hab=findRoom(num);
  if(!hab){ alert('Elige una habitación.'); return; }
  if(hab.estado!=='libre'){ alert('Esa habitación ya no está libre. Elige otra.'); return; }
  const noches=parseInt(document.getElementById('cr-noches').value)||1;
  const tarifa=parseFloat(document.getElementById('cr-tarifa').value)||0;
  const nom=((r.nombre||'')+' '+(r.apellido||'')).trim()||r.nombre||'Huésped';

  let clienteId='';

  if(existe){ clienteId=existe.id; }
  else{
    const nuevo={id:'c'+Date.now(), tipo:'persona', nombre:r.nombre||nom, apellido:r.apellido||'', docTipo:r.docTipo||'V', docNum:r.docNum||'', correo:r.correo||'', telefono:r.telefono||'', ocupacion:'', ciudad:'', empresaRef:r.empresaRef||'', notas:'', historial:[], creado:new Date().toISOString()};
    const cl=clientes(); cl.push(nuevo); saveClientes(cl); clienteId=nuevo.id;
  }

  const acs=acompDe(r);

  updateRoom(num,{estado:'ocupada', huesped:nom, clienteId:clienteId, personas:r.personas||1, ninos:r.ninos||0, acompanantes:acs, noches:noches, tarifa:tarifa, empresaRef:r.empresaRef||'', checkin:new Date().toLocaleDateString('es-VE'), salida:r.fechaSalida||''});
  logKardex('checkin', {hab:num, huesped:nom, clienteId:clienteId, detalle:'Reserva '+r.loc+' · '+noches+' noche(s) · '+fmtUSD(tarifa)+'/noche'+(emp?(' · Empresa: '+(emp.nombre||r.empresaRef)):'')+extras, montoUsd:0, montoBs:0, metodo:''});

      body += '</div></div>';
      body += '<div id="m-multi-total"></div>';
    }
    body += desgloseBox(r.tarifa, 1, 'in');
    body += '<div class="divider"></div><div class="actions">';
    body += '<button class="btn-green" onclick="checkin('+num+')">Confirmar check-in</button>';
    body += '<button class="btn-gray" onclick="aMantenimiento('+num+')">Enviar a mantenimiento</button>';

  } else {
    body += '<div class="field"><label>Tarifa por noche</label><div style="font-weight:700;margin-top:4px;font-size:15px">'+precioLinea(r.tarifa)+'</div></div>';

  }
  showModal(body);
}
function stateColor(e){ return {libre:'var(--verde)',ocupada:'var(--rojo)',sucia:'var(--naranja)',limpieza:'var(--azul2)',mantenimiento:'var(--gris)'}[e]; }
function showModal(h){ document.getElementById('modal').innerHTML=h; document.getElementById('modal-bg').style.display='flex'; }
function cerrarModal(){ document.getElementById('modal-bg').style.display='none'; }
function modalTieneForm(){ const m=document.getElementById('modal'); if(!m) return false; return m.querySelector('input, textarea, select')!==null; }
document.getElementById('modal-bg').addEventListener('click',e=>{
  if(e.target.id!=='modal-bg') return;

});

function clienteCheckinOptions(){
  return clientes().slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).map(c=>{
    const nom = c.tipo==='empresa'?c.nombre:((c.nombre||'')+' '+(c.apellido||'')).trim();
    const doc = c.docNum?(' · '+docLabel(c.docTipo)+' '+c.docNum):'';
    return '<option value="'+c.id+'">'+esc(nom+doc)+'</option>';
  }).join('');
}
function seleccionarCliente(){
  const sel=document.getElementById('m-cliente'); if(!sel) return;
  const id=sel.value;
  const box=document.getElementById('m-guardar-box');
  const inp=document.getElementById('m-huesped');
  if(!id){ if(box) box.style.display='flex'; return; }
  const c=clientes().find(x=>x.id===id);
  if(c && inp){ inp.value = c.tipo==='empresa'?c.nombre:((c.nombre||'')+' '+(c.apellido||'')).trim(); }
  const er=document.getElementById('m-empresaref'); if(er && c && c.tipo!=='empresa' && (c.empresaRef||'').trim()){ er.value=c.empresaRef; autoLlenarEmpresaCheckin(); }
  const chk=document.getElementById('m-guardar'); if(chk) chk.checked=false;
  if(box) box.style.display='none';
}
function normDoc(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function buscarCedula(){
  const inp=document.getElementById('m-cedula'); if(!inp) return;
  const q=normDoc(inp.value);
  const res=document.getElementById('m-cedula-res');
  const sel=document.getElementById('m-cliente');
  if(!q){ if(res) res.innerHTML=''; return; }
  const list=clientes().filter(c=>normDoc(c.docNum).includes(q));
  if(list.length===0){ if(res) res.innerHTML='<span style="color:#b5651d">No hay ningún cliente con esa cédula. Puedes registrarlo marcando “Guardar este huésped”.</span>'; return; }
  const c = list.find(x=>normDoc(x.docNum)===q) || list[0];
  if(sel){ sel.value=c.id; seleccionarCliente(); }
  const nom = c.tipo==='empresa'?c.nombre:((c.nombre||'')+' '+(c.apellido||'')).trim();
  const etq = esc(nom)+' ('+docLabel(c.docTipo)+' '+esc(c.docNum)+')';
  if(res){ res.innerHTML = (list.length>1)
    ? '<span style="color:var(--verde)">✓ '+etq+'</span> <span style="color:#8893a5">y '+(list.length-1)+' más · elige en la lista de abajo</span>'
    : '<span style="color:var(--verde)">✓ Cliente encontrado: '+etq+'</span>'; }
}
function clienteDeHab(r){ return r && r.clienteId ? (clientes().find(c=>c.id===r.clienteId)||null) : null; }
function clienteResumen(c){
  if(!c) return null;
  const nom = c.tipo==='empresa'?(c.nombre||''):((c.nombre||'')+' '+(c.apellido||'')).trim();
  return { nom:nom, tipo:c.tipo, doc:(c.docNum?docLabel(c.docTipo)+' '+c.docNum:''), correo:c.correo||'', ocupacion:c.ocupacion||'', ciudad:c.ciudad||'' };
}
function clienteFichaLink(r){
  if(!r.clienteId) return '';
  const c=clientes().find(x=>x.id===r.clienteId);
  if(!c) return '';
  const extra=[c.docNum?(docLabel(c.docTipo)+' '+c.docNum):'', c.ciudad||''].filter(Boolean).join(' · ');
  return '<div style="font-size:12px;color:#8893a5;font-weight:400;margin-top:2px">Cliente registrado'+(extra?' · '+esc(extra):'')+'</div>';
}
function acompFormHTML(prefix, i, a){
  a=a||{};
  let h='<div style="background:#f6f8fc;border-radius:10px;padding:10px 12px;margin-bottom:8px">';
  h+='<div style="font-size:12px;font-weight:700;color:#55637a;margin-bottom:6px">Acompañante '+(i+1)+'</div>';
  h+='<input id="'+prefix+'-acomp-nombre-'+i+'" class="inp" value="'+escA(a.nombre||'')+'" placeholder="Nombre y apellido">';
  h+='<div style="display:flex;gap:8px;margin-top:6px"><select id="'+prefix+'-acomp-doctipo-'+i+'" class="inp" style="flex:0 0 150px">'+docTipoOptions(a.docTipo||'V')+'</select>';
  h+='<input id="'+prefix+'-acomp-docnum-'+i+'" class="inp" style="flex:1" value="'+escA(a.docNum||'')+'" placeholder="Número de documento"></div>';
  h+='</div>';
  return h;
}
function leerAcompDOM(prefix, max){
  const arr=[];
  for(let i=0;i<max+40;i++){ const nm=document.getElementById(prefix+'-acomp-nombre-'+i); if(!nm){ if(i>max+2) break; continue; } arr.push({nombre:nm.value, docTipo:document.getElementById(prefix+'-acomp-doctipo-'+i).value, docNum:document.getElementById(prefix+'-acomp-docnum-'+i).value}); }
  return arr;
}
function pintarAcomp(prefix, boxId, adultsId, initial){
  const box=document.getElementById(boxId); if(!box) return;
  const adultos=parseInt(document.getElementById(adultsId).value)||1;
  const n=Math.max(0, adultos-1);
  const prev = initial || leerAcompDOM(prefix, n);
  let h='';
  if(n>0){
    h+='<div class="section-title" style="font-size:13px;margin:10px 0 4px">Datos de los acompañantes ('+n+')</div>';
    for(let i=0;i<n;i++){ h+=acompFormHTML(prefix, i, prev[i]||{}); }
  }
  box.innerHTML=h;
}
function colectarAcomp(prefix, adultos){
  const out=[];
  for(let i=0;i<Math.max(0,adultos-1);i++){ const nm=document.getElementById(prefix+'-acomp-nombre-'+i); if(!nm) continue; const nombre=nm.value.trim(); const docNum=document.getElementById(prefix+'-acomp-docnum-'+i).value.trim(); const docTipo=document.getElementById(prefix+'-acomp-doctipo-'+i).value; if(nombre||docNum) out.push({nombre:nombre,docTipo:docTipo,docNum:docNum}); }
  return out;
}
function acompResumenTxt(acs){
  if(!acs || !acs.length) return '';
  return ' · Acompañantes: '+acs.map(a=>(a.nombre||'')+(a.docNum?(' ('+docLabel(a.docTipo)+' '+a.docNum+')'):'')).join('; ');
}
function acompDe(o){
  if(o && Array.isArray(o.acompanantes)) return o.acompanantes;
  if(o && o.tieneAcomp && (o.acompNombre||o.acompDocNum)) return [{nombre:o.acompNombre,docTipo:o.acompDocTipo,docNum:o.acompDocNum}];
  return [];
}
function renderAcompCheckin(){ pintarAcomp('m','m-acomp-box','m-personas'); }
function toggleMultiHab(){ const chk=document.getElementById('m-multi'); const box=document.getElementById('m-multi-box'); if(chk&&box) box.style.display=chk.checked?'block':'none'; if(chk&&!chk.checked){ document.querySelectorAll('.m-extra:checked').forEach(e=>e.checked=false); const t=document.getElementById('m-multi-total'); if(t) t.innerHTML=''; } }
function checkin(num){
  if(guardTurno()) return;
  const h = document.getElementById('m-huesped').value.trim();
  if(!h){ alert('Escribe el nombre del huésped'); return; }
  const sel=document.getElementById('m-cliente');
  let clienteId = sel?sel.value:'';
  if(!clienteId){
    const cedEl=document.getElementById('m-cedula'); const ced=cedEl?cedEl.value.trim():'';
    if(!ced){ alert('Escribe la cédula del huésped. Es obligatoria: si ya está registrado aparecerá, y si es nuevo se registra automáticamente.'); if(cedEl) cedEl.focus(); return; }
    const existe = clientes().find(c=>normDoc(c.docNum)===normDoc(ced));
    if(existe){ clienteId=existe.id; }
    else{
      const partes = h.split(/\s+/);
      const nombre = partes.shift()||h; const apellido = partes.join(' ');
      const nuevo = {id:'c'+Date.now(), tipo:'persona', nombre:nombre, apellido:apellido, docTipo:'V', docNum:ced, correo:'', ocupacion:'', ciudad:'', notas:'', historial:[], creado:new Date().toISOString()};
      const list=clientes(); list.push(nuevo); saveClientes(list); clienteId=nuevo.id;
    }
  }
  const noches = parseInt(document.getElementById('m-noches').value)||1;
  const tarifa = parseFloat(document.getElementById('m-tarifa').value)||0;
  const empRefEl=document.getElementById('m-empresaref'); const empRefRaw=empRefEl?empRefEl.value.trim():'';
  const emp=empRefRaw?empresaPorRef(empRefRaw):null;
  const empRef=emp?((emp.codigo||emp.nombre||empRefRaw)):empRefRaw;
  if(emp && clienteId){ const _l=clientes(); const _c=_l.find(x=>x.id===clienteId); if(_c && _c.tipo!=='empresa' && !(_c.empresaRef||'').trim()){ _c.empresaRef=empRef; saveClientes(_l); } }
  const ninos=parseInt(document.getElementById('m-ninos').value)||0;
  const adultos=parseInt(document.getElementById('m-personas').value)||1;
  const acompanantes=colectarAcomp('m', adultos);
  let extras='';
  if(ninos) extras+=' · '+ninos+' niño'+(ninos>1?'s':'');
  extras+=acompResumenTxt(acompanantes);
  const promoEl=document.getElementById('m-promo'); const promoId=promoEl?promoEl.value:''; const promoTit=promoId?promoTituloPorId(promoId):''; const promoDc=promoId?promoDescById(promoId):0;
  if(promoTit) extras+=' · Promoción: '+promoTit+(promoDc>0?(' (−'+promoDc+'%)'):'');
  updateRoom(num,{estado:'ocupada', huesped:h, clienteId:clienteId||'', personas:adultos,
    ninos:ninos, acompanantes:acompanantes, promoId:promoId, promoTitulo:promoTit, promoDesc:promoDc,
    noches:noches, tarifa:tarifa, empresaRef:empRef,
    checkin:new Date().toLocaleDateString('es-VE'), salida:document.getElementById('m-salida').value||''});
  logKardex('checkin', {hab:num, huesped:h, clienteId:clienteId||'', detalle:noches+' noche(s) · '+fmtUSD(tarifa)+'/noche'+(emp?(' · Empresa: '+(emp.nombre||empRef)):'')+extras, montoUsd:0, montoBs:0, metodo:''});
  abrirEstadia(clienteId||'', num, noches, tarifa);
  acompanantes.forEach(a=>registrarAcompanante(clienteId||'', {nombre:a.nombre, docTipo:a.docTipo, docNum:a.docNum, hab:num}));
  // Varias habitaciones para el mismo cliente
  const multiChk=document.getElementById('m-multi');
  if(multiChk && multiChk.checked){
    const extraNums=[].slice.call(document.querySelectorAll('.m-extra:checked')).map(el=>parseInt(el.value));
    const salidaPrev=document.getElementById('m-salida').value||'';
    extraNums.forEach(en=>{
      const er=findRoom(en); if(!er || er.estado!=='libre') return;
      const tar=Number(er.tarifa||0)>0?Number(er.tarifa):tarifa;
      updateRoom(en,{estado:'ocupada', huesped:h, clienteId:clienteId||'', personas:1, ninos:0, acompanantes:[], noches:noches, tarifa:tar, empresaRef:empRef, checkin:new Date().toLocaleDateString('es-VE'), salida:salidaPrev});
      updateRoom(en,{promoId:promoId, promoTitulo:promoTit, promoDesc:promoDc});
      logKardex('checkin', {hab:en, huesped:h, clienteId:clienteId||'', detalle:'Habitación adicional del mismo cliente · '+noches+' noche(s) · '+fmtUSD(tar)+'/noche', montoUsd:0, montoBs:0, metodo:''});
      abrirEstadia(clienteId||'', en, noches, tar);
    });
  }
  cerrarModal(); render();
  var _cl=(clienteId?clientes().find(x=>x.id===clienteId):null)||{};
  modalEnvio({ titulo:'✅ Check-in listo', sub:'<b>'+esc(h)+'</b> quedó en la habitación '+num+'. Puedes enviarle un mensaje de bienvenida:', tel:_cl.telefono||'', correo:_cl.correo||'', asunto:'Bienvenido(a) a '+nombreHotelMsg(), mensaje:msgBienvenida(h, num) });
}
function forzarLibre(num){ updateRoom(num,{estado:'libre',nota:''}); cerrarModal(); render(); }

/* ---- Cálculo automático y desglose USD/Bs ---- */
function desgloseBox(tarifa, noches, id, pct){
  pct = Math.max(0,Math.min(100,Number(pct||0)));
  const bruto = Number(tarifa||0)*(noches||1);
  const d = bruto*pct/100;
  const totUsd = bruto - d;
  return '<div style="background:#f3f6fb;border-radius:10px;padding:14px;margin-top:4px">'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;color:#55637a;margin-bottom:6px"><span>Tarifa × noches</span><span id="d-'+id+'-line">'+fmtUSD(tarifa)+' × '+(noches||1)+'</span></div>'+
    '<div id="d-'+id+'-descrow" style="display:'+(d>0.009?'flex':'none')+';justify-content:space-between;font-size:13px;color:var(--verde);font-weight:700;margin-bottom:6px"><span id="d-'+id+'-desclbl">Descuento '+pct+'%</span><span id="d-'+id+'-desc">- '+fmtUSD(d)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-weight:800;color:var(--azul);font-size:16px"><span>Total USD</span><span id="d-'+id+'-usd">'+fmtUSD(totUsd)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-weight:800;color:#111;font-size:16px;margin-top:4px"><span>Total Bs</span><span id="d-'+id+'-bs">'+fmtBs(precioBs(totUsd))+'</span></div>'+
    '<div style="text-align:right;font-size:11px;color:#8893a5;margin-top:6px">Tasa: '+fmtBs(tasa())+' / $1</div></div>';
}
function pintarDesglose(id, tarifa, noches, pct){
  pct = Math.max(0,Math.min(100,Number(pct||0)));
  const bruto = Number(tarifa||0)*(noches||1);
  const d = bruto*pct/100;
  const tot = bruto - d;
  document.getElementById('d-'+id+'-line').innerText = fmtUSD(tarifa)+' × '+(noches||1);
  const row=document.getElementById('d-'+id+'-descrow');
  if(row){ row.style.display = d>0.009?'flex':'none'; const l=document.getElementById('d-'+id+'-desclbl'); if(l) l.innerText='Descuento '+pct+'%'; const dd=document.getElementById('d-'+id+'-desc'); if(dd) dd.innerText='- '+fmtUSD(d); }
  document.getElementById('d-'+id+'-usd').innerText = fmtUSD(tot);
  document.getElementById('d-'+id+'-bs').innerText = fmtBs(precioBs(tot));
}
function fechaSalidaAuto(noches){ var d=new Date(); d.setDate(d.getDate()+(parseInt(noches)||1)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function cobrarYCheckout(num){
  if(guardTurno()) return;
  const r = findRoom(num);
  const noches = r.noches||1; const hosp = Number(r.tarifa||0)*noches;
  const pend = cargosDe(r).filter(c=>!c.pagado);
  const consUsd = pend.reduce((s,c)=>s+Number(c.montoUsd||0),0);
  const desc = descUsd(r); const totUsd = hosp - desc + consUsd;
  const abonos = Array.isArray(r.abonos)?r.abonos:[];
  const abonoUsd = abonos.reduce((s,a)=>s+Number(a.montoUsd||0),0);
  const saldoUsd = Math.max(0, totUsd - abonoUsd);
  const c = clienteDeHab(r); const cr = c?clienteResumen(c):null;
  const now = new Date();
  const detAb = abonoUsd>0 ? (' (ya adelantó '+fmtUSD(abonoUsd)+')') : '';
  if(saldoUsd<=0.009){
    // Ya estaba todo pagado por adelantado: no se cobra nada más
    if(!confirm('Esta cuenta ya quedó cubierta con los adelantos ('+fmtUSD(abonoUsd)+'). No hay saldo por cobrar.\n\n¿Hacer el check-out?')) return;
    const det0 = noches+' noche(s)'+(consUsd>0?' + consumos '+fmtUSD(consUsd):'')+' · pagado por adelantado'+detAb;
    logKardex('checkout', {hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:det0, montoUsd:0, montoBs:0, metodo:'Pagado por adelantado'});
    cerrarEstadia(r.clienteId||'', num, {noches:noches, montoUsd:0, metodo:'Pagado por adelantado'});
    confirmCheckout(num); return;
  }
  const pm=pmLeer('co'); if(!pm.ok){ alert(pm.msg); return; }
  const metodo = pm.metodoStr;
  const ctrl = siguienteControl();
  const pagos = DB.get('pagos',[]);
  pagos.unshift({ id:Date.now(), control:ctrl, dia:diaKey(now), fechaStr:now.toLocaleString('es-VE'),
    hab:num, huesped:r.huesped||'', tipo:r.tipo||'', noches:noches, metodo:metodo, metodos:pm.metodos,
    clienteId:r.clienteId||'', clienteDoc:cr?cr.doc:'', clienteCiudad:cr?cr.ciudad:'',
    montoUsd:saldoUsd, montoBs:precioBs(saldoUsd), tasa:tasa(), usuario:session().nombre });
  DB.set('pagos', pagos);
  ligarCargosControl(pend.map(c=>c.id), ctrl);
  const det = noches+' noche(s)'+(consUsd>0?' + consumos '+fmtUSD(consUsd):'')+' cobradas'+detAb;
  logKardex('checkout', {hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:det, montoUsd:saldoUsd, montoBs:precioBs(saldoUsd), metodo:metodo});
  cerrarEstadia(r.clienteId||'', num, {noches:noches, montoUsd:saldoUsd, metodo:metodo});
  confirmCheckout(num);
}

function cobrarSinCheckout(num){
  if(guardTurno()) return;
  const r=findRoom(num); const ids=[]; let tot=0;
  document.querySelectorAll('.cob-chk').forEach(ch=>{ if(ch.checked){ ids.push(ch.value); tot+=Number(ch.getAttribute('data-m'))||0; } });
  const concepto=(document.getElementById('cob-concepto').value||'').trim();
  const otro=parseFloat(document.getElementById('cob-otro').value)||0; tot+=otro;
  if(tot<=0){ alert('No hay nada que cobrar. Selecciona un consumo o escribe un monto.'); return; }
  if(PM_STATE['cob']) PM_STATE['cob'].total=tot;
  const pm=pmLeer('cob'); if(!pm.ok){ alert(pm.msg); return; }
  const metodo=pm.metodoStr;
  const c=clienteDeHab(r); const cr=c?clienteResumen(c):null; const now=new Date();
  const detParts=[]; if(ids.length) detParts.push(ids.length+' consumo(s)'); if(otro>0) detParts.push(concepto||'Otro cobro');
  const ctrl = siguienteControl();
  const pagos=DB.get('pagos',[]);
  pagos.unshift({ id:Date.now(), control:ctrl, dia:diaKey(now), fechaStr:now.toLocaleString('es-VE'),
    hab:num, huesped:r.huesped||'', tipo:r.tipo||'', noches:0, metodo:metodo, metodos:pm.metodos,
    concepto:'Consumos / cobro en habitación', clienteId:r.clienteId||'', clienteDoc:cr?cr.doc:'', clienteCiudad:cr?cr.ciudad:'',
    montoUsd:tot, montoBs:precioBs(tot), tasa:tasa(), usuario:session().nombre });
  DB.set('pagos',pagos);
  ligarCargosControl(ids, ctrl);
  const cargos=cargosDe(r).map(cg=> ids.includes(cg.id)?Object.assign({},cg,{pagado:true,control:ctrl}):cg);
  const patch={cargos:cargos};
  if(otro>0){ const ab=Array.isArray(r.abonos)?r.abonos.slice():[]; ab.push({id:'ab'+Date.now(), concepto:concepto||'Adelanto', montoUsd:otro, fecha:now.toISOString()}); patch.abonos=ab; }
  updateRoom(num,patch);
  logKardex('pago',{hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:'Cobro sin check-out · '+(detParts.join(' + ')||'Cobro en habitación'), montoUsd:tot, montoBs:precioBs(tot), metodo:metodo});
  alert('Cobro registrado: '+fmtUSD(tot)+'. La habitación sigue ocupada.'+(otro>0?'\nEl adelanto se descontará automáticamente al hacer el check-out.':''));
  abrirHab(num);
}

function confirmarCambioHab(origen){
  const destinoNum=parseInt(document.getElementById('ch-destino').value);
  const motivo=(document.getElementById('ch-motivo').value||'').trim();
  const mant=document.getElementById('ch-mant').checked;
  const o=findRoom(origen); const d=findRoom(destinoNum);
  if(!d || d.estado!=='libre'){ alert('Esa habitación ya no está libre. Elige otra.'); return; }
  updateRoom(destinoNum,{estado:'ocupada', huesped:o.huesped, clienteId:o.clienteId||'', personas:o.personas||1, noches:o.noches||1, tarifa:o.tarifa||0, checkin:o.checkin||'', salida:o.salida||'', cargos:cargosDe(o).slice(), abonos:(Array.isArray(o.abonos)?o.abonos.slice():[]), nota:'', limpiezaPendiente:false, promoId:o.promoId||'', promoTitulo:o.promoTitulo||'', promoDesc:o.promoDesc||0});

function ultimoRespaldoISO(){ try{ return localStorage.getItem('hotel_ultimoRespaldo')||''; }catch(e){ return ''; } }
function marcarRespaldo(){ try{ localStorage.setItem('hotel_ultimoRespaldo', new Date().toISOString()); }catch(e){} }
function diasDesdeRespaldo(){ const iso=ultimoRespaldoISO(); if(!iso) return null; return (Date.now()-new Date(iso).getTime())/86400000; }
function respaldoVencido(){ const d=diasDesdeRespaldo(); return (d===null || d>=7); }
function textoUltimoRespaldo(){
  const iso=ultimoRespaldoISO();
  if(!iso) return '⚠️ Todavía no has descargado ningún respaldo en este equipo.';
  const f=new Date(iso); const dias=Math.floor(diasDesdeRespaldo());
  const cuando = dias<=0 ? 'hoy' : (dias===1 ? 'hace 1 día' : 'hace '+dias+' días');
  const icono = respaldoVencido() ? '⚠️' : '✅';
  return icono+' Último respaldo en este equipo: '+f.toLocaleString('es-VE')+' ('+cuando+').';
}
function avisarRespaldo(){
  try{
    const s=session(); if(!s || !esMaster(s.rol)) return;
    if(!respaldoVencido()) return;
    if(sessionStorage.getItem('hotel_avisoRespaldo')) return;
    sessionStorage.setItem('hotel_avisoRespaldo','1');

    const msg = (d===null)
      ? 'Recordatorio de seguridad:\n\nTodavía no has descargado ningún respaldo de la base de datos en este equipo.\n\nVe a la pestaña "Datos" y toca "Descargar respaldo" para guardar una copia de seguridad.'
      : 'Recordatorio de seguridad:\n\nHace '+Math.floor(d)+' días que no descargas un respaldo de la base de datos.\n\nVe a la pestaña "Datos" y toca "Descargar respaldo" para guardar una copia nueva.';
    setTimeout(()=>{ try{ alert(msg); }catch(e){} }, 900);
  }catch(e){}
}
function importarRespaldo(ev){
  const file=ev.target.files && ev.target.files[0]; if(!file){ return; }
  const reader=new FileReader();
  reader.onload=function(e){
    let paquete;
    try{ paquete=JSON.parse(e.target.result); }catch(err){ alert('Ese archivo no es un respaldo válido (no se pudo leer).'); ev.target.value=''; return; }
    const datos=(paquete && paquete.datos && typeof paquete.datos==='object') ? paquete.datos : ((paquete && typeof paquete==='object') ? paquete : null);
    if(!datos){ alert('Ese archivo no parece un respaldo de la aplicación.'); ev.target.value=''; return; }
    const claves=Object.keys(datos).filter(k=>SYNC_KEYS.includes(k));
    if(claves.length===0){ alert('El respaldo no contiene datos reconocidos de la aplicación.'); ev.target.value=''; return; }
    const info=(paquete._fecha?('\n\nFecha del respaldo: '+new Date(paquete._fecha).toLocaleString('es-VE')):'')+(paquete.hotel?('\nHotel: '+paquete.hotel):'');
    if(!confirm('Vas a RESTAURAR el respaldo. Esto REEMPLAZA los datos actuales (habitaciones, clientes, pagos, usuarios, etc.) por los del archivo, en este equipo y en la nube.'+info+'\n\n¿Continuar?')){ ev.target.value=''; return; }
    claves.forEach(k=>{ DB.set(k, datos[k]); });
    ev.target.value='';
    alert('Respaldo restaurado correctamente. La aplicación se va a recargar.');
    setTimeout(()=>{ location.reload(); }, 700);
  };
  reader.onerror=function(){ alert('No se pudo leer el archivo.'); ev.target.value=''; };
  reader.readAsText(file);
}

/* ====== OCUPACIÓN POR TIPO DE HABITACIÓN ====== */
function datosOcupacionTipo(){
  const rs=rooms(); const filas=[];
  const tipos=getTipos().slice();
  // incluir tipos presentes en habitaciones aunque no estén en la lista
  rs.forEach(r=>{ const t=r.tipo||'(sin tipo)'; if(tipos.indexOf(t)<0) tipos.push(t); });
  let tot={total:0,ocupadas:0,libres:0,otras:0};
  tipos.forEach(t=>{
    const grupo=rs.filter(r=>(r.tipo||'(sin tipo)')===t);
    if(grupo.length===0 && getTipos().indexOf(t)<0) return;
    const total=grupo.length;
    const ocupadas=grupo.filter(r=>r.estado==='ocupada').length;
    const libres=grupo.filter(r=>r.estado==='libre').length;
    const otras=total-ocupadas-libres;
    const pct= total? Math.round(ocupadas/total*100) : 0;
    filas.push({tipo:t, total:total, ocupadas:ocupadas, libres:libres, otras:otras, pct:pct, precio:precioBaseTipo(t)});
    tot.total+=total; tot.ocupadas+=ocupadas; tot.libres+=libres; tot.otras+=otras;
  });
  tot.pct= tot.total? Math.round(tot.ocupadas/tot.total*100) : 0;
  return {filas:filas, tot:tot};
}

  const D=datosOcupacionTipo();
  let h='<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px">';

  h+='<table class="users-table" style="margin-top:10px"><tr><th>Tipo</th><th>Precio base</th><th>Total</th><th>Ocupadas</th><th>Libres</th><th>No disponibles</th><th>% Ocupación</th></tr>';
  D.filas.forEach(f=>{

function bulkEliminarHabs(){
  const sel=habsSeleccionadas();
  const ocupadas=sel.filter(r=>r.estado==='ocupada');
  const borrables=sel.filter(r=>r.estado!=='ocupada');
  if(borrables.length===0){ alert('No se puede borrar: todas las seleccionadas están ocupadas. Haz check-out primero.'); return; }
  let msg='¿Eliminar '+borrables.length+' habitación(es)?';
  if(ocupadas.length) msg+=' ('+ocupadas.length+' están ocupadas y NO se borrarán).';
  if(!confirm(msg)) return;
  const nums=borrables.map(r=>r.num);
  saveRooms(rooms().filter(x=>nums.indexOf(x.num)<0));
  const reps=DB.get('reportes',[]).filter(x=>nums.indexOf(x.hab)<0); DB.set('reportes',reps);
  nums.forEach(num=>selHabs.delete(num));
  render();
}

function bulkAddFloor(){

  const cant = parseInt(document.getElementById('bf-cant').value);
  const tipo = document.getElementById('bf-tipo').value;
  const tarifa = parseFloat(document.getElementById('bf-tarifa').value)||0;
  if(!piso||!cant||cant<1){ alert('Revisa el número de piso y la cantidad'); return; }
  const r = rooms(); let creadas=0;
  for(let n=1;n<=cant;n++){
    const num = piso*100+n;
    if(r.find(x=>x.num===num)) continue;
    r.push({num:num,piso:piso,tipo:tipo,tarifa:tarifa,estado:'libre',huesped:'',personas:0,checkin:'',salida:'',nota:''});
    creadas++;
  }
  saveRooms(r);
  if(creadas===0) alert('Esas habitaciones ya existían.');
  render();
}

function saveRoomEdit(oldNum){

function agregarTipo(){
  const el=document.getElementById('tipo-nuevo'); if(!el) return;
  const v=el.value.trim(); if(!v){ alert('Escribe un nombre para el tipo.'); return; }
  const ts=getTipos(); if(ts.some(x=>x.toLowerCase()===v.toLowerCase())){ alert('Ese tipo ya existe.'); return; }
  const pe=document.getElementById('tipo-nuevo-precio'); const precio=pe?(parseFloat(pe.value)||0):0;
  ts.push(v); saveTipos(ts); setPrecioBaseTipo(v, precio); render();

function guardarTipo(i){
  const el=document.getElementById('tipo-'+i); if(!el) return;
  const v=el.value.trim(); if(!v){ alert('El nombre no puede quedar vacío.'); return; }
  const ts=getTipos(); if(ts.some((x,j)=>j!==i && x.toLowerCase()===v.toLowerCase())){ alert('Ya existe otro tipo con ese nombre.'); return; }
  const pe=document.getElementById('tipo-precio-'+i); const precio=pe?(parseFloat(pe.value)||0):0;
  const viejo=ts[i]; ts[i]=v; saveTipos(ts);
  // mover el precio base al nombre nuevo
  const pm=getPreciosTipo(); if(viejo!==v){ delete pm[viejo]; } pm[v]=precio; DB.set('preciosTipo', pm);
  // renombrar el tipo en las habitaciones que lo usaban
  if(viejo!==v){ const r=rooms(); r.forEach(x=>{ if(x.tipo===viejo) x.tipo=v; }); saveRooms(r); }
  render(); alert('Tipo actualizado.');
}
function eliminarTipo(i){
  const ts=getTipos(); if(ts.length<=1){ alert('Debe quedar al menos un tipo de habitación.'); return; }
  const usadas=rooms().filter(x=>x.tipo===ts[i]).length;
  const aviso='¿Eliminar el tipo "'+ts[i]+'"?'+(usadas?(' Hay '+usadas+' habitación(es) con este tipo; quedarán sin tipo hasta que las edites.'):'');
  if(!confirm(aviso)) return;
  const pm=getPreciosTipo(); delete pm[ts[i]]; DB.set('preciosTipo', pm);
  ts.splice(i,1); saveTipos(ts); render();
}

function guardarTasaManual(){
  const v = parseFloat(document.getElementById('ts-val').value);

  setTasa(v); render();
}
async function actualizarTasaBCV(){
  const msg = document.getElementById('ts-msg');
  msg.innerText = 'Consultando al BCV…';
  try{
    const resp = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
    if(!resp.ok) throw new Error();
    const d = await resp.json();
    if(!d.promedio) throw new Error();
    setTasa(Number(d.promedio.toFixed(2)));
    render();
  }catch(e){
    msg.innerText = 'No se pudo conectar con el BCV. Verifica tu internet o fija la tasa a mano.';
  }
}

/* ====== PESTAÑA COBRAR (búsqueda cómoda + cargos extra) ====== */
let cobrarQ='';
function renderCobrar(){
  return '<div style="background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);max-width:900px;margin-bottom:14px">'+
    '<div class="section-title" style="font-size:16px;margin:0 0 10px">💵 Cobrar</div>'+
    '<input id="cobrar-q" value="'+escA(cobrarQ)+'" placeholder="Buscar por nombre, cédula, N° de control o N° de habitación" oninput="cobrarQ=this.value;cobrarPintar()" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #d7deea;border-radius:10px;font-size:15px">'+
    '<div style="font-size:12px;color:#8893a5;margin-top:6px;line-height:1.55">Escribe parte del <b>nombre</b>, la <b>cédula</b>, el <b>número de control</b> de un pago o el <b>número de habitación</b>. Si lo dejas vacío, se muestran todas las habitaciones ocupadas.</div>'+
    '</div><div id="cobrar-res"></div>';
}
function cobrarMatchRooms(q){
  q=(q||'').trim().toLowerCase();
  const ocup=rooms().filter(r=>r.estado==='ocupada');
  if(!q) return ocup;
  let habsCtrl=[];
  try{ DB.get('pagos',[]).forEach(p=>{ const ctrl=String(p.control||''); if(ctrl && (ctrl.toLowerCase().indexOf(q)>=0 || fmtControl(p.control).toLowerCase().indexOf(q)>=0)){ if(p.hab) habsCtrl.push(Number(p.hab)); } }); }catch(e){}
  return ocup.filter(r=>{
    if(String(r.num).indexOf(q)>=0) return true;
    if((r.huesped||'').toLowerCase().indexOf(q)>=0) return true;
    const c=r.clienteId?clientes().find(x=>x.id===r.clienteId):null;
    if(c){
      const nom=((c.nombre||'')+' '+(c.apellido||'')).toLowerCase();
      if(nom.indexOf(q)>=0) return true;
      if((c.docNum||'').toLowerCase().indexOf(q)>=0) return true;
      if(normDoc(c.docNum) && normDoc(c.docNum)===normDoc(q)) return true;
      if((c.codigo||'').toLowerCase().indexOf(q)>=0) return true;
    }
    if(habsCtrl.indexOf(Number(r.num))>=0) return true;
    return false;
  });
}
function saldoGrupo(list){
  let gCost=0,gAb=0;
  list.forEach(r=>{ const noches=r.noches||1; const hosp=Number(r.tarifa||0)*noches; const d=descUsd(r); const cons=cargosDe(r).filter(x=>!x.pagado).reduce((s,x)=>s+Number(x.montoUsd||0),0); const ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce((s,a)=>s+Number(a.montoUsd||0),0); gCost+=(hosp-d+cons); gAb+=ab; });
  return Math.max(0,gCost-gAb);
}
function ocultarPagadosCobrar(){
  const ocup=rooms().filter(r=>r.estado==='ocupada');
  const groups={}; ocup.forEach(r=>{ const k=r.clienteId||('h:'+(r.huesped||r.num)); (groups[k]=groups[k]||[]).push(r); });
  let n=0;
  Object.keys(groups).forEach(k=>{ const list=groups[k]; if(saldoGrupo(list)<=0.009){ list.forEach(r=>{ updateRoom(r.num,{ocultarCobrar:true}); n++; }); } });
  return n;
}
function cobrarPintar(){
  const cont=document.getElementById('cobrar-res'); if(!cont) return;
  const q=cobrarQ; const matches=cobrarMatchRooms(q);
  if(!matches.length){ cont.innerHTML='<div class="empty">'+(q?'No se encontró ninguna habitación ocupada con “'+esc(q)+'”.':'No hay habitaciones ocupadas en este momento.')+'</div>'; return; }
  const groups={}; const order=[];
  matches.forEach(r=>{ const k=r.clienteId||('h:'+(r.huesped||r.num)); if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(r); });
  const gs = order.map(k=>{ const list=groups[k].sort((a,b)=>a.num-b.num); const saldo=saldoGrupo(list); return {list:list, pagado:saldo<=0.009}; });
  const visibles = gs.filter(g=> !(g.pagado && g.list.every(r=>r.ocultarCobrar)) );
  visibles.sort((a,b)=>(a.pagado?1:0)-(b.pagado?1:0));
  if(!visibles.length){ cont.innerHTML='<div class="empty">'+(q?'No se encontró ninguna habitación ocupada con “'+esc(q)+'”.':'No hay cuentas pendientes por cobrar en este momento.')+'</div>'; return; }
  let h=''; let paidHeaderDone=false;
  visibles.forEach(g=>{
    if(g.pagado && !paidHeaderDone){ h+='<div style="font-weight:800;color:#1d6b38;margin:4px 0 12px;font-size:14px;border-top:2px dashed #cfe4d6;padding-top:12px">✓ Ya pagados (se quitan al cerrar el turno)</div>'; paidHeaderDone=true; }
    const list=g.list; const first=list[0];
    const c=first.clienteId?clientes().find(x=>x.id===first.clienteId):null;
    const nombre=(c?((c.nombre||'')+' '+(c.apellido||'')).trim():'')||first.huesped||'Huésped';
    const numsStr=list.map(r=>r.num).join(',');
    let gCost=0,gAb=0;
    list.forEach(r=>{ const noches=r.noches||1; const hosp=Number(r.tarifa||0)*noches; const d=descUsd(r); const cons=cargosDe(r).filter(x=>!x.pagado).reduce((s,x)=>s+Number(x.montoUsd||0),0); const ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce((s,a)=>s+Number(a.montoUsd||0),0); gCost+=(hosp-d+cons); gAb+=ab; });
    const gSaldo=Math.max(0,gCost-gAb); const pagado=gSaldo<=0.009;
    h+='<div style="background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:16px 18px;margin-bottom:14px">';
    h+='<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:flex-start">';
    h+='<div><div style="font-weight:800;color:var(--azul);font-size:17px">'+esc(nombre)+'</div>';

function cobroGrupoDatos(numsStr){

function borrarPago(id){
  if(!(session().rol==='admin'||puedeSup('anularPagos'))){ alert('No tienes permiso para anular cobros.'); return; }
  const p=DB.get('pagos',[]).find(x=>x.id===id); if(!p){ alert('No se encontró el cobro.'); return; }
  let body='<button class="close" onclick="cerrarModal()">×</button><h2>Anular cobro</h2>';
  body+='<div style="background:#fdecea;border:1px solid #f3b4ac;border-radius:8px;padding:10px 12px;font-size:13px;color:#8a2a1c;margin-bottom:12px">Vas a <b>anular</b> este cobro. Queda registrado quién lo anula, cuándo y por qué, para poder revisarlo después.</div>';
  body+='<div style="background:#f3f6fb;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px">';
  body+='<div><b>'+(p.hab?('Hab. '+p.hab):'Cobro manual')+'</b> '+esc(p.huesped||p.concepto||'')+'</div>';
  body+='<div style="color:#55637a;margin-top:3px">'+(p.control?('Control N° '+fmtControl(p.control)+' · '):'')+esc(p.metodo||'')+' · '+esc(p.fechaStr||'')+'</div>';
  body+='<div style="font-weight:800;color:var(--azul);margin-top:3px">'+fmtBs(p.montoBs)+' · '+fmtUSD(p.montoUsd)+'</div></div>';
  body+='<div class="field"><label>¿Por qué anulas este cobro? (obligatorio)</label><textarea id="anul-motivo" rows="3" placeholder="Ej: cobro duplicado, monto equivocado, el cliente no pagó, error de forma de pago…"></textarea></div>';
  body+='<div class="divider"></div><div class="actions"><button class="btn-red" onclick="confirmarAnularPago('+id+')">Anular cobro</button><button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';
  showModal(body);
}
function confirmarAnularPago(id){
  if(!(session().rol==='admin'||puedeSup('anularPagos'))){ alert('No tienes permiso para anular cobros.'); cerrarModal(); return; }
  const pagos=DB.get('pagos',[]); const p=pagos.find(x=>x.id===id);
  if(!p){ alert('No se encontró el cobro.'); cerrarModal(); return; }
  const motivo=(document.getElementById('anul-motivo')||{}).value||'';
  if(!motivo.trim()){ alert('Escribe el motivo de la anulación.'); return; }
  const s=session();
  const detalle='ANULADO por '+(s?s.nombre:'')+' ('+(s?s.rol:'')+')'+(p.control?(' · Control N° '+fmtControl(p.control)):'')+(p.metodo?(' · '+p.metodo):'')+' · Motivo: '+motivo.trim();
  logKardex('anulacion', {hab:p.hab||0, huesped:p.huesped||p.concepto||'', clienteId:p.clienteId||'', detalle:detalle, montoUsd:p.montoUsd, montoBs:p.montoBs, metodo:p.metodo, motivo:motivo.trim(), control:p.control||'', anuladoPor:(s?s.nombre:''), anuladoRol:(s?s.rol:'')});
  DB.set('pagos', pagos.filter(x=>x.id!==id));
  cerrarModal(); render();
  alert('Cobro anulado. Quedó registrado en el Kardex con el motivo y quién lo anuló.');
}

function resumenCaja(fecha){
  const pagos = DB.get('pagos',[]).filter(p=>p.dia===fecha);
  const porMetodo = {}; let totBs=0, totUsd=0;
  METODOS.forEach(m=>porMetodo[m]={bs:0,usd:0,n:0});
  pagos.forEach(p=>{ if(Array.isArray(p.metodos)&&p.metodos.length){ p.metodos.forEach(m=>{ if(!porMetodo[m.metodo]) porMetodo[m.metodo]={bs:0,usd:0,n:0}; porMetodo[m.metodo].bs+=Number(m.montoBs)||0; porMetodo[m.metodo].usd+=Number(m.montoUsd)||0; porMetodo[m.metodo].n++; }); } else { if(!porMetodo[p.metodo]) porMetodo[p.metodo]={bs:0,usd:0,n:0}; porMetodo[p.metodo].bs+=p.montoBs; porMetodo[p.metodo].usd+=p.montoUsd; porMetodo[p.metodo].n++; } totBs+=p.montoBs; totUsd+=p.montoUsd; });
  return {pagos:pagos, porMetodo:porMetodo, totBs:totBs, totUsd:totUsd};
}

}

function corteDatos(fecha, turno){
  let pagos = DB.get('pagos',[]).filter(p=>p.dia===fecha);
  let cargos = kardexAll().filter(k=>k.tipo==='cargo' && diaKey(new Date(k.ts))===fecha);
  let anul = kardexAll().filter(k=>k.tipo==='anulacion' && diaKey(new Date(k.ts))===fecha);
  if(turno && turno!=='todos'){
    pagos = pagos.filter(p=>turnoDePago(p)===turno);
    cargos = cargos.filter(k=>turnoDeTs(k.ts)===turno);
    anul = anul.filter(k=>turnoDeTs(k.ts)===turno);
  }
  let totBs=0, totUsd=0; const porRecep={};
  pagos.forEach(p=>{ totBs+=Number(p.montoBs)||0; totUsd+=Number(p.montoUsd)||0;
    const u=p.usuario||'(sin nombre)'; if(!porRecep[u]) porRecep[u]={n:0,bs:0,usd:0}; porRecep[u].n++; porRecep[u].bs+=Number(p.montoBs)||0; porRecep[u].usd+=Number(p.montoUsd)||0; });
  return {pagos:pagos, cargos:cargos, anul:anul, totBs:totBs, totUsd:totUsd, porRecep:porRecep};
}

/* ====== REPORTE DE PAGOS POR RANGO DE FECHAS ====== */
function primerDiaMes(){ const d=new Date(); return diaKey(new Date(d.getFullYear(),d.getMonth(),1)); }
let repDesde = primerDiaMes();
let repHasta = diaKey();
let repMetodo = '';
function setRepDesde(v){ repDesde = v || primerDiaMes(); render(); }
function setRepHasta(v){ repHasta = v || diaKey(); render(); }
function setRepMetodo(v){ repMetodo = v || ''; render(); }
function pagosEnRango(){
  let d = repDesde, h = repHasta;
  if(d>h){ const t=d; d=h; h=t; }
  return DB.get('pagos',[]).filter(p=>{
    if(!p.dia || p.dia<d || p.dia>h) return false;
    if(repMetodo && String(p.metodo||'')!==repMetodo) return false;
    return true;
  });
}
function resumenRango(pagos){
  const porMetodo = {}; let totBs=0, totUsd=0;
  getMetodos().forEach(m=>porMetodo[m]={bs:0,usd:0,n:0});
  pagos.forEach(p=>{
    if(Array.isArray(p.metodos)&&p.metodos.length){ p.metodos.forEach(m=>{ if(!porMetodo[m.metodo]) porMetodo[m.metodo]={bs:0,usd:0,n:0}; porMetodo[m.metodo].bs+=Number(m.montoBs)||0; porMetodo[m.metodo].usd+=Number(m.montoUsd)||0; porMetodo[m.metodo].n++; }); }
    else { if(!porMetodo[p.metodo]) porMetodo[p.metodo]={bs:0,usd:0,n:0}; porMetodo[p.metodo].bs+=Number(p.montoBs)||0; porMetodo[p.metodo].usd+=Number(p.montoUsd)||0; porMetodo[p.metodo].n++; }
    totBs+=Number(p.montoBs)||0; totUsd+=Number(p.montoUsd)||0;
  });
  return {porMetodo:porMetodo, totBs:totBs, totUsd:totUsd};
}
function renderReportePagos(){
  const pagos = pagosEnRango();
  const R = resumenRango(pagos);
  let h = '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px">';
  h += '<div style="flex:1;min-width:150px"><label>Desde</label><input type="date" value="'+repDesde+'" onchange="setRepDesde(this.value)"></div>';
  h += '<div style="flex:1;min-width:150px"><label>Hasta</label><input type="date" value="'+repHasta+'" onchange="setRepHasta(this.value)"></div>';
  h += '<div style="flex:1;min-width:160px"><label>Forma de pago</label><select onchange="setRepMetodo(this.value)"><option value="">Todas</option>'+getMetodos().map(m=>'<option'+(m===repMetodo?' selected':'')+'>'+esc(m)+'</option>').join('')+'</select></div>';
  h += '<button class="btn-gray" onclick="imprimirReportePagos()">Imprimir / PDF</button>';

function abrirEstadia(clienteId, hab, noches, tarifa){
  if(!clienteId) return;
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c) return;
  if(!Array.isArray(c.historial)) c.historial=[];
  c.historial.forEach(e=>{ if(e.estado==='activa' && e.hab===hab) e.estado='cerrada'; });
  c.historial.unshift({ id:'e'+Date.now(), hab:hab, entrada:new Date().toISOString(), salida:'', noches:noches||1, tarifa:Number(tarifa||0), montoUsd:0, metodo:'', estado:'activa' });
  saveClientes(list);
}
function registrarAcompanante(clienteId, ac){
  if(!clienteId || !ac) return;
  if(!(ac.nombre||'').trim() && !(ac.docNum||'').trim()) return;
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c) return;
  if(!Array.isArray(c.acompanantes)) c.acompanantes=[];
  c.acompanantes.unshift({ id:'a'+Date.now(), nombre:(ac.nombre||'').trim(), docTipo:ac.docTipo||'', docNum:(ac.docNum||'').trim(), hab:ac.hab||'', fecha:new Date().toISOString() });
  saveClientes(list);
}
function cerrarEstadia(clienteId, hab, info){
  if(!clienteId) return;
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c) return;
  if(!Array.isArray(c.historial)) c.historial=[];
  let e = c.historial.find(x=>x.estado==='activa' && x.hab===hab) || c.historial.find(x=>x.estado==='activa');
  if(e){ e.salida=new Date().toISOString(); e.estado='cerrada'; }
  else { e={ id:'e'+Date.now(), hab:hab, entrada:'', salida:new Date().toISOString(), noches:1, tarifa:0, montoUsd:0, metodo:'', estado:'cerrada' }; c.historial.unshift(e); }
  if(info){ if(info.noches!=null) e.noches=info.noches; e.montoUsd=Number(info.montoUsd||0); e.metodo=info.metodo||''; }
  saveClientes(list);
}

function resumenHuesped(c){
  const hist=Array.isArray(c.historial)?c.historial:[];
  const completas=hist.filter(e=>e.estado!=='activa' && e.estado!=='cargo').length;
  const activas=hist.filter(e=>e.estado==='activa').length;
  const noches=hist.reduce((s,e)=>s+Number(e.noches||0),0);
  const totUsd=hist.reduce((s,e)=>s+Number(e.montoUsd||0),0);
  const fechas=hist.map(e=>e.entrada).filter(Boolean).sort();
  return {estadias:hist.length, completas:completas, activas:activas, noches:noches, totUsd:totUsd, ultima:fechas.length?fechas[fechas.length-1]:''};
}

function _csvDelim(text){
  const first=(text.split(/\r?\n/)[0]||'');
  const c=(first.match(/,/g)||[]).length, s=(first.match(/;/g)||[]).length, t=(first.match(/\t/g)||[]).length;
  if(t>=c && t>=s && t>0) return '\t';
  return s>c?';':',';
}
function _parseCSV(text, delim){
  const rows=[]; let row=[]; let field=''; let inQ=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQ=false; } else field+=ch; }
    else { if(ch==='"') inQ=true; else if(ch===delim){ row.push(field); field=''; } else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; } else if(ch==='\r'){} else field+=ch; }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}

  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename;

}

function procesarImportClientes(text){

    tipoComp:idx(['tipo compania','tipo de compania','tipo de empresa']), diasCredito:idx(['dias credito','dias de credito','credito']),
    ocupacion:idx(['ocupacion','actividad','rubro']), ciudad:idx(['ciudad','ciudad de procedencia','procedencia']),
    codigo:idx(['codigo','codigo empresa']), notas:idx(['notas','observaciones']) };

  const g=(r,k)=> (k>=0 && k<r.length) ? String(r[k]||'').trim() : '';
  const L2C={'cedula':'V','extranjero':'E','pasaporte':'P','rif':'J','gubernamental':'G','v':'V','e':'E','p':'P','j':'J','g':'G'};
  const parseDoc=r=>{ let dt=g(r,col.docTipo), dn=g(r,col.docNum);
    if(!dn && col.doc>=0){ const raw=g(r,col.doc); if(raw){ const parts=raw.split(/[\s-]+/).filter(Boolean); if(parts.length>=2 && L2C[norm(parts[0])]){ dt=parts[0]; dn=parts.slice(1).join(''); } else { dn=raw.replace(/\s+/g,''); } } }
    if(dt){ dt=L2C[norm(dt)]||dt.toUpperCase().slice(0,1); }

  let addP=0,addE=0,skip=0; const base=Date.now();
