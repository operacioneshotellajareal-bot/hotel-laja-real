<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Hotel · 65 Habitaciones</title>
<style>
:root{--azul:#0d3b66;--azul2:#1b6ca8;--verde:#2e9e5b;--rojo:#d64045;--naranja:#e8871e;--gris:#7a8699;--morado:#6a4c93;--bg:#eef1f6;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1c2430;min-height:100vh;}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:10px 16px;transition:.15s;}
button:active{transform:scale(.97);}
.btn-primary{background:var(--azul2);color:#fff;}
.btn-primary:hover{background:var(--azul);}
.btn-ghost{background:#e3e8f0;color:#2c3a4f;}
.btn-green{background:var(--verde);color:#fff;}
.btn-red{background:var(--rojo);color:#fff;}
.btn-orange{background:var(--naranja);color:#fff;}
.btn-gray{background:var(--gris);color:#fff;}
input,select,textarea{width:100%;padding:11px;border:1px solid #c7d0dd;border-radius:8px;font-size:15px;margin-top:4px;font-family:inherit;box-sizing:border-box;}
textarea{resize:vertical;}
label{font-size:13px;font-weight:600;color:#44526a;}
/* LOGIN */
#view-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--card);width:360px;max-width:100%;padding:34px;border-radius:16px;box-shadow:0 10px 40px rgba(13,59,102,.15);}
.login-card h1{font-size:22px;color:var(--azul);text-align:center;margin-bottom:4px;}
.login-card p.sub{text-align:center;color:#8893a5;font-size:13px;margin-bottom:22px;}
.login-card .field{margin-bottom:14px;}
.login-card button{width:100%;margin-top:8px;padding:12px;}
.login-err{color:var(--rojo);font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.hint{margin-top:18px;font-size:11.5px;color:#9aa4b4;text-align:center;line-height:1.6;}
/* TOPBAR */
#view-app{display:none;}
.topbar{background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.topbar .brand{font-size:17px;font-weight:700;}
.topbar .right{display:flex;align-items:center;gap:14px;font-size:13px;}
.role-badge{background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-weight:600;}
.content{max-width:1150px;margin:0 auto;padding:20px;}
.section-title{font-size:19px;color:var(--azul);margin:6px 0 14px;font-weight:700;}
/* STATS */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.stat{flex:1;min-width:120px;background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:5px solid var(--gris);}
.stat .n{font-size:26px;font-weight:800;}
.stat .l{font-size:12px;color:#7a8699;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
/* ROOM GRID */
.floor{margin-bottom:22px;}
.floor h3{font-size:14px;color:#55637a;margin-bottom:10px;font-weight:700;}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
.room{border-radius:12px;padding:12px 8px;text-align:center;color:#fff;cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:.15s;}
.room:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.2);}
.room .num{font-size:19px;font-weight:800;}
.room .st{font-size:10.5px;font-weight:600;opacity:.95;margin-top:3px;text-transform:uppercase;letter-spacing:.3px;}
.room .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85);}
.e-libre{background:var(--verde);}
.e-ocupada{background:var(--rojo);}
.e-sucia{background:var(--naranja);}
.e-limpieza{background:var(--azul2);}
.e-mantenimiento{background:var(--gris);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:12.5px;}
.legend span{display:flex;align-items:center;gap:6px;color:#55637a;font-weight:600;}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;}
/* LIST */
.task-list{display:flex;flex-direction:column;gap:10px;}
.task{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05);gap:12px;flex-wrap:wrap;}
.task .info{flex:1;min-width:180px;}
.task .info b{font-size:16px;color:var(--azul);}
.task .info .meta{font-size:12.5px;color:#7a8699;margin-top:3px;}
.task .acts{display:flex;gap:8px;flex-wrap:wrap;}
.empty{text-align:center;color:#9aa4b4;padding:40px;font-size:15px;}
.prio{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;}
.prio-alta{background:#fde2e2;color:#c0392b;}
.prio-media{background:#fff3d6;color:#b8791a;}
.prio-baja{background:#e2f0e4;color:#2e7d46;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(13,30,55,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:16px;width:420px;max-width:100%;padding:24px;max-height:90vh;overflow:auto;}
.modal h2{font-size:19px;color:var(--azul);margin-bottom:4px;}
.modal .rstate{font-size:13px;font-weight:600;margin-bottom:16px;}
.modal .field{margin-bottom:12px;}
.modal .actions{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.modal .close{float:right;background:none;color:#8893a5;font-size:22px;padding:0;margin-top:-8px;}
.divider{height:1px;background:#eef1f6;margin:14px 0;}
/* ADMIN users */
.users-table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);border-collapse:collapse;}
.users-table th{background:#f3f6fb;text-align:left;padding:11px 14px;font-size:12.5px;color:#55637a;}
.users-table td{padding:11px 14px;border-top:1px solid #eef1f6;font-size:14px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab{background:#e3e8f0;color:#2c3a4f;padding:9px 16px;border-radius:20px;font-weight:600;font-size:13.5px;cursor:pointer;}
.tab.active{background:var(--azul);color:#fff;}
@media(max-width:600px){.rooms{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="view-login">
  <div class="login-card">
    <h1>🏨 Gestión Hotel</h1>
    <p class="sub">Sistema de operaciones · 65 habitaciones</p>
    <div class="field"><label>Usuario</label><input id="in-user" autocomplete="username" placeholder="ej: recepcion"></div>
    <div class="field"><label>Contraseña</label><input id="in-pass" type="password" autocomplete="current-password" placeholder="••••"></div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="hint" id="login-hint"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="view-app">
  <div class="topbar">
    <div class="brand">🏨 Gestión Hotel</div>
    <div class="right">
      <span id="who"></span>
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-ghost" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ====== CONEXIÓN A LA NUBE (Supabase) ====== */
const SB_URL = 'https://wazhhzbwmzitqlgoxjuf.supabase.co';
const SB_KEY = 'sb_publishable_PJfzZshU0tA9FigMiysl1Q_1wMFjKHJ';
/* Cajas de datos que se comparten entre todos los equipos.
   OJO: 'session' NO se comparte (cada equipo inicia sesión aparte). */
const SYNC_KEYS = ['rooms','users','clientes','pagos','reportes','turnos','kardex','tasa','hotel','metodosPago','pagoControl','tiposHab','preciosTipo','permisos'];

/* ====== ALMACENAMIENTO (local + nube) ====== */
const DB = {
  get(k, def){ try{ const v = localStorage.getItem('hotel_'+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k, val){
    localStorage.setItem('hotel_'+k, JSON.stringify(val));
    try{ if(typeof CLOUD!=='undefined') CLOUD.push(k, val); }catch(e){}
  }
};

const CLOUD = {
  ready:false,
  enabled: !!(SB_URL && SB_KEY),
  _cloudKeys:[],
  _h(extra){ return Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}, extra||{}); },
  async pullAll(){
    if(!this.enabled) return;
    const r = await fetch(SB_URL+'/rest/v1/estado_app?select=clave,valor', {headers:this._h()});
    if(!r.ok) throw new Error('pull '+r.status);
    const rows = await r.json();
    this._cloudKeys = rows.map(x=>x.clave);
    rows.forEach(row=>{ if(SYNC_KEYS.includes(row.clave)){ localStorage.setItem('hotel_'+row.clave, JSON.stringify(row.valor)); } });
  },
  async push(k, val){
    if(!this.enabled || !this.ready) return;
    if(!SYNC_KEYS.includes(k)) return;
    try{
      await fetch(SB_URL+'/rest/v1/estado_app?on_conflict=clave', {
        method:'POST',
        headers:this._h({'Prefer':'resolution=merge-duplicates'}),
        body: JSON.stringify({clave:k, valor:val, actualizado:new Date().toISOString()})
      });
    }catch(e){ /* sin conexión: queda guardado en el equipo y se subirá luego */ }
  },
  async pushMissing(){
    if(!this.enabled) return;
    for(const k of SYNC_KEYS){
      const local = DB.get(k);
      if(local!==undefined && local!==null && !this._cloudKeys.includes(k)){ await this.push(k, local); }
    }
  }
};

/* ====== DATOS INICIALES ====== */
const ESTADOS = {
  libre:{t:'Libre',c:'e-libre'},
  ocupada:{t:'Ocupada',c:'e-ocupada'},
  sucia:{t:'Por limpiar',c:'e-sucia'},
  limpieza:{t:'En limpieza',c:'e-limpieza'},
  mantenimiento:{t:'Mantenimiento',c:'e-mantenimiento'}
};
const TIPOS = ['Individual','Matrimonial','Doble','Triple','Dúplex','Suite'];

function seed(){
  if(!DB.get('rooms')){
    const rooms = [];
    for(let p=1; p<=5; p++){
      for(let n=1; n<=13; n++){
        rooms.push({ num: p*100+n, piso:p, tipo:'Individual', tarifa:0, estado:'libre', huesped:'', personas:0, checkin:'', salida:'', nota:'' });
      }
    }
    DB.set('rooms', rooms);
  }
  if(!DB.get('users')){
    DB.set('users', [
      {user:'admin', pass:'admin', rol:'admin', nombre:'Administrador'},
      {user:'recepcion', pass:'1234', rol:'recepcion', nombre:'Recepción'},
      {user:'limpieza', pass:'1234', rol:'housekeeping', nombre:'Ama de Llaves'},
      {user:'mantenimiento', pass:'1234', rol:'mantenimiento', nombre:'Mantenimiento'}
    ]);
  }
  if(!DB.get('reportes')) DB.set('reportes', []);
  if(DB.get('tasa')===undefined) DB.set('tasa', 888.12);
  if(!DB.get('pagos')) DB.set('pagos', []);
  if(!DB.get('metodosPago')) DB.set('metodosPago', METODOS.slice());
  if(DB.get('pagoControl')===undefined) DB.set('pagoControl', 0);
  if(!DB.get('tiposHab')) DB.set('tiposHab', TIPOS.slice());
  if(!DB.get('preciosTipo')) DB.set('preciosTipo', {});
  if(!DB.get('permisos')) DB.set('permisos', {});
}

const ROLES = {
  master:'Master / Dueño', admin:'Master / Dueño',
  recepcion:'Recepcionista', supervisor:'Supervisor de recepción',
  housekeeping:'Ama de Llaves', mantenimiento:'Mantenimiento'
};
function esMaster(rol){ return rol==='master'||rol==='admin'; }
function rolOptions(sel){
  const opts=[['recepcion','Recepcionista'],['supervisor','Supervisor de recepción'],['housekeeping','Ama de Llaves'],['mantenimiento','Mantenimiento'],['master','Master / Dueño']];
  return opts.map(o=>'<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>').join('');
}
function countMasters(){ return DB.get('users',[]).filter(u=>esMaster(u.rol)).length; }
/* ---- Permisos del Supervisor de recepción (configurables por el Master) ---- */
function permisosSupDefault(){ return {anularPagos:false, gestionHab:false, verReportePagos:true}; }
function permisosSup(){ const p=DB.get('permisos',null); const sp=(p&&p.supervisor)?p.supervisor:{}; return Object.assign(permisosSupDefault(), sp); }
function setPermisoSup(k,v){ const p=DB.get('permisos',{})||{}; if(!p.supervisor) p.supervisor={}; p.supervisor[k]=!!v; DB.set('permisos', p); }
function puedeSup(k){ const rol=session().rol; if(esMaster(rol)) return true; if(rol==='supervisor') return !!permisosSup()[k]; return false; }

/* ====== SESIÓN / LOGIN ====== */
function login(){
  const u = document.getElementById('in-user').value.trim().toLowerCase();
  const p = document.getElementById('in-pass').value;
  const found = DB.get('users',[]).find(x=>x.user===u && x.pass===p);
  if(!found){ document.getElementById('login-err').innerText='Usuario o contraseña incorrectos'; return; }
  DB.set('session', found);
  document.getElementById('login-err').innerText='';
  document.getElementById('in-pass').value='';
  openApp();
}
function logout(){ localStorage.removeItem('hotel_session'); location.reload(); }
function session(){ return DB.get('session', null); }

document.getElementById('in-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
document.getElementById('login-hint').innerHTML =
  'Cuentas de prueba:<br>admin / admin &nbsp;·&nbsp; recepcion / 1234<br>limpieza / 1234 &nbsp;·&nbsp; mantenimiento / 1234';

function openApp(){
  aplicarTema(); pintarMarca();
  const s = session();
  if(!s){ document.getElementById('view-login').style.display='flex'; document.getElementById('view-app').style.display='none'; return; }
  document.getElementById('view-login').style.display='none';
  document.getElementById('view-app').style.display='block';
  document.getElementById('who').innerText = s.nombre;
  document.getElementById('role-badge').innerText = ROLES[s.rol]||s.rol;
  render();
}

/* ====== RENDER PRINCIPAL ====== */
function render(){
  const rol = session().rol;
  if(rol==='recepcion'||rol==='supervisor') renderRecepcion();
  else if(rol==='housekeeping') renderHousekeeping();
  else if(rol==='mantenimiento') renderMantenimiento();
  else renderAdmin();
}
function rooms(){ return DB.get('rooms', []); }
function saveRooms(r){ DB.set('rooms', r); }
function findRoom(num){ return rooms().find(r=>r.num===num); }
function pisos(){ return [...new Set(rooms().map(r=>r.piso))].sort((a,b)=>a-b); }
/* ---- Tarifas y tasa cambiaria ---- */
function tasa(){ const t=DB.get('tasa',888.12); return (typeof t==='number'&&t>0)?t:888.12; }
function setTasa(v){ DB.set('tasa', v); }
function numFmt(n){ return Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtUSD(n){ return '$'+numFmt(n); }
function fmtBs(n){ return 'Bs. '+numFmt(n); }
function precioBs(usd){ return Number(usd||0)*tasa(); }
function precioLinea(usd){ return fmtUSD(usd)+' <span style="color:#8893a5">· '+fmtBs(precioBs(usd))+'</span>'; }
/* ---- Pagos y arqueo ---- */
const METODOS = ['Efectivo Bs','Efectivo USD','Pago Móvil','Transferencia','Punto de venta','Zelle'];
function diaKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function metodoOptions(sel){ return getMetodos().map(m=>'<option'+(m===sel?' selected':'')+'>'+esc(m)+'</option>').join(''); }
function getMetodos(){ const m=DB.get('metodosPago', null); return (Array.isArray(m)&&m.length)?m.slice():METODOS.slice(); }
function saveMetodos(a){ DB.set('metodosPago', a); }
function fmtControl(n){ n=parseInt(n)||0; return String(n).padStart(6,'0'); }
function peekControl(){
  const pagos=DB.get('pagos',[]); let max=0;
  pagos.forEach(p=>{ const n=parseInt(p.control); if(!isNaN(n) && n>max) max=n; });
  const cnt=parseInt(DB.get('pagoControl',0))||0; if(cnt>max) max=cnt;
  return max+1;
}
function siguienteControl(){ const next=peekControl(); DB.set('pagoControl', next); return next; }
/* ===== Selector de formas de pago (permite dividir el pago en varias) ===== */
let PM_STATE = {};
function pmWidget(prefix){
  let h='<div class="field" style="margin-top:12px"><label>Formas de pago <span style="color:#8893a5;font-weight:400;font-size:12px">(puedes dividir el pago en varias)</span></label>';
  h+='<div id="'+prefix+'-pm-lineas"></div>';
  h+='<button type="button" class="btn-ghost" style="padding:6px 12px;margin-top:4px" onclick="pmAddLinea(\''+prefix+'\')">+ Agregar otra forma de pago</button>';
  h+='<div style="background:#f3f6fb;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;display:flex;justify-content:space-between"><span>Asignado: <b id="'+prefix+'-pm-asig">'+fmtUSD(0)+'</b></span><span id="'+prefix+'-pm-falta" style="color:#55637a"></span></div></div>';
  return h;
}
function pmLineHTML(prefix, monto){
  return '<div class="pm-linea" style="display:flex;gap:6px;margin-bottom:6px;align-items:center">'
    +'<select class="'+prefix+'-pm-met" style="flex:2">'+metodoOptions('')+'</select>'
    +'<input type="number" min="0" step="0.01" class="'+prefix+'-pm-monto" value="'+(monto!=null&&monto!==''?monto:'')+'" placeholder="USD" oninput="pmRecalc(\''+prefix+'\')" style="flex:1;min-width:70px">'
    +'<button type="button" class="btn-ghost" style="padding:4px 9px" onclick="pmDelLinea(this,\''+prefix+'\')">×</button></div>';
}
function pmReset(prefix, totalUsd){
  PM_STATE[prefix]={total:Number(totalUsd)||0};
  const cont=document.getElementById(prefix+'-pm-lineas'); if(!cont) return;
  cont.innerHTML=pmLineHTML(prefix, (Number(totalUsd)||0)>0?Number(totalUsd).toFixed(2):'');
  pmRecalc(prefix);
}
function pmAddLinea(prefix){
  const cont=document.getElementById(prefix+'-pm-lineas'); if(!cont) return;
  cont.insertAdjacentHTML('beforeend', pmLineHTML(prefix, ''));
  pmRecalc(prefix);
}
function pmDelLinea(btn, prefix){
  const cont=document.getElementById(prefix+'-pm-lineas');
  if(cont && cont.querySelectorAll('.pm-linea').length<=1) return;
  const row=btn.closest('.pm-linea'); if(row) row.remove();
  pmRecalc(prefix);
}
function pmAsignado(prefix){ let t=0; document.querySelectorAll('.'+prefix+'-pm-monto').forEach(i=>{ t+=parseFloat(i.value)||0; }); return t; }
function pmSyncSingle(prefix, totalUsd){
  if(PM_STATE[prefix]) PM_STATE[prefix].total=Number(totalUsd)||0;
  const rows=document.querySelectorAll('#'+prefix+'-pm-lineas .pm-linea');
  if(rows.length===1){ const inp=rows[0].querySelector('.'+prefix+'-pm-monto'); if(inp) inp.value=(Number(totalUsd)||0)>0?Number(totalUsd).toFixed(2):''; }
  pmRecalc(prefix);
}
function pmRecalc(prefix){
  const st=PM_STATE[prefix]||{total:0};
  const asig=pmAsignado(prefix);
  const a=document.getElementById(prefix+'-pm-asig'); if(a) a.innerText=fmtUSD(asig);
  const f=document.getElementById(prefix+'-pm-falta'); if(!f) return;
  const dif=(st.total||0)-asig;
  if((st.total||0)<=0){ f.innerHTML=''; }
  else if(Math.abs(dif)<0.01) f.innerHTML='<span style="color:var(--verde);font-weight:700">✓ Completo</span>';
  else if(dif>0) f.innerHTML='Falta: <b style="color:#c0392b">'+fmtUSD(dif)+'</b>';
  else f.innerHTML='Sobra: <b style="color:#c0392b">'+fmtUSD(-dif)+'</b>';
}
function pmLeer(prefix){
  const st=PM_STATE[prefix]||{total:0};
  const rows=Array.prototype.slice.call(document.querySelectorAll('#'+prefix+'-pm-lineas .pm-linea'));
  let lineas=[];
  rows.forEach(row=>{ const met=row.querySelector('.'+prefix+'-pm-met').value; const mo=parseFloat(row.querySelector('.'+prefix+'-pm-monto').value)||0; if(mo>0) lineas.push({metodo:met, montoUsd:mo}); });
  if(lineas.length===0 && rows.length===1 && (st.total||0)>0){ lineas.push({metodo:rows[0].querySelector('.'+prefix+'-pm-met').value, montoUsd:st.total}); }
  if(lineas.length===0) return {ok:false, msg:'Indica al menos una forma de pago con su monto.'};
  const suma=lineas.reduce((s,l)=>s+l.montoUsd,0);
  if((st.total||0)>0 && Math.abs(suma-st.total)>0.01) return {ok:false, msg:'Los montos de las formas de pago ('+fmtUSD(suma)+') no coinciden con el total a cobrar ('+fmtUSD(st.total)+'). Ajusta los montos.'};
  lineas.forEach(l=>{ l.montoBs=precioBs(l.montoUsd); });
  const metodoStr=lineas.map(l=> lineas.length>1 ? (l.metodo+' ('+fmtUSD(l.montoUsd)+')') : l.metodo).join(' + ');
  return {ok:true, metodos:lineas, metodoStr:metodoStr, totalUsd:suma};
}
function updateRoom(num, patch){ const r=rooms(); const i=r.findIndex(x=>x.num===num); r[i]=Object.assign(r[i],patch); saveRooms(r); }
function countBy(est){ return rooms().filter(r=>r.estado===est).length; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ====== RECEPCIÓN ====== */
let recepView='mapa';
let habFiltroTipo='';
function setHabFiltroTipo(v){ habFiltroTipo = v || ''; render(); }
function filtroTipoBar(){
  const ts=getTipos();
  let h='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 14px">';
  h+='<span style="font-size:13px;color:#55637a;font-weight:600">Buscar por tipo:</span>';
  h+='<select onchange="setHabFiltroTipo(this.value)" style="max-width:220px"><option value="">Todos los tipos</option>'+ts.map(t=>'<option'+(t===habFiltroTipo?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';
  if(habFiltroTipo){ const n=rooms().filter(r=>r.tipo===habFiltroTipo).length; h+='<span style="font-size:12.5px;color:#8893a5">'+n+' habitación(es) · <a href="#" onclick="setHabFiltroTipo(\'\');return false" style="color:var(--azul)">quitar filtro</a></span>'; }
  h+='</div>';
  return h;
}
function recepTab(id,label){ return '<div class="tab '+(recepView===id?'active':'')+'" onclick="recepView=\''+id+'\';render()">'+label+'</div>'; }
function renderRecepcion(){
  const c = document.getElementById('content');
  let html = '<div class="section-title">Panel de Recepción</div>';
  const esSup = session().rol==='supervisor';
  // Pestañas según permisos (el supervisor puede tener permisos recortados o ampliados)
  const verReporte = esSup ? permisosSup().verReportePagos : true;
  const verGestionHab = esSup ? permisosSup().gestionHab : false;
  if(esSup){ // evitar quedar en una pestaña sin permiso
    if(recepView==='reportes' && !verReporte) recepView='mapa';
    if(recepView==='habitaciones' && !verGestionHab) recepView='mapa';
  }
  let tabs = recepTab('mapa','Mapa de habitaciones')+recepTab('caja','Caja / Arqueo');
  if(verReporte) tabs += recepTab('reportes','Reporte de pagos');
  tabs += recepTab('clientes','Clientes')+recepTab('kardex','Kardex / Turno');
  if(verGestionHab) tabs += recepTab('habitaciones','Habitaciones');
  html += '<div class="tabs">'+tabs+'</div>';
  if(recepView==='caja'){ c.innerHTML = html + renderCaja(); return; }
  if(recepView==='reportes'){ c.innerHTML = html + renderReportePagos(); return; }
  if(recepView==='habitaciones'){ c.innerHTML = html + renderGestionHab() + renderOcupacionTipo(); return; }
  if(recepView==='clientes'){ c.innerHTML = html + renderClientes(); return; }
  if(recepView==='kardex'){ c.innerHTML = html + renderKardex(); return; }
  html += statsBar();
  html += legend();
  html += filtroTipoBar();
  pisos().forEach(p=>{
    const list = rooms().filter(r=>r.piso===p && (!habFiltroTipo || r.tipo===habFiltroTipo));
    if(habFiltroTipo && list.length===0) return;
    html += '<div class="floor"><h3>Piso '+p+'</h3><div class="rooms">';
    list.forEach(r=>{
      html += roomCard(r);
    });
    html += '</div></div>';
  });
  if(habFiltroTipo && rooms().filter(r=>r.tipo===habFiltroTipo).length===0){ html += '<div class="empty">No hay habitaciones del tipo "'+esc(habFiltroTipo)+'".</div>'; }
  c.innerHTML = html;
}
function roomCard(r){
  const e = ESTADOS[r.estado];
  return '<div class="room '+e.c+'" onclick="abrirHab('+r.num+')"><div class="dot"></div>'+
    '<div class="num">'+r.num+'</div><div class="st">'+e.t+'</div><div class="st" style="opacity:.8;font-size:9.5px">'+(r.tipo||'')+'</div></div>';
}
function statsBar(){
  const defs = [['libre','Libres','var(--verde)'],['ocupada','Ocupadas','var(--rojo)'],
    ['sucia','Por limpiar','var(--naranja)'],['mantenimiento','Mantenim.','var(--gris)']];
  let h = '<div class="stats">';
  defs.forEach(d=>{ h += '<div class="stat" style="border-left-color:'+d[2]+'"><div class="n">'+countBy(d[0])+'</div><div class="l">'+d[1]+'</div></div>'; });
  h += '<div class="stat" style="border-left-color:var(--azul2)"><div class="n">'+rooms().length+'</div><div class="l">Total hab.</div></div>';
  h += '</div>';
  return h;
}
function legend(){
  let h='<div class="legend">';
  for(const k in ESTADOS){ h+='<span><i class="'+ESTADOS[k].c+'" style="background:"></i>'+ESTADOS[k].t+'</span>'; }
  h+='</div>';
  // fix bg colors via classes
  return h.replace(/<i class="e-libre"[^>]*>/,'<i style="background:var(--verde)"></i>')
          .replace(/<i class="e-ocupada"[^>]*>/,'<i style="background:var(--rojo)"></i>')
          .replace(/<i class="e-sucia"[^>]*>/,'<i style="background:var(--naranja)"></i>')
          .replace(/<i class="e-limpieza"[^>]*>/,'<i style="background:var(--azul2)"></i>')
          .replace(/<i class="e-mantenimiento"[^>]*>/,'<i style="background:var(--gris)"></i>');
}

/* ====== MODAL HABITACIÓN (recepción) ====== */
function abrirHab(num){
  const r = findRoom(num);
  const e = ESTADOS[r.estado];
  let body = '<button class="close" onclick="cerrarModal()">×</button>';
  body += '<h2>Habitación '+r.num+'</h2>';
  body += '<div class="rstate" style="color:'+stateColor(r.estado)+'">● '+e.t+' · <span style="color:#55637a">'+(r.tipo||'')+'</span></div>';
  if(r.estado==='ocupada'){
    body += '<div class="field"><label>Huésped</label><div style="font-weight:700;margin-top:4px">'+esc(r.huesped||'—')+clienteFichaLink(r)+'</div></div>';
    body += '<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Personas</label><div style="margin-top:4px">'+(r.personas||1)+'</div></div>';
    body += '<div class="field" style="flex:1"><label>Noches</label><div style="margin-top:4px">'+(r.noches||1)+'</div></div></div>';
    body += '<div class="field"><label>Entrada</label><div style="margin-top:4px">'+(r.checkin||'—')+'</div></div>';
    body += '<div class="field"><label>Tarifa por noche (USD) — editable</label><input id="m-tarifa2" type="number" min="0" step="0.01" value="'+(r.tarifa||0)+'" oninput="recalcOcup('+num+')"></div>';
    body += '<button class="btn-ghost" style="margin-bottom:10px" onclick="guardarTarifaRecep('+num+')">Guardar nueva tarifa</button>';
    body += desgloseBox(r.tarifa, r.noches||1, 'ocup');
    if(r.limpiezaPendiente){ body += '<div style="background:#fff3e0;border:1px solid #f3961c;color:#b5651d;border-radius:8px;padding:8px 10px;font-size:13px;margin:10px 0">🧹 Limpieza solicitada · pendiente de Ama de Llaves</div>'; }
    const cgs = cargosDe(r);
    if(cgs.length){
      body += '<div class="section-title" style="font-size:14px;margin-top:8px">Consumos en la cuenta</div>';
      body += '<table class="users-table"><tr><th>Tipo</th><th>Detalle</th><th>Monto</th><th>Estado</th><th></th></tr>';
      cgs.forEach(cg=>{ body += '<tr><td>'+esc(cg.tipo)+'</td><td>'+esc(cg.desc||'—')+'</td><td>'+fmtUSD(cg.montoUsd)+'</td><td>'+(cg.pagado?'<span style="color:var(--verde)">Cobrado</span>':'<span style="color:#b5651d">Pendiente</span>')+'</td><td style="text-align:right">'+(cg.pagado?'':'<button class="btn-ghost" style="padding:4px 8px" onclick="quitarCargo('+num+',\''+cg.id+'\')">Quitar</button>')+'</td></tr>'; });
      body += '</table><div style="text-align:right;font-size:13px;color:#55637a;margin:6px 0">Consumos pendientes: <b>'+fmtUSD(totalCargosPend(r))+'</b></div>';
    }
    body += '<div class="divider"></div><div class="actions">';
    body += '<button class="btn-green" onclick="agregarCargoModal('+num+')">Agregar consumo</button>';
    body += '<button class="btn-blue" onclick="cobrarSinCheckoutModal('+num+')">Cobrar sin check-out</button>';
    body += '<button class="btn-gray" onclick="solicitarLimpieza('+num+')">Solicitar limpieza</button>';
    body += '<button class="btn-gray" onclick="cambiarHabModal('+num+')">Cambiar de habitación</button>';
    body += '<button class="btn-red" onclick="pedirCheckout('+num+')">Check-out y recibo</button>';
    body += '<button class="btn-gray" onclick="aMantenimiento('+num+')">Reportar a mantenimiento</button>';
    body += '</div>';
  } else if(r.estado==='libre'){
    body += '<div class="field"><label>Cédula del huésped (obligatoria)</label><input id="m-cedula" placeholder="Escríbela: si ya existe aparece, si no, se registra" oninput="buscarCedula()"></div>';
    body += '<div id="m-cedula-res" style="font-size:13px;margin:-4px 0 10px"></div>';
    body += '<div class="field"><label>O elegir un cliente ya registrado</label><select id="m-cliente" onchange="seleccionarCliente()"><option value="">— Buscar por cédula arriba —</option>'+clienteCheckinOptions()+'</select></div>';
    body += '<div class="field"><label>Nombre del huésped</label><input id="m-huesped" placeholder="Nombre y apellido"></div>';
    body += '<div style="font-size:12px;color:#8893a5;margin:-4px 0 12px">Todo huésped queda registrado al ingresar. Si es su primera vez, se guarda automáticamente con su cédula.</div>';
    body += '<div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Personas</label><input id="m-personas" type="number" min="1" value="1"></div>';
    body += '<div class="field" style="flex:1"><label>Noches</label><input id="m-noches" type="number" min="1" value="1" oninput="recalcCheckin('+num+')"></div></div>';
    body += '<div class="field"><label>Tarifa por noche (USD) — editable</label><input id="m-tarifa" type="number" min="0" step="0.01" value="'+(r.tarifa||0)+'" oninput="recalcCheckin('+num+')"></div>';
    body += '<div class="field"><label>Salida prevista</label><input id="m-salida" type="date"></div>';
    body += desgloseBox(r.tarifa, 1, 'in');
    body += '<div class="divider"></div><div class="actions">';
    body += '<button class="btn-green" onclick="checkin('+num+')">Confirmar check-in</button>';
    body += '<button class="btn-gray" onclick="aMantenimiento('+num+')">Enviar a mantenimiento</button>';
    body += '</div>';
  } else {
    body += '<div class="field"><label>Tarifa por noche</label><div style="font-weight:700;margin-top:4px;font-size:15px">'+precioLinea(r.tarifa)+'</div></div>';
    if(r.nota) body += '<div class="field"><label>Nota</label><div style="margin-top:4px">'+esc(r.nota)+'</div></div>';
    body += '<div class="divider"></div><div class="actions">';
    if(r.estado==='sucia') body += '<button class="btn-green" onclick="forzarLibre('+num+')">Marcar lista manualmente</button>';
    body += '<button class="btn-ghost" onclick="cerrarModal()">Cerrar</button></div>';
  }
  showModal(body);
}
function stateColor(e){ return {libre:'var(--verde)',ocupada:'var(--rojo)',sucia:'var(--naranja)',limpieza:'var(--azul2)',mantenimiento:'var(--gris)'}[e]; }
function showModal(h){ document.getElementById('modal').innerHTML=h; document.getElementById('modal-bg').style.display='flex'; }
function cerrarModal(){ document.getElementById('modal-bg').style.display='none'; }
document.getElementById('modal-bg').addEventListener('click',e=>{ if(e.target.id==='modal-bg') cerrarModal(); });

function clienteCheckinOptions(){
  return clientes().slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'')).map(c=>{
    const nom = c.tipo==='empresa'?c.nombre:((c.nombre||'')+' '+(c.apellido||'')).trim();
    const doc = c.docNum?(' · '+docLabel(c.docTipo)+' '+c.docNum):'';
    return '<option value="'+c.id+'">'+esc(nom+doc)+'</option>';
  }).join('');
}
function seleccionarCliente(){
  const sel=document.getElementById('m-cliente'); if(!sel) return;
  const id=sel.value;
  const box=document.getElementById('m-guardar-box');
  const inp=document.getElementById('m-huesped');
  if(!id){ if(box) box.style.display='flex'; return; }
  const c=clientes().find(x=>x.id===id);
  if(c && inp){ inp.value = c.tipo==='empresa'?c.nombre:((c.nombre||'')+' '+(c.apellido||'')).trim(); }
  const chk=document.getElementById('m-guardar'); if(chk) chk.checked=false;
  if(box) box.style.display='none';
}
function normDoc(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function buscarCedula(){
  const inp=document.getElementById('m-cedula'); if(!inp) return;
  const q=normDoc(inp.value);
  const res=document.getElementById('m-cedula-res');
  const sel=document.getElementById('m-cliente');
  if(!q){ if(res) res.innerHTML=''; return; }
  const list=clientes().filter(c=>normDoc(c.docNum).includes(q));
  if(list.length===0){ if(res) res.innerHTML='<span style="color:#b5651d">No hay ningún cliente con esa cédula. Puedes registrarlo marcando “Guardar este huésped”.</span>'; return; }
  const c = list.find(x=>normDoc(x.docNum)===q) || list[0];
  if(sel){ sel.value=c.id; seleccionarCliente(); }
  const nom = c.tipo==='empresa'?c.nombre:((c.nombre||'')+' '+(c.apellido||'')).trim();
  const etq = esc(nom)+' ('+docLabel(c.docTipo)+' '+esc(c.docNum)+')';
  if(res){ res.innerHTML = (list.length>1)
    ? '<span style="color:var(--verde)">✓ '+etq+'</span> <span style="color:#8893a5">y '+(list.length-1)+' más · elige en la lista de abajo</span>'
    : '<span style="color:var(--verde)">✓ Cliente encontrado: '+etq+'</span>'; }
}
function clienteDeHab(r){ return r && r.clienteId ? (clientes().find(c=>c.id===r.clienteId)||null) : null; }
function clienteResumen(c){
  if(!c) return null;
  const nom = c.tipo==='empresa'?(c.nombre||''):((c.nombre||'')+' '+(c.apellido||'')).trim();
  return { nom:nom, tipo:c.tipo, doc:(c.docNum?docLabel(c.docTipo)+' '+c.docNum:''), correo:c.correo||'', ocupacion:c.ocupacion||'', ciudad:c.ciudad||'' };
}
function clienteFichaLink(r){
  if(!r.clienteId) return '';
  const c=clientes().find(x=>x.id===r.clienteId);
  if(!c) return '';
  const extra=[c.docNum?(docLabel(c.docTipo)+' '+c.docNum):'', c.ciudad||''].filter(Boolean).join(' · ');
  return '<div style="font-size:12px;color:#8893a5;font-weight:400;margin-top:2px">Cliente registrado'+(extra?' · '+esc(extra):'')+'</div>';
}
function checkin(num){
  const h = document.getElementById('m-huesped').value.trim();
  if(!h){ alert('Escribe el nombre del huésped'); return; }
  const sel=document.getElementById('m-cliente');
  let clienteId = sel?sel.value:'';
  if(!clienteId){
    const cedEl=document.getElementById('m-cedula'); const ced=cedEl?cedEl.value.trim():'';
    if(!ced){ alert('Escribe la cédula del huésped. Es obligatoria: si ya está registrado aparecerá, y si es nuevo se registra automáticamente.'); if(cedEl) cedEl.focus(); return; }
    const existe = clientes().find(c=>normDoc(c.docNum)===normDoc(ced));
    if(existe){ clienteId=existe.id; }
    else{
      const partes = h.split(/\s+/);
      const nombre = partes.shift()||h; const apellido = partes.join(' ');
      const nuevo = {id:'c'+Date.now(), tipo:'persona', nombre:nombre, apellido:apellido, docTipo:'V', docNum:ced, correo:'', ocupacion:'', ciudad:'', notas:'', historial:[], creado:new Date().toISOString()};
      const list=clientes(); list.push(nuevo); saveClientes(list); clienteId=nuevo.id;
    }
  }
  const noches = parseInt(document.getElementById('m-noches').value)||1;
  const tarifa = parseFloat(document.getElementById('m-tarifa').value)||0;
  updateRoom(num,{estado:'ocupada', huesped:h, clienteId:clienteId||'', personas:+document.getElementById('m-personas').value||1,
    noches:noches, tarifa:tarifa,
    checkin:new Date().toLocaleDateString('es-VE'), salida:document.getElementById('m-salida').value||''});
  logKardex('checkin', {hab:num, huesped:h, clienteId:clienteId||'', detalle:noches+' noche(s) · '+fmtUSD(tarifa)+'/noche', montoUsd:0, montoBs:0, metodo:''});
  abrirEstadia(clienteId||'', num, noches, tarifa);
  cerrarModal(); render();
}
function forzarLibre(num){ updateRoom(num,{estado:'libre',nota:''}); cerrarModal(); render(); }

/* ---- Cálculo automático y desglose USD/Bs ---- */
function desgloseBox(tarifa, noches, id){
  const totUsd = Number(tarifa||0)*(noches||1);
  return '<div style="background:#f3f6fb;border-radius:10px;padding:14px;margin-top:4px">'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;color:#55637a;margin-bottom:6px"><span>Tarifa × noches</span><span id="d-'+id+'-line">'+fmtUSD(tarifa)+' × '+(noches||1)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-weight:800;color:var(--azul);font-size:16px"><span>Total USD</span><span id="d-'+id+'-usd">'+fmtUSD(totUsd)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-weight:800;color:#111;font-size:16px;margin-top:4px"><span>Total Bs</span><span id="d-'+id+'-bs">'+fmtBs(precioBs(totUsd))+'</span></div>'+
    '<div style="text-align:right;font-size:11px;color:#8893a5;margin-top:6px">Tasa: '+fmtBs(tasa())+' / $1</div></div>';
}
function pintarDesglose(id, tarifa, noches){
  const tot = Number(tarifa||0)*(noches||1);
  document.getElementById('d-'+id+'-line').innerText = fmtUSD(tarifa)+' × '+(noches||1);
  document.getElementById('d-'+id+'-usd').innerText = fmtUSD(tot);
  document.getElementById('d-'+id+'-bs').innerText = fmtBs(precioBs(tot));
}
function recalcCheckin(num){
  const tarifa = parseFloat(document.getElementById('m-tarifa').value)||0;
  const noches = parseInt(document.getElementById('m-noches').value)||1;
  pintarDesglose('in', tarifa, noches);
}
function recalcOcup(num){
  const r = findRoom(num);
  const tarifa = parseFloat(document.getElementById('m-tarifa2').value)||0;
  pintarDesglose('ocup', tarifa, r.noches||1);
}
/* Recepción puede cambiar el precio de la habitación */
function guardarTarifaRecep(num){
  const inp = document.getElementById('m-tarifa2') || document.getElementById('m-tarifa');
  const v = parseFloat(inp.value)||0;
  updateRoom(num,{tarifa:v});
  abrirHab(num);
}
/* Check-out con recibo */
function pedirCheckout(num){
  const r = findRoom(num);
  const noches = r.noches||1; const hosp = Number(r.tarifa||0)*noches;
  const pend = cargosDe(r).filter(c=>!c.pagado);
  const consUsd = pend.reduce((s,c)=>s+Number(c.montoUsd||0),0);
  const totUsd = hosp + consUsd;
  const c = clienteDeHab(r);
  let body = '<button class="close" onclick="abrirHab('+num+')">×</button>';
  body += '<h2>Recibo · Hab. '+num+'</h2>';
  body += '<div class="rstate" style="color:#55637a">'+esc(r.huesped||'—')+'</div>';
  if(c){ const cr=clienteResumen(c);
    body += '<div style="background:#eef6ff;border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13px">';
    body += '<div style="font-weight:700;color:var(--azul);margin-bottom:4px">Datos del cliente'+(cr.tipo==='empresa'?' (Empresa)':'')+'</div>';
    if(cr.doc) body += '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:#55637a">'+(cr.tipo==='empresa'?'RIF':'Documento')+'</span><span>'+esc(cr.doc)+'</span></div>';
    if(cr.correo) body += '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:#55637a">Correo</span><span>'+esc(cr.correo)+'</span></div>';
    if(cr.ocupacion) body += '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="color:#55637a">'+(cr.tipo==='empresa'?'Actividad':'Ocupación')+'</span><span>'+esc(cr.ocupacion)+'</span></div>';
    if(cr.ciudad) body += '<div style="display:flex;justify-content:space-between"><span style="color:#55637a">Ciudad</span><span>'+esc(cr.ciudad)+'</span></div>';
    body += '</div>';
  }
  body += '<div style="background:#f3f6fb;border-radius:10px;padding:16px">';
  body += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>Tipo</span><span>'+(r.tipo||'')+'</span></div>';
  body += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>Entrada</span><span>'+(r.checkin||'—')+'</span></div>';
  body += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>Tarifa × noches</span><span>'+fmtUSD(r.tarifa)+' × '+noches+' = '+fmtUSD(hosp)+'</span></div>';
  pend.forEach(cg=>{ body += '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>'+esc(cg.tipo+(cg.desc?' · '+cg.desc:''))+'</span><span>'+fmtUSD(cg.montoUsd)+'</span></div>'; });
  body += '<div class="divider"></div>';
  body += '<div style="display:flex;justify-content:space-between;font-weight:800;color:var(--azul);font-size:18px"><span>Total USD</span><span>'+fmtUSD(totUsd)+'</span></div>';
  body += '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-top:4px"><span>Total Bs</span><span>'+fmtBs(precioBs(totUsd))+'</span></div>';
  body += '<div style="text-align:center;font-size:11px;color:#8893a5;margin-top:8px">Tasa: '+fmtBs(tasa())+' / $1</div></div>';
  body += pmWidget('co');
  body += '<div class="divider"></div><div class="actions"><button class="btn-green" onclick="cobrarYCheckout('+num+')">Cobrar y hacer check-out</button>';
  body += '<button class="btn-primary" onclick="imprimirRecibo('+num+')">Imprimir / PDF</button>';
  body += '<button class="btn-red" onclick="checkoutSinCobro('+num+')">Check-out sin cobro</button>';
  body += '<button class="btn-ghost" onclick="abrirHab('+num+')">Volver</button></div>';
  showModal(body); pmReset('co', totUsd);
}
function confirmCheckout(num){
  updateRoom(num,{estado:'sucia', huesped:'', clienteId:'', personas:0, noches:0, checkin:'', salida:'', cargos:[], limpiezaPendiente:false});
  cerrarModal(); render();
}
function checkoutSinCobro(num){
  const r = findRoom(num);
  logKardex('checkout', {hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:'Check-out sin cobro', montoUsd:0, montoBs:0, metodo:''});
  cerrarEstadia(r.clienteId||'', num, {montoUsd:0, metodo:'Sin cobro'});
  confirmCheckout(num);
}
function cobrarYCheckout(num){
  const r = findRoom(num);
  const noches = r.noches||1; const hosp = Number(r.tarifa||0)*noches;
  const pend = cargosDe(r).filter(c=>!c.pagado);
  const consUsd = pend.reduce((s,c)=>s+Number(c.montoUsd||0),0);
  const totUsd = hosp + consUsd;
  const pm=pmLeer('co'); if(!pm.ok){ alert(pm.msg); return; }
  const metodo = pm.metodoStr;
  const c = clienteDeHab(r); const cr = c?clienteResumen(c):null;
  const now = new Date();
  const ctrl = siguienteControl();
  const pagos = DB.get('pagos',[]);
  pagos.unshift({ id:Date.now(), control:ctrl, dia:diaKey(now), fechaStr:now.toLocaleString('es-VE'),
    hab:num, huesped:r.huesped||'', tipo:r.tipo||'', noches:noches, metodo:metodo, metodos:pm.metodos,
    clienteId:r.clienteId||'', clienteDoc:cr?cr.doc:'', clienteCiudad:cr?cr.ciudad:'',
    montoUsd:totUsd, montoBs:precioBs(totUsd), tasa:tasa(), usuario:session().nombre });
  DB.set('pagos', pagos);
  const det = noches+' noche(s)'+(consUsd>0?' + consumos '+fmtUSD(consUsd):'')+' cobradas';
  logKardex('checkout', {hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:det, montoUsd:totUsd, montoBs:precioBs(totUsd), metodo:metodo});
  cerrarEstadia(r.clienteId||'', num, {noches:noches, montoUsd:totUsd, metodo:metodo});
  confirmCheckout(num);
}

function totalCargosPend(r){ return cargosDe(r).filter(c=>!c.pagado).reduce((s,c)=>s+Number(c.montoUsd||0),0); }

function cgPrev(){ const m=parseFloat(document.getElementById('cg-monto').value)||0; const e=document.getElementById('cg-prev'); if(e) e.innerText='Equivale a '+fmtBs(precioBs(m)); }
function guardarCargo(num){
  const tipo=document.getElementById('cg-tipo').value;
  const desc=document.getElementById('cg-desc').value.trim();
  const monto=parseFloat(document.getElementById('cg-monto').value)||0;
  if(monto<=0){ alert('Escribe un monto mayor a 0'); return; }
  const r=findRoom(num); const cargos=cargosDe(r).slice();
  cargos.push({id:'cg'+Date.now(), tipo:tipo, desc:desc, montoUsd:monto, fecha:new Date().toISOString(), pagado:false});
  updateRoom(num,{cargos:cargos});
  logKardex('cargo',{hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:tipo+(desc?' · '+desc:'')+' · '+fmtUSD(monto), montoUsd:0, montoBs:0, metodo:''});
  abrirHab(num);

function quitarCargo(num,id){
  const r=findRoom(num); const cargos=cargosDe(r);
  const cg=cargos.find(x=>x.id===id); if(!cg) return;
  if(cg.pagado){ alert('Ese consumo ya fue cobrado, no se puede quitar.'); return; }
  if(!confirm('¿Quitar este consumo de la cuenta?')) return;
  updateRoom(num,{cargos:cargos.filter(x=>x.id!==id)}); abrirHab(num);
}

function cobCalc(){
  let t=0; document.querySelectorAll('.cob-chk').forEach(ch=>{ if(ch.checked) t+=Number(ch.getAttribute('data-m'))||0; });
  const otroEl=document.getElementById('cob-otro'); t+=(otroEl?parseFloat(otroEl.value)||0:0);
  const u=document.getElementById('cob-usd'), b=document.getElementById('cob-bs');
  if(u) u.innerText=fmtUSD(t); if(b) b.innerText=fmtBs(precioBs(t));
  pmSyncSingle('cob', t);
}
function cobrarSinCheckout(num){
  const r=findRoom(num); const ids=[]; let tot=0;
  document.querySelectorAll('.cob-chk').forEach(ch=>{ if(ch.checked){ ids.push(ch.value); tot+=Number(ch.getAttribute('data-m'))||0; } });
  const concepto=(document.getElementById('cob-concepto').value||'').trim();
  const otro=parseFloat(document.getElementById('cob-otro').value)||0; tot+=otro;
  if(tot<=0){ alert('No hay nada que cobrar. Selecciona un consumo o escribe un monto.'); return; }
  if(PM_STATE['cob']) PM_STATE['cob'].total=tot;
  const pm=pmLeer('cob'); if(!pm.ok){ alert(pm.msg); return; }
  const metodo=pm.metodoStr;
  const c=clienteDeHab(r); const cr=c?clienteResumen(c):null; const now=new Date();
  const detParts=[]; if(ids.length) detParts.push(ids.length+' consumo(s)'); if(otro>0) detParts.push(concepto||'Otro cobro');
  const ctrl = siguienteControl();
  const pagos=DB.get('pagos',[]);
  pagos.unshift({ id:Date.now(), control:ctrl, dia:diaKey(now), fechaStr:now.toLocaleString('es-VE'),
    hab:num, huesped:r.huesped||'', tipo:r.tipo||'', noches:0, metodo:metodo, metodos:pm.metodos,
    concepto:'Consumos / cobro en habitación', clienteId:r.clienteId||'', clienteDoc:cr?cr.doc:'', clienteCiudad:cr?cr.ciudad:'',
    montoUsd:tot, montoBs:precioBs(tot), tasa:tasa(), usuario:session().nombre });
  DB.set('pagos',pagos);
  const cargos=cargosDe(r).map(cg=> ids.includes(cg.id)?Object.assign({},cg,{pagado:true}):cg);
  updateRoom(num,{cargos:cargos});
  logKardex('pago',{hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:'Cobro sin check-out · '+(detParts.join(' + ')||'Cobro en habitación'), montoUsd:tot, montoBs:precioBs(tot), metodo:metodo});
  alert('Cobro registrado: '+fmtUSD(tot)+'. La habitación sigue ocupada.');
  abrirHab(num);
}
function solicitarLimpieza(num){
  const r=findRoom(num);
  if(r.limpiezaPendiente){ alert('Esta habitación ya tiene una limpieza solicitada.'); return; }
  updateRoom(num,{limpiezaPendiente:true});
  logKardex('limpieza',{hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:'Solicitud de limpieza en habitación ocupada', montoUsd:0, montoBs:0, metodo:''});
  alert('Listo. Se avisó a Ama de Llaves para limpiar la habitación '+num+'.');
  abrirHab(num);
}
function limpiezaOcupadaLista(num){
  updateRoom(num,{limpiezaPendiente:false});

function moverEstadiaHab(clienteId, habVieja, habNueva){
  if(!clienteId) return;
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c||!Array.isArray(c.historial)) return;
  const e=c.historial.find(x=>x.estado==='activa' && x.hab===habVieja) || c.historial.find(x=>x.estado==='activa');
  if(e){ e.hab=habNueva; saveClientes(list); }
}

  const libres=rooms().filter(r=>r.estado==='libre').sort((a,b)=>a.num-b.num);

function confirmarCambioHab(origen){
  const destinoNum=parseInt(document.getElementById('ch-destino').value);
  const motivo=(document.getElementById('ch-motivo').value||'').trim();
  const mant=document.getElementById('ch-mant').checked;
  const o=findRoom(origen); const d=findRoom(destinoNum);
  if(!d || d.estado!=='libre'){ alert('Esa habitación ya no está libre. Elige otra.'); return; }
  updateRoom(destinoNum,{estado:'ocupada', huesped:o.huesped, clienteId:o.clienteId||'', personas:o.personas||1, noches:o.noches||1, tarifa:o.tarifa||0, checkin:o.checkin||'', salida:o.salida||'', cargos:cargosDe(o).slice(), nota:'', limpiezaPendiente:false});
  updateRoom(origen,{estado:'sucia', huesped:'', clienteId:'', personas:0, noches:0, checkin:'', salida:'', cargos:[], limpiezaPendiente:false, nota:'Habitación desocupada por cambio'+(motivo?' · '+motivo:'')});
  moverEstadiaHab(o.clienteId||'', origen, destinoNum);
  logKardex('cambio',{hab:origen, huesped:o.huesped||'', clienteId:o.clienteId||'', detalle:'Cambio de Hab. '+origen+' → '+destinoNum+(motivo?' · '+motivo:''), montoUsd:0, montoBs:0, metodo:''});
  if(mant){
    const reps=DB.get('reportes',[]);
    reps.unshift({id:Date.now(), hab:origen, desc:motivo||'Revisión tras cambio de habitación', prio:'media', estado:'pendiente', por:session().nombre, fecha:new Date().toLocaleDateString('es-VE')});
    DB.set('reportes',reps);
    updateRoom(origen,{estado:'mantenimiento'});
  }
  cerrarModal(); render();
  alert('Huésped mudado a la habitación '+destinoNum+'.');
}

/* ====== AMA DE LLAVES ====== */
function renderHousekeeping(){
  const c = document.getElementById('content');
  let html = '<div class="section-title">Ama de Llaves · Habitaciones por atender</div>';
  const porLimpiar = rooms().filter(r=>r.estado==='sucia');
  const enLimpieza = rooms().filter(r=>r.estado==='limpieza');
  html += '<div class="stats"><div class="stat" style="border-left-color:var(--naranja)"><div class="n">'+porLimpiar.length+'</div><div class="l">Por limpiar</div></div>';
  html += '<div class="stat" style="border-left-color:var(--azul2)"><div class="n">'+enLimpieza.length+'</div><div class="l">En limpieza</div></div>';
  html += '<div class="stat" style="border-left-color:var(--verde)"><div class="n">'+countBy('libre')+'</div><div class="l">Listas</div></div></div>';
  const ocupLimp = rooms().filter(r=>r.estado==='ocupada' && r.limpiezaPendiente);
  if(ocupLimp.length){
    html += '<div class="section-title" style="font-size:15px;margin-top:8px">🧹 Limpieza solicitada (habitación ocupada)</div><div class="task-list">';
    ocupLimp.forEach(r=>{
      html += '<div class="task"><div class="info"><b>Habitación '+r.num+'</b> <span style="color:#b5651d;font-weight:700;font-size:13px">Huésped dentro</span><div class="meta">Piso '+r.piso+' · '+esc(r.huesped||'')+'</div></div><div class="acts"><button class="btn-green" onclick="limpiezaOcupadaLista('+r.num+')">Limpieza hecha</button></div></div>';
    });
    html += '</div>';
  }
  const todas = enLimpieza.concat(porLimpiar);
  if(todas.length===0){ if(ocupLimp.length===0){ html += '<div class="empty">✅ No hay habitaciones pendientes. ¡Todo al día!</div>'; } c.innerHTML=html; return; }
  html += '<div class="task-list">';
  todas.forEach(r=>{
    const enProg = r.estado==='limpieza';

function resolverReporte(id){
  const reps = DB.get('reportes',[]);

/* ====== OCUPACIÓN POR TIPO DE HABITACIÓN ====== */
function datosOcupacionTipo(){
  const rs=rooms(); const filas=[];
  const tipos=getTipos().slice();
  // incluir tipos presentes en habitaciones aunque no estén en la lista
  rs.forEach(r=>{ const t=r.tipo||'(sin tipo)'; if(tipos.indexOf(t)<0) tipos.push(t); });
  let tot={total:0,ocupadas:0,libres:0,otras:0};
  tipos.forEach(t=>{
    const grupo=rs.filter(r=>(r.tipo||'(sin tipo)')===t);
    if(grupo.length===0 && getTipos().indexOf(t)<0) return;
    const total=grupo.length;
    const ocupadas=grupo.filter(r=>r.estado==='ocupada').length;
    const libres=grupo.filter(r=>r.estado==='libre').length;
    const otras=total-ocupadas-libres;
    const pct= total? Math.round(ocupadas/total*100) : 0;
    filas.push({tipo:t, total:total, ocupadas:ocupadas, libres:libres, otras:otras, pct:pct, precio:precioBaseTipo(t)});
    tot.total+=total; tot.ocupadas+=ocupadas; tot.libres+=libres; tot.otras+=otras;
  });
  tot.pct= tot.total? Math.round(tot.ocupadas/tot.total*100) : 0;
  return {filas:filas, tot:tot};
}

  const D=datosOcupacionTipo();

  D.filas.forEach(f=>{
    h+='<tr><td><b>'+esc(f.tipo)+'</b></td><td style="font-size:13px">'+(f.precio>0?precioLinea(f.precio):'—')+'</td><td>'+f.total+'</td><td style="color:var(--rojo);font-weight:700">'+f.ocupadas+'</td><td style="color:var(--verde);font-weight:700">'+f.libres+'</td><td>'+f.otras+'</td><td><b>'+f.pct+'%</b></td></tr>';

  h+='<tr style="font-weight:800;background:#f3f6fb"><td>TOTAL</td><td>—</td><td>'+D.tot.total+'</td><td>'+D.tot.ocupadas+'</td><td>'+D.tot.libres+'</td><td>'+D.tot.otras+'</td><td>'+D.tot.pct+'%</td></tr></table>';

  h += '<p style="font-size:12px;color:#8893a5;margin-top:8px">Numera automáticamente (ej. piso 3 → 301, 302, 303…). Luego puedes editar cada una.</p></div>';

  // --- Agregar una habitación suelta ---
  h += '<div style="background:#fff;padding:18px;border-radius:12px;max-width:560px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:20px">';
  h += '<div class="section-title" style="font-size:15px;margin-top:0">Agregar una habitación</div>';
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap">';
  h += '<div style="flex:1;min-width:90px"><label>Número</label><input id="ar-num" type="number"></div>';

  h += '<div style="flex:1;min-width:110px"><label>Tarifa (USD)</label><input id="ar-tarifa" type="number" min="0" step="0.01" value="'+precioBaseTipo('Individual')+'"></div>';

  // --- Listado editable ---
  h += '<div class="section-title" style="font-size:15px">Habitaciones actuales ('+rooms().length+')</div>';
  if(rooms().length===0){ h += '<div class="empty">No hay habitaciones. Crea un piso arriba para empezar.</div>'; return h; }
  h += barraSeleccionHab();
  pisos().forEach(p=>{
    const list = rooms().filter(r=>r.piso===p).sort((a,b)=>a.num-b.num);
    const todas = list.length>0 && list.every(r=>selHabs.has(r.num));
    h += '<h3 style="font-size:14px;color:#55637a;margin:14px 0 8px">Piso '+p+' ('+list.length+')</h3>';
    h += '<table class="users-table"><tr><th style="width:34px"><input type="checkbox" '+(todas?'checked':'')+' onclick="toggleSelPiso('+p+',this.checked)" title="Seleccionar todo el piso"></th><th>Hab.</th><th>Tipo</th><th>Tarifa</th><th>Estado</th><th style="text-align:right">Acciones</th></tr>';
    list.forEach(r=>{
      const chk = selHabs.has(r.num)?'checked':'';
      h += '<tr'+(selHabs.has(r.num)?' style="background:#eef6ff"':'')+'><td><input type="checkbox" '+chk+' onclick="toggleSelHab('+r.num+',this.checked)"></td><td><b>'+r.num+'</b></td><td>'+esc(r.tipo||'')+'</td><td style="font-size:13px">'+precioLinea(r.tarifa)+'</td><td>'+ESTADOS[r.estado].t+'</td>'+
        '<td style="text-align:right;white-space:nowrap"><button class="btn-ghost" style="padding:6px 12px;margin-right:6px" onclick="editRoomModal('+r.num+')">Editar</button>'+
        '<button class="btn-red" style="padding:6px 12px" onclick="deleteRoom('+r.num+')">Eliminar</button></td></tr>';
    });
    h += '</table>';
  });
  return h;
}
let selHabs = new Set();
function toggleSelHab(num, on){ if(on) selHabs.add(num); else selHabs.delete(num); render(); }
function toggleSelPiso(piso, on){ rooms().filter(r=>r.piso===piso).forEach(r=>{ if(on) selHabs.add(r.num); else selHabs.delete(r.num); }); render(); }
function limpiarSelHab(){ selHabs.clear(); render(); }
function habsSeleccionadas(){ return rooms().filter(r=>selHabs.has(r.num)); }
function barraSeleccionHab(){
  const n = habsSeleccionadas().length;
  let h = '<div style="background:'+(n?'#0d3b66':'#eef1f6')+';color:'+(n?'#fff':'#55637a')+';padding:12px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">';
  h += '<b style="font-size:14px">'+(n? (n+' habitación(es) seleccionada(s)') : 'Selecciona habitaciones para editarlas en grupo')+'</b>';
  if(n){
    h += '<button class="btn-green" style="padding:6px 12px" onclick="bulkPrecioModal()">Cambiar precio</button>';
    h += '<button class="btn-primary" style="padding:6px 12px" onclick="bulkTipoModal()">Cambiar tipo</button>';
    h += '<button class="btn-red" style="padding:6px 12px" onclick="bulkEliminarHabs()">Eliminar</button>';
    h += '<button class="btn-ghost" style="padding:6px 12px" onclick="limpiarSelHab()">Quitar selección</button>';
  }
  h += '</div>';
  return h;
}
function bulkPrecioModal(){
  const n=habsSeleccionadas().length; if(!n){ alert('No hay habitaciones seleccionadas.'); return; }
  let body = '<button class="close" onclick="cerrarModal()">×</button><h2>Cambiar precio a '+n+' habitación(es)</h2>';
  body += '<div class="field"><label>Nueva tarifa por noche (USD)</label><input id="bulk-precio" type="number" min="0" step="0.01" value="0"></div>';
  body += '<p style="font-size:12px;color:#8893a5">Se aplicará la misma tarifa a todas las habitaciones seleccionadas.</p>';
  body += '<div class="divider"></div><div class="actions"><button class="btn-green" onclick="aplicarBulkPrecio()">Aplicar</button><button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';
  showModal(body);
}
function aplicarBulkPrecio(){
  const v=parseFloat(document.getElementById('bulk-precio').value);
  if(isNaN(v)||v<0){ alert('Escribe una tarifa válida.'); return; }
  const r=rooms(); r.forEach(x=>{ if(selHabs.has(x.num)) x.tarifa=v; }); saveRooms(r);
  cerrarModal(); render();
}
function bulkTipoModal(){
  const n=habsSeleccionadas().length; if(!n){ alert('No hay habitaciones seleccionadas.'); return; }
  let body = '<button class="close" onclick="cerrarModal()">×</button><h2>Cambiar tipo a '+n+' habitación(es)</h2>';
  body += '<div class="field"><label>Nuevo tipo</label><select id="bulk-tipo">'+tipoOptions(getTipos()[0])+'</select></div>';
  body += '<label style="display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;margin-bottom:6px"><input type="checkbox" id="bulk-tipo-precio" checked style="width:auto"> Poner también el precio base de ese tipo</label>';
  body += '<div class="divider"></div><div class="actions"><button class="btn-green" onclick="aplicarBulkTipo()">Aplicar</button><button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';
  showModal(body);
}
function aplicarBulkTipo(){
  const t=document.getElementById('bulk-tipo').value;
  const ponerPrecio=document.getElementById('bulk-tipo-precio').checked;
  const base=precioBaseTipo(t);
  const r=rooms(); r.forEach(x=>{ if(selHabs.has(x.num)){ x.tipo=t; if(ponerPrecio) x.tarifa=base; } }); saveRooms(r);
  cerrarModal(); render();
}
function bulkEliminarHabs(){
  const sel=habsSeleccionadas();
  const ocupadas=sel.filter(r=>r.estado==='ocupada');
  const borrables=sel.filter(r=>r.estado!=='ocupada');
  if(borrables.length===0){ alert('No se puede borrar: todas las seleccionadas están ocupadas. Haz check-out primero.'); return; }
  let msg='¿Eliminar '+borrables.length+' habitación(es)?';
  if(ocupadas.length) msg+=' ('+ocupadas.length+' están ocupadas y NO se borrarán).';
  if(!confirm(msg)) return;
  const nums=borrables.map(r=>r.num);
  saveRooms(rooms().filter(x=>nums.indexOf(x.num)<0));
  const reps=DB.get('reportes',[]).filter(x=>nums.indexOf(x.hab)<0); DB.set('reportes',reps);
  nums.forEach(num=>selHabs.delete(num));
  render();
}

function bulkAddFloor(){
  const piso = parseInt(document.getElementById('bf-piso').value);
  const cant = parseInt(document.getElementById('bf-cant').value);
  const tipo = document.getElementById('bf-tipo').value;
  const tarifa = parseFloat(document.getElementById('bf-tarifa').value)||0;
  if(!piso||!cant||cant<1){ alert('Revisa el número de piso y la cantidad'); return; }
  const r = rooms(); let creadas=0;
  for(let n=1;n<=cant;n++){
    const num = piso*100+n;
    if(r.find(x=>x.num===num)) continue;
    r.push({num:num,piso:piso,tipo:tipo,tarifa:tarifa,estado:'libre',huesped:'',personas:0,checkin:'',salida:'',nota:''});
    creadas++;
  }
  saveRooms(r);
  if(creadas===0) alert('Esas habitaciones ya existían.');
  render();
}
function addRoomSingle(){
  const num = parseInt(document.getElementById('ar-num').value);
  const piso = parseInt(document.getElementById('ar-piso').value);
  const tipo = document.getElementById('ar-tipo').value;
  const tarifa = parseFloat(document.getElementById('ar-tarifa').value)||0;
  if(!num||!piso){ alert('Completa número y piso'); return; }
  const r = rooms();
  if(r.find(x=>x.num===num)){ alert('Ya existe la habitación '+num); return; }
  r.push({num:num,piso:piso,tipo:tipo,tarifa:tarifa,estado:'libre',huesped:'',personas:0,checkin:'',salida:'',nota:''});
  saveRooms(r); render();
}
function editRoomModal(num){
  const r = findRoom(num);
  let body = '<button class="close" onclick="cerrarModal()">×</button>';
  body += '<h2>Editar habitación '+num+'</h2><div class="rstate" style="color:#55637a">Estado actual: '+ESTADOS[r.estado].t+'</div>';
  body += '<div class="field"><label>Número</label><input id="ed-num" type="number" value="'+r.num+'"></div>';
  body += '<div class="field"><label>Piso</label><input id="ed-piso" type="number" min="1" value="'+r.piso+'"></div>';
  body += '<div class="field"><label>Tipo</label><select id="ed-tipo" onchange="autoPrecioTipo(\'ed-tipo\',\'ed-tarifa\')">'+tipoOptions(r.tipo)+'</select></div>';
  body += '<div class="field"><label>Tarifa (USD) <span style="color:#8893a5;font-weight:400;font-size:12px">(al cambiar el tipo se pone el precio base; puedes ajustarla)</span></label><input id="ed-tarifa" type="number" min="0" step="0.01" value="'+(r.tarifa||0)+'"></div>';
  body += '<div class="divider"></div><div class="actions"><button class="btn-green" onclick="saveRoomEdit('+num+')">Guardar cambios</button>';
  body += '<button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';
  showModal(body);
}
function saveRoomEdit(oldNum){
  const nuevo = parseInt(document.getElementById('ed-num').value);
  const piso = parseInt(document.getElementById('ed-piso').value);
  const tipo = document.getElementById('ed-tipo').value;
  if(!nuevo||!piso){ alert('Revisa número y piso'); return; }
  const r = rooms();
  if(nuevo!==oldNum && r.find(x=>x.num===nuevo)){ alert('Ya existe la habitación '+nuevo); return; }
  const i = r.findIndex(x=>x.num===oldNum);
  r[i].num=nuevo; r[i].piso=piso; r[i].tipo=tipo; r[i].tarifa=parseFloat(document.getElementById('ed-tarifa').value)||0;
  saveRooms(r);
  if(nuevo!==oldNum){ // actualizar reportes que apuntaban a esta hab
    const reps=DB.get('reportes',[]); reps.forEach(x=>{ if(x.hab===oldNum) x.hab=nuevo; }); DB.set('reportes',reps);
  }
  cerrarModal(); render();
}
function deleteRoom(num){
  const r = findRoom(num);
  if(r.estado==='ocupada'){ alert('No puedes eliminar una habitación ocupada. Haz check-out primero.'); return; }
  if(!confirm('¿Eliminar la habitación '+num+'?')) return;
  saveRooms(rooms().filter(x=>x.num!==num));
  const reps=DB.get('reportes',[]).filter(x=>x.hab!==num); DB.set('reportes',reps);
  render();
}
function agregarTipo(){
  const el=document.getElementById('tipo-nuevo'); if(!el) return;
  const v=el.value.trim(); if(!v){ alert('Escribe un nombre para el tipo.'); return; }
  const ts=getTipos(); if(ts.some(x=>x.toLowerCase()===v.toLowerCase())){ alert('Ese tipo ya existe.'); return; }
  const pe=document.getElementById('tipo-nuevo-precio'); const precio=pe?(parseFloat(pe.value)||0):0;
  ts.push(v); saveTipos(ts); setPrecioBaseTipo(v, precio); render();
}
function guardarTipo(i){
  const el=document.getElementById('tipo-'+i); if(!el) return;
  const v=el.value.trim(); if(!v){ alert('El nombre no puede quedar vacío.'); return; }
  const ts=getTipos(); if(ts.some((x,j)=>j!==i && x.toLowerCase()===v.toLowerCase())){ alert('Ya existe otro tipo con ese nombre.'); return; }
  const pe=document.getElementById('tipo-precio-'+i); const precio=pe?(parseFloat(pe.value)||0):0;
  const viejo=ts[i]; ts[i]=v; saveTipos(ts);
  // mover el precio base al nombre nuevo
  const pm=getPreciosTipo(); if(viejo!==v){ delete pm[viejo]; } pm[v]=precio; DB.set('preciosTipo', pm);
  // renombrar el tipo en las habitaciones que lo usaban
  if(viejo!==v){ const r=rooms(); r.forEach(x=>{ if(x.tipo===viejo) x.tipo=v; }); saveRooms(r); }
  render(); alert('Tipo actualizado.');
}
function eliminarTipo(i){
  const ts=getTipos(); if(ts.length<=1){ alert('Debe quedar al menos un tipo de habitación.'); return; }
  const usadas=rooms().filter(x=>x.tipo===ts[i]).length;
  const aviso='¿Eliminar el tipo "'+ts[i]+'"?'+(usadas?(' Hay '+usadas+' habitación(es) con este tipo; quedarán sin tipo hasta que las edites.'):'');
  if(!confirm(aviso)) return;
  const pm=getPreciosTipo(); delete pm[ts[i]]; DB.set('preciosTipo', pm);
  ts.splice(i,1); saveTipos(ts); render();
}

function renderTasa(){
  let h = '<div style="background:#fff;padding:22px;border-radius:12px;max-width:480px;box-shadow:0 2px 8px rgba(0,0,0,.05)">';
  h += '<div style="text-align:center;margin-bottom:18px"><div style="font-size:13px;color:#8893a5;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Tasa actual</div>';
  h += '<div style="font-size:34px;font-weight:800;color:var(--azul)">'+fmtBs(tasa())+'</div><div style="font-size:13px;color:#8893a5">por cada $1</div></div>';
  h += '<div class="field"><label>Fijar tasa manualmente (Bs por USD)</label><input id="ts-val" type="number" min="0" step="0.01" value="'+tasa()+'"></div>';
  h += '<div class="actions" style="margin-top:10px"><button class="btn-green" onclick="guardarTasaManual()">Guardar tasa</button>';
  h += '<button class="btn-primary" onclick="actualizarTasaBCV()">Traer tasa oficial del BCV</button></div>';
  h += '<div id="ts-msg" style="text-align:center;font-size:13px;margin-top:12px;min-height:18px;color:#55637a"></div>';
  h += '<p style="font-size:12px;color:#8893a5;margin-top:6px;line-height:1.6">Todas las tarifas se guardan en USD y se muestran también en Bs usando esta tasa. Si la cambias, todos los precios en bolívares se recalculan al instante.</p></div>';
  return h;
}
function guardarTasaManual(){
  const v = parseFloat(document.getElementById('ts-val').value);
  if(!v||v<=0){ alert('Escribe una tasa válida'); return; }
  setTasa(v); render();
}
async function actualizarTasaBCV(){
  const msg = document.getElementById('ts-msg');
  msg.innerText = 'Consultando al BCV…';
  try{
    const resp = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
    if(!resp.ok) throw new Error();
    const d = await resp.json();
    if(!d.promedio) throw new Error();
    setTasa(Number(d.promedio.toFixed(2)));
    render();
  }catch(e){
    msg.innerText = 'No se pudo conectar con el BCV. Verifica tu internet o fija la tasa a mano.';
  }
}

let cajaFecha = diaKey();
function setCajaFecha(v){ cajaFecha = v || diaKey(); render(); }
function renderCaja(){
  const pagos = DB.get('pagos',[]).filter(p=>p.dia===cajaFecha);
  let h = '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px">';
  h += '<div style="flex:1;min-width:160px"><label>Fecha del arqueo</label><input type="date" value="'+cajaFecha+'" onchange="setCajaFecha(this.value)"></div>';

  h += '<button class="btn-gray" onclick="imprimirArqueo()">Imprimir / PDF</button>';
  h += '<button class="btn-ghost" onclick="exportarCajaCSV()">Exportar CSV</button></div>';
  const porMetodo = {}; let totBs=0, totUsd=0;
  getMetodos().forEach(m=>porMetodo[m]={bs:0,usd:0,n:0});
  pagos.forEach(p=>{ if(Array.isArray(p.metodos)&&p.metodos.length){ p.metodos.forEach(m=>{ if(!porMetodo[m.metodo]) porMetodo[m.metodo]={bs:0,usd:0,n:0}; porMetodo[m.metodo].bs+=Number(m.montoBs)||0; porMetodo[m.metodo].usd+=Number(m.montoUsd)||0; porMetodo[m.metodo].n++; }); } else { if(!porMetodo[p.metodo]) porMetodo[p.metodo]={bs:0,usd:0,n:0}; porMetodo[p.metodo].bs+=p.montoBs; porMetodo[p.metodo].usd+=p.montoUsd; porMetodo[p.metodo].n++; } totBs+=p.montoBs; totUsd+=p.montoUsd; });
  h += '<div class="stats"><div class="stat" style="border-left-color:var(--verde)"><div class="n" style="font-size:20px">'+fmtBs(totBs)+'</div><div class="l">Total del día (Bs)</div></div>';
  h += '<div class="stat" style="border-left-color:var(--azul2)"><div class="n" style="font-size:20px">'+fmtUSD(totUsd)+'</div><div class="l">Equivalente USD</div></div>';
  h += '<div class="stat" style="border-left-color:var(--gris)"><div class="n">'+pagos.length+'</div><div class="l">Transacciones</div></div></div>';
  h += '<div class="section-title" style="font-size:15px">Desglose por forma de pago</div>';
  h += '<table class="users-table"><tr><th>Forma de pago</th><th>N°</th><th>Total Bs</th><th>Total USD</th></tr>';
  let keys = Object.keys(porMetodo);
  keys.forEach(m=>{ const x=porMetodo[m]; if(x.n===0 && getMetodos().indexOf(m)<0) return; h += '<tr><td>'+esc(m)+'</td><td>'+x.n+'</td><td>'+fmtBs(x.bs)+'</td><td>'+fmtUSD(x.usd)+'</td></tr>'; });
  h += '<tr style="font-weight:800;background:#f3f6fb"><td>TOTAL</td><td>'+pagos.length+'</td><td>'+fmtBs(totBs)+'</td><td>'+fmtUSD(totUsd)+'</td></tr></table>';
  h += '<div class="section-title" style="font-size:15px;margin-top:22px">Movimientos del día</div>';
  if(pagos.length===0){ h += '<div class="empty">No hay cobros registrados en esta fecha.</div>'; return h; }
  h += '<div class="task-list">';
  pagos.forEach(p=>{
    h += '<div class="task"><div class="info"><b>'+(p.hab?('Hab. '+p.hab):'Cobro manual')+'</b> <span style="font-size:12.5px;color:#55637a">'+esc(p.huesped||p.concepto||'')+'</span><div class="meta">'+(p.control?('Control N° '+fmtControl(p.control)+' · '):'')+p.metodo+' · '+p.fechaStr+' · '+esc(p.usuario||'')+'</div></div>';
    h += '<div style="text-align:right"><div style="font-weight:800;color:var(--azul)">'+fmtBs(p.montoBs)+'</div><div style="font-size:12px;color:#8893a5">'+fmtUSD(p.montoUsd)+'</div>';
    if(session().rol==='admin' || puedeSup('anularPagos')) h += '<button class="btn-red" style="padding:4px 10px;margin-top:4px;font-size:12px" onclick="borrarPago('+p.id+')">Anular</button>';
    h += '</div></div>';
  });
  h += '</div>';
  return h;
}
function pagoManualModal(){

  body += '<div class="field" style="flex:1"><label>Moneda</label><select id="pm-moneda" onchange="pmCalcManual()"><option value="Bs">Bs</option><option value="USD">USD</option></select></div></div>';
  body += pmWidget('pm');
  body += '<div class="divider"></div><div class="actions"><button class="btn-green" onclick="guardarPagoManual()">Guardar cobro</button><button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';

function pmCalcManual(){
  const mEl=document.getElementById('pm-monto'); const monto=mEl?(parseFloat(mEl.value)||0):0;
  const moneda=(document.getElementById('pm-moneda')||{}).value||'Bs';
  const usd = moneda==='USD'? monto : (monto/tasa());
  pmSyncSingle('pm', usd);
}
function guardarPagoManual(){
  const concepto = document.getElementById('pm-concepto').value.trim();
  const monto = parseFloat(document.getElementById('pm-monto').value)||0;
  const moneda = document.getElementById('pm-moneda').value;
  if(monto<=0){ alert('Escribe el monto'); return; }
  const totalUsd = moneda==='USD'? monto : (monto/tasa());
  if(PM_STATE['pm']) PM_STATE['pm'].total=totalUsd;
  const pm=pmLeer('pm'); if(!pm.ok){ alert(pm.msg); return; }
  const montoUsd=pm.totalUsd; const montoBs=precioBs(montoUsd);
  const clienteId=(document.getElementById('pm-cliente')||{}).value||'';
  let clienteDoc='', clienteCiudad='', clienteNom='';
  if(clienteId){ const cc=clienteById(clienteId); if(cc){ const cr=clienteResumen(cc); clienteDoc=cr.doc; clienteCiudad=cr.ciudad; clienteNom=cr.nom; } }
  const now = new Date();
  const ctrl = siguienteControl();
  const pagos = DB.get('pagos',[]);
  pagos.unshift({ id:Date.now(), control:ctrl, dia:diaKey(now), fechaStr:now.toLocaleString('es-VE'),
    hab:0, huesped:clienteNom, concepto:concepto||'Cobro manual', metodo:pm.metodoStr, metodos:pm.metodos,

function cargarCargoCliente(clienteId, info){
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c) return;
  if(!Array.isArray(c.historial)) c.historial=[];
  const ahora=new Date().toISOString();
  c.historial.unshift({ id:'e'+Date.now(), hab:'', concepto:info.concepto||'Cargo de caja', entrada:ahora, salida:ahora, noches:0, tarifa:0, montoUsd:Number(info.montoUsd)||0, metodo:info.metodo||'', estado:'cargo' });

function clienteNombre(c){ return c?(c.tipo==='empresa'?(c.nombre||''):((c.nombre||'')+' '+(c.apellido||'')).trim()):''; }
function fmtFecha(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleDateString('es-VE'); }catch(e){ return '—'; } }
/* ---- Historial de estadías (vive dentro de cada cliente) ---- */
function abrirEstadia(clienteId, hab, noches, tarifa){
  if(!clienteId) return;
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c) return;
  if(!Array.isArray(c.historial)) c.historial=[];
  c.historial.forEach(e=>{ if(e.estado==='activa' && e.hab===hab) e.estado='cerrada'; });
  c.historial.unshift({ id:'e'+Date.now(), hab:hab, entrada:new Date().toISOString(), salida:'', noches:noches||1, tarifa:Number(tarifa||0), montoUsd:0, metodo:'', estado:'activa' });
  saveClientes(list);
}
function cerrarEstadia(clienteId, hab, info){
  if(!clienteId) return;
  const list=clientes(); const c=list.find(x=>x.id===clienteId); if(!c) return;
  if(!Array.isArray(c.historial)) c.historial=[];
  let e = c.historial.find(x=>x.estado==='activa' && x.hab===hab) || c.historial.find(x=>x.estado==='activa');
  if(e){ e.salida=new Date().toISOString(); e.estado='cerrada'; }
  else { e={ id:'e'+Date.now(), hab:hab, entrada:'', salida:new Date().toISOString(), noches:1, tarifa:0, montoUsd:0, metodo:'', estado:'cerrada' }; c.historial.unshift(e); }
  if(info){ if(info.noches!=null) e.noches=info.noches; e.montoUsd=Number(info.montoUsd||0); e.metodo=info.metodo||''; }
  saveClientes(list);
}

  const list=clientes(); const c=list.find(x=>x.id===id); if(!c) return;

function resumenHuesped(c){
  const hist=Array.isArray(c.historial)?c.historial:[];
  const completas=hist.filter(e=>e.estado!=='activa' && e.estado!=='cargo').length;
  const activas=hist.filter(e=>e.estado==='activa').length;
  const noches=hist.reduce((s,e)=>s+Number(e.noches||0),0);
  const totUsd=hist.reduce((s,e)=>s+Number(e.montoUsd||0),0);
  const fechas=hist.map(e=>e.entrada).filter(Boolean).sort();
  return {estadias:hist.length, completas:completas, activas:activas, noches:noches, totUsd:totUsd, ultima:fechas.length?fechas[fechas.length-1]:''};
}

function exportarClientesCSV(){
  const list=clientes().slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  if(list.length===0){ alert('Todavía no hay huéspedes registrados.'); return; }
  const q = s => '"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  let csv='Nombre,Apellido,Tipo,Documento,Correo,Ocupacion,Ciudad,Estadias completas,En curso,Noches totales,Total hospedado USD,Ultima visita,Notas\n';
  list.forEach(c=>{
    const r=resumenHuesped(c);
    const doc = c.docNum?(docLabel(c.docTipo)+' '+c.docNum):'';
    csv += [q(c.nombre||''),q(c.apellido||''),q(c.tipo||'persona'),q(doc),q(c.correo||''),q(c.ocupacion||''),q(c.ciudad||''),q(r.completas),q(r.activas),q(r.noches),q(r.totUsd.toFixed(2)),q(r.ultima?fmtFecha(r.ultima):''),q(c.notas||'')].join(',')+'\n';
  });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='resumen_huespedes.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function guardarCliente(){
  const tipo=document.getElementById('cl-tipo').value;
  const nombre=document.getElementById('cl-nombre').value.trim();
  const apellido=document.getElementById('cl-apellido').value.trim();
  const docTipo=document.getElementById('cl-doctipo').value;
  const docNum=document.getElementById('cl-docnum').value.trim();
  const correo=document.getElementById('cl-correo').value.trim();
  const ocupacion=document.getElementById('cl-ocup').value.trim();
  const ciudad=document.getElementById('cl-ciudad').value.trim();
  if(!nombre){ alert(tipo==='empresa'?'Escribe el nombre de la empresa':'Escribe el nombre'); return; }
  if(correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){ alert('El correo no parece válido'); return; }
  const list=clientes();
  if(docNum && list.find(c=>c.docNum===docNum && c.docTipo===docTipo)){ alert('Ya existe un cliente con ese documento'); return; }
  const nuevoId='c'+Date.now();
  list.push({id:nuevoId, tipo:tipo, nombre:nombre, apellido:apellido, docTipo:docTipo, docNum:docNum, correo:correo, ocupacion:ocupacion, ciudad:ciudad, notas:'', historial:[], creado:new Date().toISOString()});
  saveClientes(list);
  const nomReg = tipo==='empresa'?nombre:((nombre+' '+apellido).trim());
  logKardex('cliente', {hab:0, huesped:nomReg, clienteId:nuevoId, detalle:'Cliente registrado'+(docNum?' · '+docLabel(docTipo)+' '+docNum:''), montoUsd:0, montoBs:0, metodo:''});
  render();
}

function guardarEdicionCliente(id){
  const list=clientes(); const i=list.findIndex(x=>x.id===id); if(i<0) return;
  const nombre=document.getElementById('ec-nombre').value.trim();
  if(!nombre){ alert('El nombre no puede quedar vacío'); return; }
  const correo=document.getElementById('ec-correo').value.trim();
  if(correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){ alert('El correo no parece válido'); return; }
  list[i]=Object.assign(list[i],{
    tipo:document.getElementById('ec-tipo').value,
    nombre:nombre, apellido:document.getElementById('ec-apellido').value.trim(),
    docTipo:document.getElementById('ec-doctipo').value,
    docNum:document.getElementById('ec-docnum').value.trim(),
    correo:correo, ocupacion:document.getElementById('ec-ocup').value.trim(),
    ciudad:document.getElementById('ec-ciudad').value.trim(),
    notas:(document.getElementById('ec-notas')?document.getElementById('ec-notas').value:(list[i].notas||''))
  });

function deleteCliente(id){
  if(!confirm('¿Eliminar este cliente?')) return;
  saveClientes(clientes().filter(c=>c.id!==id)); render();
}

let kardexTurnoSel = '';
function turnos(){ return DB.get('turnos', []); }
function saveTurnos(t){ DB.set('turnos', t); }
function turnoActivo(){ return turnos().find(t=>t.abierto)||null; }
function kardexAll(){ return DB.get('kardex', []); }
function kardexDeTurno(id){ return kardexAll().filter(k=>k.turnoId===id); }
function logKardex(tipo, data){
  const k = kardexAll();
  const act = turnoActivo();
  const s = session();
  k.unshift(Object.assign({ id:'k'+Date.now()+Math.random().toString(36).slice(2,6), ts:new Date().toISOString(), turnoId: act?act.id:null, usuario: s?s.nombre:'', tipo:tipo }, data||{}));
  DB.set('kardex', k);
}
function abrirTurno(){
  if(turnoActivo()){ alert('Ya hay un turno abierto. Ciérralo antes de abrir otro.'); return; }
  const s=session(); const t=turnos();
  t.unshift({ id:'t'+Date.now(), usuario:s.user, nombre:s.nombre, inicio:new Date().toISOString(), fin:null, abierto:true });
  saveTurnos(t); render();
}
function cerrarTurno(){
  const t=turnos(); const a=t.find(x=>x.abierto); if(!a){ alert('No hay ningún turno abierto.'); return; }
  if(!confirm('¿Cerrar el turno de '+a.nombre+'? Los próximos movimientos ya no se registrarán en él.')) return;
  a.fin=new Date().toISOString(); a.abierto=false; saveTurnos(t); render();
}

function duracionTurno(t){

function turnoBloque(t){

function exportarKardexCSV(turnoId){

}

function cargarLogo(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ alert('Elige un archivo de imagen (PNG o JPG).'); return; }
  if(f.size>8000000){ alert('La imagen es demasiado pesada (máximo 8 MB). Usa una un poco más liviana.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=512; let w=img.width, hg=img.height;
      if(w>MAX||hg>MAX){ const s=Math.min(MAX/w, MAX/hg); w=Math.round(w*s); hg=Math.round(hg*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=hg;
      cv.getContext('2d').drawImage(img,0,0,w,hg);
      const data = /png/i.test(f.type) ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.85);
      const h=leerHotelForm(); h.logo=data; saveHotel(h); pintarMarca(); render();
    };
    img.onerror=function(){ alert('No se pudo leer la imagen. Prueba con otra.'); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

      html+='<input id="met-'+i+'" value="'+escA(m)+'" style="flex:1">';

      html+='<button class="btn-red" style="padding:6px 10px" onclick="eliminarMetodo('+i+')">Eliminar</button></div>';
    });
    html+='<div style="display:flex;gap:8px;align-items:center;margin-top:12px">';
    html+='<input id="met-nuevo" placeholder="ej: Punto Banesco, Pago Móvil Mercantil" style="flex:1">';
    html+='<button class="btn-green" style="padding:6px 12px" onclick="agregarMetodo()">+ Agregar</button></div>';
    html+='</div>';
    html+='<div style="background:#fff;padding:20px;border-radius:12px;max-width:620px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-top:20px">';
    html+='<div class="section-title" style="font-size:15px;margin-top:0">Número de control de los pagos</div>';
    html+='<p style="font-size:12px;color:#8893a5;margin-top:0">Cada pago recibe un número correlativo automático que aparece en el recibo, en la caja y en el arqueo. Aquí puedes indicar con qué número debe continuar el próximo pago (por ejemplo, para seguir tu talonario).</p>';
    html+='<p style="font-size:12px;color:#55637a;margin:4px 0 10px">El próximo pago usará el número: <b>'+fmtControl(peekControl())+'</b></p>';
    html+='<div style="display:flex;gap:8px;align-items:center">';
    html+='<input id="prox-control" type="number" min="1" value="'+peekControl()+'" style="flex:1">';
    html+='<button class="btn-green" style="padding:6px 12px" onclick="guardarProxControl()">Guardar</button></div>';
    html+='</div>';
  }
  return html;
}

/* ====== INICIO (con sincronización en la nube) ====== */
function hayFormularioActivo(){
  const a = document.activeElement;
  if(a){ const t=(a.tagName||'').toLowerCase(); if(t==='input'||t==='textarea'||t==='select') return true; }
  const mb = document.getElementById('modal-bg');
  if(mb && mb.style.display==='flex') return true;
  return false;
}

function startPolling(){
  if(!CLOUD.enabled) return;
  setInterval(async ()=>{
    try{
      const antes = {};
      SYNC_KEYS.forEach(k=> antes[k]=localStorage.getItem('hotel_'+k));
      await CLOUD.pullAll();
      let cambio=false;
      SYNC_KEYS.forEach(k=>{ if(antes[k]!==localStorage.getItem('hotel_'+k)) cambio=true; });
      if(cambio && !hayFormularioActivo()){
        aplicarTema(); pintarMarca();
        if(session()) render();
      }
    }catch(e){ /* sin conexión: seguimos con los datos del equipo */ }
  }, 6000);
}

async function bootstrap(){
  try{ await CLOUD.pullAll(); }catch(e){ /* sin conexión al iniciar: usamos datos del equipo */ }
  seed();                 // completa cajas que falten (sin pisar lo que ya hay)
  CLOUD.ready = true;
  try{ await CLOUD.pushMissing(); }catch(e){}  // primer equipo: sube lo que la nube aún no tiene
  aplicarTema(); pintarMarca(); openApp();
  startPolling();
}
bootstrap();
</script>
