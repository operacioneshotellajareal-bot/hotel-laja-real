<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión Hotel · 65 Habitaciones</title>
<!-- ===== App instalable (PWA) ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hotel Laja Real">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--azul:#0d3b66;--azul2:#1b6ca8;--verde:#2e9e5b;--rojo:#d64045;--naranja:#e8871e;--gris:#7a8699;--morado:#6a4c93;--bg:#eef1f6;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:var(--bg);color:#1c2430;min-height:100vh;}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:600;padding:10px 16px;transition:.15s;}
button:active{transform:scale(.97);}
.btn-primary{background:var(--azul2);color:#fff;}
.btn-primary:hover{background:var(--azul);}
.btn-ghost{background:#e3e8f0;color:#2c3a4f;}
.btn-cancelar{background:#fde8e8;color:#b3261e;border:1.5px solid #f2b8b5;font-weight:700;}
.btn-green{background:var(--verde);color:#fff;}
.btn-red{background:var(--rojo);color:#fff;}
.btn-orange{background:var(--naranja);color:#fff;}
.btn-gray{background:var(--gris);color:#fff;}
input,select,textarea{width:100%;padding:11px;border:1px solid #c7d0dd;border-radius:8px;font-size:15px;margin-top:4px;font-family:inherit;box-sizing:border-box;}
textarea{resize:vertical;}
label{font-size:13px;font-weight:600;color:#44526a;}
/* LOGIN */
#view-login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--card);width:360px;max-width:100%;padding:34px;border-radius:16px;box-shadow:0 10px 40px rgba(13,59,102,.15);}
.login-card h1{font-size:22px;color:var(--azul);text-align:center;margin-bottom:4px;}
.login-card p.sub{text-align:center;color:#8893a5;font-size:13px;margin-bottom:22px;}
.login-card .field{margin-bottom:14px;}
.login-card button{width:100%;margin-top:8px;padding:12px;}
.login-err{color:var(--rojo);font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.hint{margin-top:18px;font-size:11.5px;color:#9aa4b4;text-align:center;line-height:1.6;}
/* TOPBAR */
#view-app{display:none;}
.topbar{background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.12);}
.topbar .brand{font-size:17px;font-weight:700;}
.topbar .right{display:flex;align-items:center;gap:14px;font-size:13px;}
.role-badge{background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-weight:600;}
.notif-wrap{position:relative;}
.bell{background:rgba(255,255,255,.18);border:none;color:#fff;cursor:pointer;font-size:16px;line-height:1;padding:7px 11px;border-radius:20px;position:relative;}
.bell:hover{background:rgba(255,255,255,.3);}
.bell .cnt{position:absolute;top:-5px;right:-5px;background:#e53935;color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px var(--azul);}
.notif-panel{position:absolute;top:46px;right:0;width:330px;max-width:88vw;max-height:72vh;overflow:auto;background:#fff;color:#1c2430;border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.28);z-index:60;padding:8px;}
.notif-head{font-weight:700;font-size:14px;padding:8px 8px 4px;color:#0d3b66;}
.notif-item{border-radius:11px;padding:11px 13px;margin:7px 4px;border:1px solid;}
.notif-item .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.notif-item .d{font-size:12.5px;margin-top:4px;line-height:1.45;}
.notif-item .a{margin-top:9px;}
.notif-empty{padding:22px 10px;text-align:center;color:#8893a5;font-size:13px;}
.content{max-width:1150px;margin:0 auto;padding:20px;}
.section-title{font-size:19px;color:var(--azul);margin:6px 0 14px;font-weight:700;}
/* STATS */
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
.stat{flex:1;min-width:120px;background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:5px solid var(--gris);}
.stat .n{font-size:26px;font-weight:800;}
.stat .l{font-size:12px;color:#7a8699;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
/* ROOM GRID */
.floor{margin-bottom:22px;}
.floor h3{font-size:14px;color:#55637a;margin-bottom:10px;font-weight:700;}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
.room{border-radius:12px;padding:12px 8px;text-align:center;color:#fff;cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.12);transition:.15s;}
.room:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.2);}
.room .num{font-size:19px;font-weight:800;}
.room .st{font-size:10.5px;font-weight:600;opacity:.95;margin-top:3px;text-transform:uppercase;letter-spacing:.3px;}
.room .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.85);}
.room .badge-pago{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#ffd400;color:#7a2e00;font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap;border:1px solid #d9a400;}
@keyframes pulsoPago{0%,100%{box-shadow:0 1px 4px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 4px rgba(255,212,0,.45)}}
.room .badge-pago.urgente{background:#e23b3b;color:#fff;border-color:#b02525;animation:pulsoPago 1.1s infinite;}
.e-libre{background:var(--verde);}
.e-ocupada{background:var(--rojo);}
.e-sucia{background:var(--naranja);}
.e-limpieza{background:var(--azul2);}
.e-mantenimiento{background:var(--gris);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-size:12.5px;}
.legend span{display:flex;align-items:center;gap:6px;color:#55637a;font-weight:600;}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;}
/* LIST */
.task-list{display:flex;flex-direction:column;gap:10px;}
.task{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.05);gap:12px;flex-wrap:wrap;}
.task .info{flex:1;min-width:180px;}
.task .info b{font-size:16px;color:var(--azul);}
.task .info .meta{font-size:12.5px;color:#7a8699;margin-top:3px;}
.task .acts{display:flex;gap:8px;flex-wrap:wrap;}
.empty{text-align:center;color:#9aa4b4;padding:40px;font-size:15px;}
.empty-guia{text-align:center;padding:34px 20px;color:#66748c;font-size:14px;background:#fbfcfe;border:1px dashed #dde5f0;border-radius:14px;}
.empty-guia .ico{font-size:34px;display:block;margin-bottom:10px;opacity:.85}
.empty-guia .t{font-size:15px;font-weight:700;color:#44526a;margin-bottom:4px}
.empty-guia .s{font-size:13px;color:#8893a5;max-width:420px;margin:0 auto 12px}
/* Tabs con aviso de desborde lateral */
.tabs-wrap{position:relative;margin-bottom:18px;}
.tabs-wrap::after{content:'';position:absolute;top:0;right:0;width:38px;height:100%;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(to right,rgba(244,246,250,0),var(--bg));}
.tabs-wrap.mas::after{opacity:1;}
.tabs-wrap.izq::before{content:'';position:absolute;top:0;left:0;width:38px;height:100%;pointer-events:none;opacity:0;transition:opacity .2s;z-index:2;background:linear-gradient(to left,rgba(244,246,250,0),var(--bg));}
.tabs-wrap.izq::before{opacity:1;}
.tabs{scroll-behavior:smooth;}
/* ---- Chat: lista de contactos ---- */
.ct-sel{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:12px 14px;margin-bottom:14px}
.ct-search{width:100%;padding:10px 13px;border-radius:10px;border:1.5px solid #dbe3ef;font-size:14px;margin-bottom:10px;box-sizing:border-box}
.ct-grid{display:flex;gap:8px;flex-wrap:wrap;max-height:200px;overflow-y:auto}
.ct-item{display:flex;align-items:center;gap:9px;background:#f3f6fb;border:1.5px solid transparent;border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;color:#2c3a4f}
.ct-item:hover{background:#e8eef8}
.ct-item.act{background:var(--azul);color:#fff}
.ct-item .ct-badge{display:none;min-width:19px;height:19px;border-radius:10px;background:var(--rojo);color:#fff;font-size:11px;line-height:19px;text-align:center;font-weight:700;padding:0 5px}
.ct-item.act .ct-badge{background:#fff;color:var(--azul)}
.ct-vacio{color:#8893a5;font-size:13px;padding:6px 0}
/* Botón flotante subir arriba */
#btn-subir{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;background:var(--azul);color:#fff;border:none;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(13,59,102,.35);z-index:40;display:none;align-items:center;justify-content:center;}
#btn-subir.ver{display:flex;}
/* Chip pequeño de estado de guardado */
#guardado-chip{position:fixed;left:18px;bottom:18px;background:#fff;border:1px solid #e4e9f2;color:#55637a;border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.10);z-index:40;display:none;align-items:center;gap:6px;}
#guardado-chip.ver{display:inline-flex;}
#guardado-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--verde);}
#guardado-chip.busy .dot{background:var(--naranja);animation:gpulse 1s infinite;}
@keyframes gpulse{0%,100%{opacity:1}50%{opacity:.35}}
.prio{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;}
.prio-alta{background:#fde2e2;color:#c0392b;}
.prio-media{background:#fff3d6;color:#b8791a;}
.prio-baja{background:#e2f0e4;color:#2e7d46;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(13,30,55,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:16px;width:420px;max-width:100%;padding:24px;max-height:90vh;overflow:auto;}
.modal h2{font-size:19px;color:var(--azul);margin-bottom:4px;}
.modal .rstate{font-size:13px;font-weight:600;margin-bottom:16px;}
.modal .field{margin-bottom:12px;}
.modal .actions{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.modal .close{float:right;background:none;color:#8893a5;font-size:22px;padding:0;margin-top:-8px;}
.divider{height:1px;background:#eef1f6;margin:14px 0;}
/* ADMIN users */
.users-table{width:100%;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);border-collapse:collapse;}
.users-table th{background:#f3f6fb;text-align:left;padding:11px 14px;font-size:12.5px;color:#55637a;}
.users-table td{padding:11px 14px;border-top:1px solid #eef1f6;font-size:14px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab{background:#e3e8f0;color:#2c3a4f;padding:9px 16px;border-radius:20px;font-weight:600;font-size:13.5px;cursor:pointer;}
.tab.active{background:var(--azul);color:#fff;}
@media(max-width:600px){
  .content{padding:14px;}
  .section-title{font-size:17px;}
  .topbar{padding:10px 14px;}
  .topbar .brand{font-size:15px;}
  .topbar .right{gap:8px;font-size:12px;}
  .role-badge{padding:4px 9px;}
  .stats{gap:8px;}
  .stat{min-width:calc(50% - 4px);padding:11px 12px;}
  .stat .n{font-size:21px;}
  .rooms{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:5px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  #btn-subir{bottom:14px;right:14px;width:44px;height:44px;}
  .tab{flex:0 0 auto;white-space:nowrap;padding:8px 13px;font-size:13px;}
  .users-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;}
  .modal{padding:18px;}
}
/* ====== MAQUILLAJE VISTA v2 (solo estilo, no cambia funciones) ====== */
:root{--oro:#c8a44d;--sombra:0 12px 32px rgba(13,59,102,.14);--sombra2:0 20px 48px rgba(13,59,102,.22);}
body{background:linear-gradient(135deg,#dfe8f5 0%,#eef2f9 40%,#e4ecf8 100%);background-attachment:fixed;}
.content{max-width:1180px;}
.topbar{background:linear-gradient(100deg,#0a2f52 0%,#0d3b66 40%,#1b6ca8 100%);box-shadow:0 6px 22px rgba(13,59,102,.35);border-bottom:2px solid rgba(255,255,255,.08);}
.topbar .brand{letter-spacing:.4px;font-size:18px;}
.role-badge{background:rgba(255,255,255,.22);backdrop-filter:saturate(1.3);}
.section-title{display:flex;align-items:center;gap:12px;font-size:22px;letter-spacing:.3px;margin:10px 0 18px;}
.section-title::before{content:'';width:6px;height:26px;border-radius:5px;background:linear-gradient(180deg,var(--oro),#9c7f38);display:inline-block;box-shadow:0 2px 6px rgba(200,164,77,.4);}
.stats{gap:16px;margin-bottom:26px;}
.stat{border-radius:18px;padding:20px 20px;background:linear-gradient(180deg,#ffffff 0%,#eef4fc 100%);box-shadow:var(--sombra);border-left:6px solid var(--azul2);transition:transform .2s ease,box-shadow .2s ease;overflow:hidden;position:relative;}
.stat::after{content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(27,108,168,.10),transparent 70%);}
.stat:hover{transform:translateY(-6px);box-shadow:var(--sombra2);}
.stat .n{font-size:32px;background:linear-gradient(90deg,#0d3b66,#1b6ca8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.stat .l{letter-spacing:.8px;}
.rooms{gap:12px;}
.room{border-radius:16px;padding:14px 8px;box-shadow:0 5px 14px rgba(0,0,0,.16);transition:transform .2s ease,box-shadow .2s ease;}
.room:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 16px 30px rgba(0,0,0,.28);z-index:5;}
.room .num{font-size:21px;}
.task{border-radius:18px;padding:16px 18px;box-shadow:var(--sombra);border:1px solid #e9eff8;transition:transform .18s ease,box-shadow .18s ease;}
.task:hover{transform:translateY(-4px);box-shadow:var(--sombra2);}
.task .info b{font-size:17px;letter-spacing:.2px;}
.tab{border-radius:24px;padding:9px 18px;transition:all .18s ease;box-shadow:0 2px 6px rgba(13,59,102,.06);font-weight:600;}
.tab:hover{background:#d2dced;transform:translateY(-1px);}
.tab.active{background:linear-gradient(90deg,#0d3b66,#1b6ca8);color:#fff;box-shadow:0 8px 18px rgba(13,59,102,.32);}
button{transition:transform .12s ease,box-shadow .16s ease,background .16s ease,filter .16s ease;}
.btn-primary{background:linear-gradient(95deg,#1b6ca8,#15548f);box-shadow:0 6px 16px rgba(21,84,143,.32);}
.btn-primary:hover{background:linear-gradient(95deg,#15548f,#0d3b66);transform:translateY(-2px);box-shadow:0 10px 22px rgba(13,59,102,.4);}
.btn-green{box-shadow:0 6px 16px rgba(46,158,91,.3);}
.btn-red{box-shadow:0 6px 16px rgba(214,64,69,.28);}
.btn-orange{box-shadow:0 6px 16px rgba(232,135,30,.28);}
.btn-green:hover,.btn-red:hover,.btn-orange:hover,.btn-gray:hover{transform:translateY(-2px);filter:brightness(1.07);}
.login-card{border-radius:22px;box-shadow:0 24px 60px rgba(13,59,102,.25);border:1px solid rgba(255,255,255,.6);}
/* ====== MARCA DEL HOTEL: colores que cambian con el tema ====== */
:root{--fondo:#eef1f6;--topbarA:#0a2f52;--topbarB:#0d3b66;}
body{background:var(--fondo) !important;background-attachment:fixed;}
.topbar{background:linear-gradient(100deg,var(--topbarA) 0%,var(--topbarB) 45%,var(--azul2) 100%) !important;}
.section-title::before{background:linear-gradient(180deg,var(--oro),var(--azul)) !important;}
.stat .n{background:linear-gradient(90deg,var(--azul),var(--azul2)) !important;-webkit-background-clip:text !important;background-clip:text !important;}
.tab.active{background:linear-gradient(90deg,var(--azul),var(--azul2)) !important;}
button.btn-primary,.btn-primary{background:linear-gradient(95deg,var(--azul2),var(--azul)) !important;color:#fff;}
button.btn-primary:hover,.btn-primary:hover{background:linear-gradient(95deg,var(--azul),var(--topbarA)) !important;}

.modal{border-radius:22px;box-shadow:0 28px 70px rgba(13,30,55,.4);}
input,select,textarea{border-radius:11px;transition:border-color .15s ease,box-shadow .15s ease;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1b6ca8;box-shadow:0 0 0 3px rgba(27,108,168,.18);}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="view-login">
  <div class="login-card">
    <h1 style="text-align:center">🏨</h1>
    <p class="sub">Sistema de operaciones · 65 habitaciones</p>
    <div class="field"><label>Usuario</label><input id="in-user" autocomplete="username" placeholder="ej: recepcion"></div>
    <div class="field"><label>Contraseña</label><input id="in-pass" type="password" autocomplete="current-password" placeholder="••••"></div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="login-err" id="login-err"></div>
    <div class="hint" id="login-hint"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="view-app">
  <div class="topbar">
    <div class="brand">🏨 Gestión Hotel</div>
    <div class="right">
      <button class="btn-orange" id="btn-instalar" style="display:none;padding:7px 12px;font-size:12.5px" onclick="instalarApp()">⬇️ Instalar app</button>
      <button class="bell" id="btn-chat" title="Chat interno" onclick="abrirChat()" style="display:none">💬<span class="cnt" id="chat-count" style="display:none">0</span></button>
      <div class="notif-wrap" id="notif-wrap" style="display:none">
        <button class="bell" id="btn-notif" title="Notificaciones" onclick="toggleNotif(event)">🔔<span class="cnt" id="notif-count" style="display:none">0</span></button>
        <div class="notif-panel" id="notif-panel" style="display:none" onclick="event.stopPropagation()"></div>
      </div>
      <span id="who"></span>
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-ghost" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- Botón flotante: subir arriba -->
<button id="btn-subir" title="Subir arriba" aria-label="Subir arriba" onclick="subirArriba()">⬆️</button>
<!-- Chip: estado de guardado en la nube -->
<div id="guardado-chip"><span class="dot"></span><span id="guardado-txt">Guardado</span></div>

<!-- ===== MODAL ===== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ====== CONEXIÓN A LA NUBE (Supabase) ====== */
const SB_URL = 'https://wazhhzbwmzitqlgoxjuf.supabase.co';
const SB_KEY = 'sb_publishable_PJfzZshU0tA9FigMiysl1Q_1wMFjKHJ';
/* Cuenta con la que la app "entra" a la nube (seguridad nivel suficiente).
   Debes crear ESTE MISMO usuario en Supabase (Authentication). */
const SB_APP_EMAIL = 'operador@hotellajareal.com';
const SB_APP_PASS  = 'LajaReal2026-Caja';
/* Cajas de datos que se comparten entre todos los equipos.
   OJO: 'session' NO se comparte (cada equipo inicia sesión aparte). */
const SYNC_KEYS = ['rooms','users','clientes','pagos','reportes','turnos','kardex','tasa','hotel','metodosPago','pagoControl','tiposHab','preciosTipo','permisos','presencia','impresion','reservas','promos','forzarCierre','enviosAdmin','chat','chatLeidos','cxc','restaurantes','turnosRecepcion','comidasPrecios'];

/* ====== ALMACENAMIENTO (local + nube) ====== */
/* ====== COLA DE SINCRONIZACION OFFLINE ======
   Lista de cajas con cambios locales que aun NO se han confirmado en la nube.
   Se guarda solo en este equipo y NUNCA se sube (no esta en SYNC_KEYS). Si se
   cae el internet, lo que guardes queda aqui en espera y se sube solo al
   reconectar, sin que la nube lo pise. */
function _pendGet(){ try{ return JSON.parse(localStorage.getItem('hotel__colaSync')||'[]'); }catch(e){ return []; } }
function _pendSet(a){ try{ localStorage.setItem('hotel__colaSync', JSON.stringify(a)); }catch(e){} }
function _pendAdd(k){ const a=_pendGet(); if(a.indexOf(k)<0){ a.push(k); _pendSet(a); } }
function _pendDel(k){ _pendSet(_pendGet().filter(x=>x!==k)); }
function _pendHas(k){ return _pendGet().indexOf(k)>=0; }
function colaPendientes(){ return _pendGet().length; }

const DB = {
  get(k, def){ try{ const v = localStorage.getItem('hotel_'+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k, val){
    localStorage.setItem('hotel_'+k, JSON.stringify(val));
    try{ if(typeof CLOUD!=='undefined' && CLOUD.enabled && CLOUD.ready && SYNC_KEYS.includes(k)) mostrarGuardando(); }catch(e){}
    try{
      if(typeof CLOUD!=='undefined' && CLOUD.enabled && CLOUD.ready && SYNC_KEYS.includes(k)){
        _pendAdd(k);            /* anota el pendiente ANTES de intentar subir */
        CLOUD.flushQueue();     /* intenta subir la cola; quita lo que logre */
      }
    }catch(e){}
  }
};

const CLOUD = {
  ready:false,
  enabled: !!(SB_URL && SB_KEY),
  _cloudKeys:[], _lastSync:(function(){try{return localStorage.getItem('hotel__lastSync')||'';}catch(e){return '';}})(), _flushing:false,
  _token:null, _refresh:null, _exp:0,
  _authEnabled: !!(SB_APP_EMAIL && SB_APP_PASS),
  _h(extra){ const auth = this._token ? ('Bearer '+this._token) : ('Bearer '+SB_KEY); return Object.assign({'apikey':SB_KEY,'Authorization':auth,'Content-Type':'application/json'}, extra||{}); },
  async signIn(){
    if(!this._authEnabled) return;
    try{
      const r = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body: JSON.stringify({email:SB_APP_EMAIL, password:SB_APP_PASS})});
      if(!r.ok) throw new Error('signin '+r.status);
      const d = await r.json();
      this._token=d.access_token; this._refresh=d.refresh_token; this._exp=Date.now()+((d.expires_in||3600)*1000);
    }catch(e){ this._token=null; this._refresh=null; this._exp=0; }
  },
  async _refreshTok(){
    if(!this._authEnabled || !this._refresh){ return this.signIn(); }
    try{
      const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body: JSON.stringify({refresh_token:this._refresh})});
      if(!r.ok) throw new Error('refresh '+r.status);
      const d = await r.json();
      this._token=d.access_token; this._refresh=d.refresh_token; this._exp=Date.now()+((d.expires_in||3600)*1000);
    }catch(e){ await this.signIn(); }
  },
  async ensureAuth(){
    if(!this._authEnabled) return;
    if(!this._token){ await this.signIn(); return; }
    if(Date.now() > (this._exp - 60000)){ await this._refreshTok(); }
  },
  async pullAll(){
    if(!this.enabled) return;
    await this.ensureAuth();
    /* Descarga incremental: la primera vez baja todo; luego solo lo que cambio
       desde la ultima vez (con una ventana de 60s de solape por si los relojes
       de los equipos no coinciden). Asi el 'egress' baja muchisimo pero la
       comunicacion entre equipos sigue siendo al instante. */
    let url = SB_URL+'/rest/v1/estado_app?select=clave,valor,actualizado';
    if(this._lastSync){
      let desde = this._lastSync;
      try{ desde = new Date(new Date(this._lastSync).getTime() - 60000).toISOString(); }catch(e){}
      url += '&actualizado=gt.'+encodeURIComponent(desde);
    }
    let r = await fetch(url, {headers:this._h()});
    if(r.status===401 && this._authEnabled){ await this.signIn(); r = await fetch(url, {headers:this._h()}); }
    if(!r.ok) throw new Error('pull '+r.status);
    const rows = await r.json();
    rows.forEach(x=>{ if(this._cloudKeys.indexOf(x.clave)<0) this._cloudKeys.push(x.clave); });
    /* NO pisar las cajas que estan en la cola (cambios locales sin subir):
       asi lo que hiciste sin internet manda hasta que se confirme en la nube. */
    rows.forEach(row=>{ if(SYNC_KEYS.includes(row.clave) && !_pendHas(row.clave)){ localStorage.setItem('hotel_'+row.clave, JSON.stringify(row.valor)); } });
    let _ls = this._lastSync;
    rows.forEach(row=>{ if(row.actualizado && (!_ls || row.actualizado > _ls)) _ls = row.actualizado; });
    if(_ls && _ls !== this._lastSync){ this._lastSync = _ls; try{ localStorage.setItem('hotel__lastSync', _ls); }catch(e){} }
  },
  async push(k, val){
    if(!this.enabled || !this.ready) return false;
    if(!SYNC_KEYS.includes(k)) return false;
    try{
      await this.ensureAuth();
      const body = JSON.stringify({clave:k, valor:val, actualizado:new Date().toISOString()});
      let r = await fetch(SB_URL+'/rest/v1/estado_app?on_conflict=clave', {method:'POST', headers:this._h({'Prefer':'resolution=merge-duplicates'}), body});
      if(r.status===401 && this._authEnabled){ await this.signIn(); r = await fetch(SB_URL+'/rest/v1/estado_app?on_conflict=clave', {method:'POST', headers:this._h({'Prefer':'resolution=merge-duplicates'}), body}); }
      if(!r.ok) throw new Error('push '+r.status);
      try{ mostrarGuardado(); }catch(e){}
      return true;
    }catch(e){ /* sin conexion: queda en la cola y se subira al reconectar */ return false; }
  },
  async flushQueue(){
    if(!this.enabled || !this.ready) return;
    /* Si ya hay un envio en curso, no lanzamos otro: dejamos pedido que vuelva
       a correr al terminar, para no perder cambios hechos mientras subia. */
    if(this._flushing){ this._flushAgain = true; return; }
    this._flushing = true;
    try{
      let seguir = true;
      do{
        this._flushAgain = false;
        const pend = _pendGet();
        for(const k of pend){
          if(!SYNC_KEYS.includes(k)){ _pendDel(k); continue; }
          /* Tomamos una FOTO exacta (texto) de lo que vamos a subir. */
          const raw = localStorage.getItem('hotel_'+k);
          let v; try{ v = raw!=null?JSON.parse(raw):null; }catch(e){ v = null; }
          const ok = await this.push(k, (v===undefined?null:v));
          if(ok){
            /* Solo damos por subida la caja si NO cambio mientras subia. Si
               cambio (p. ej. un check-out de varias habitaciones que guarda
               cuarto por cuarto), la dejamos pendiente y la volvemos a subir,
               para que la nube termine con la version final y pullAll no la
               pise con una version vieja. */
            if(localStorage.getItem('hotel_'+k) === raw){ _pendDel(k); }
            else { this._flushAgain = true; }
          } else {
            /* Sin conexion: paramos y reintentamos luego (queda en la cola). */
            this._flushAgain = false; seguir = false; break;
          }
        }
        if(!seguir) break;
      } while(this._flushAgain);
    }catch(e){}
    this._flushing = false;
  },
  async pushMissing(){
    if(!this.enabled) return;
    await this.ensureAuth();
    for(const k of SYNC_KEYS){
      const local = DB.get(k);
      if(local!==undefined && local!==null && !this._cloudKeys.includes(k)){ await this.push(k, local); }
    }
  },
  async clearAll(){
    if(!this.enabled) return;
    await this.ensureAuth();
    let r = await fetch(SB_URL+'/rest/v1/estado_app?clave=not.is.null', {method:'DELETE', headers:this._h()});
    if(r.status===401 && this._authEnabled){ await this.signIn(); r = await fetch(SB_URL+'/rest/v1/estado_app?clave=not.is.null', {method:'DELETE', headers:this._h()}); }
    this._cloudKeys=[];
  }
};

/* ====== SESIÓN / LOGIN ====== */
async function login(){
  const u = document.getElementById('in-user').value.trim().toLowerCase();
  const p = document.getElementById('in-pass').value;
  const found = DB.get('users',[]).find(x=>x.user===u && x.pass===p);
  if(!found){ document.getElementById('login-err').innerText='Usuario o contraseña incorrectos'; return; }
  // Traer el estado más reciente de la nube para saber quién está conectado
  try{ if(typeof CLOUD!=='undefined' && CLOUD.enabled){ await CLOUD.pullAll(); } }catch(e){}
  if(usuarioYaConectado(u)){ document.getElementById('login-err').innerText='Este usuario ya tiene una sesión abierta en otro equipo. Cierra la sesión allí o espera un momento e inténtalo de nuevo.'; return; }
  DB.set('session', Object.assign({}, found, {loginTs:Date.now()}));
  document.getElementById('login-err').innerText='';
  document.getElementById('in-pass').value='';
  presenciaLatido();
  openApp();
}
function logout(){
  const act = turnoActivo();
  const s = session();
  if(act && s && act.usuario===s.user){
    if(confirm('Tienes tu TURNO ABIERTO.\n\nAceptar = cerrar el turno y salir\nCancelar = salir sin cerrarlo (seguirá abierto)')){
      const t=turnos(); const a=t.find(x=>x.abierto); if(a){ a.fin=new Date().toISOString(); a.abierto=false; saveTurnos(t); }
    }
  }
  try{ presenciaSalir(); }catch(e){}
  localStorage.removeItem('hotel_session'); location.reload();
}
function session(){ return DB.get('session', null); }

/* ====== PRESENCIA: quién está conectado ====== */
function deviceId(){
  let d=localStorage.getItem('hotel_deviceId');
  if(!d){ d='dev'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('hotel_deviceId', d); }
  return d;
}
function presenciaObj(){ const p=DB.get('presencia',{}); return (p&&typeof p==='object'&&!Array.isArray(p))?p:{}; }
function presenciaActivos(maxMs){
  maxMs=maxMs||40000; const now=Date.now(); const o=presenciaObj(); const out=[];
  Object.keys(o).forEach(k=>{ const e=o[k]; if(e&&e.ts&&(now-e.ts)<maxMs) out.push(e); });
  return out;
}
function presenciaLatido(){
  const s=session(); if(!s) return;
  const o=presenciaObj(); const now=Date.now();
  Object.keys(o).forEach(k=>{ if(!o[k]||!o[k].ts||(now-o[k].ts)>120000) delete o[k]; });
  o[deviceId()]={ deviceId:deviceId(), user:s.user, nombre:s.nombre, rol:s.rol, ts:now };
  DB.set('presencia', o);
}
function presenciaSalir(){ const o=presenciaObj(); delete o[deviceId()]; DB.set('presencia', o); }
function usuarioYaConectado(user){
  const now=Date.now(); const o=presenciaObj(); const my=deviceId();
  return Object.keys(o).some(k=>{ const e=o[k]; return e && e.user===user && e.deviceId!==my && e.ts && (now-e.ts)<40000; });
}
/* ---- Cierre de sesiones a distancia (lo ordena el Master) ---- */
function revisarCierreForzado(){
  const s=session(); if(!s) return;
  const fc=DB.get('forzarCierre',{}); const mine=fc&&fc[deviceId()];
  if(mine && (!s.loginTs || mine>s.loginTs)){ cerrarSesionForzada(); }
}
function cerrarSesionForzada(){
  try{ presenciaSalir(); }catch(e){}
  localStorage.removeItem('hotel_session');
  alert('El administrador cerró tu sesión. Vuelve a iniciar sesión si lo necesitas.');
  location.reload();
}
function cerrarSesionRemota(dev, nombre){
  if(dev===deviceId()){ alert('Esa es tu propia sesión en este equipo. Para salir usa el botón “Salir” de arriba.'); return; }
  if(!confirm('¿Cerrar la sesión de '+(nombre||'este equipo')+'?\n\nLa persona tendrá que iniciar sesión otra vez.')) return;
  const fc=DB.get('forzarCierre',{})||{};
  const lim=Date.now()-86400000; Object.keys(fc).forEach(k=>{ if(!fc[k]||fc[k]<lim) delete fc[k]; });
  fc[dev]=Date.now(); DB.set('forzarCierre', fc);
  const o=presenciaObj(); if(o[dev]){ delete o[dev]; DB.set('presencia', o); }
  render();
  alert('Listo. La sesión se cerrará en el otro equipo en unos segundos.');
}
let _presTimer=null;
function iniciarPresencia(){
  presenciaLatido();
  if(_presTimer) clearInterval(_presTimer);
  _presTimer=setInterval(()=>{ if(session()) presenciaLatido(); }, 15000);
}

  h+='<table style="width:100%;border-collapse:collapse;font-size:13.5px">';

  h+=fila('Nueva reserva','N')+fila('Abrir turno','A')+fila('Cerrar turno','Shift + A')+fila('Buscar','/')+fila('Imprimir','Ctrl + P')+fila('Cerrar ventana','Esc')+fila('Ver estos atajos','?');
  h+='</table>';
  h+='<div style="text-align:right;margin-top:14px"><button class="btn-gray" onclick="cerrarModal()">Cerrar</button></div>';
  showModal(h);
}
document.addEventListener('keydown', function(e){
  try{
    if(!session()) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return; // dejar pasar Ctrl+P y demás
    const t=e.target; const tag=(t&&t.tagName)?t.tagName.toLowerCase():'';
    const escribiendo = tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable);
    const modalAbierto = _atajoModalAbierto();
    if(e.key==='Escape'){ if(modalAbierto) cerrarModal(); return; }
    if(!escribiendo && (e.key==='?'||(e.key==='/'&&e.shiftKey))){ e.preventDefault(); atajoAyuda(); return; }
    if(!escribiendo && e.key==='/'){ e.preventDefault(); atajoBuscar(); return; }
    if(escribiendo||modalAbierto) return; // las letras solo fuera de casillas y sin ventana abierta
    const rol=session().rol;

function ajustarTabs(){
  const wraps=document.querySelectorAll('.tabs-wrap');
  wraps.forEach(wrap=>{
    const tabs=wrap.querySelector('.tabs'); if(!tabs) return;
    const act=tabs.querySelector('.tab.active');
    if(act){
      const target = act.offsetLeft - (tabs.clientWidth/2) + (act.offsetWidth/2);
      try{ tabs.scrollLeft = Math.max(0, target); }catch(e){}
    }
    const marca=()=>{ const max=tabs.scrollWidth-tabs.clientWidth-2; wrap.classList.toggle('mas', tabs.scrollLeft < max); wrap.classList.toggle('izq', tabs.scrollLeft > 4); };
    marca();

function admControlResultado(){
  const dig=admBusqCtrl.replace(/\D/g,'');
  const n=parseInt(dig)||0;
  const docN=admBusqDoc.toLowerCase().replace(/[^a-z0-9]/g,'');
  const byCtrl=!!dig, byDoc=!!docN;
  const matchCtrl=function(c){ if(c===undefined||c===null||c==='') return false; return String(parseInt(c))===String(n); };
  const matchDoc=function(o){ const d1=String(o.clienteDoc||'').toLowerCase().replace(/[^a-z0-9]/g,''); const d2=docDeCliente(o.clienteId).toLowerCase().replace(/[^a-z0-9]/g,''); return (d1 && d1.indexOf(docN)>=0)||(d2 && d2.indexOf(docN)>=0); };
  let pagos=DB.get('pagos',[]).slice();
  if(byCtrl) pagos=pagos.filter(p=>matchCtrl(p.control));
  if(byDoc) pagos=pagos.filter(p=>matchDoc(p));
  const K=kardexAll();
  let cargos=K.filter(k=>k.tipo==='cargo'); let anul=K.filter(k=>k.tipo==='anulacion');
  if(byCtrl){ cargos=cargos.filter(k=>matchCtrl(k.control)||matchCtrl(k.controlPago)); anul=anul.filter(k=>matchCtrl(k.control)); }
  if(byDoc){ cargos=cargos.filter(k=>matchDoc(k)); anul=anul.filter(k=>matchDoc(k)); }
  let cxcList=cxc().slice();
  if(byCtrl) cxcList=cxcList.filter(e=>matchCtrl(e.control));
  if(byDoc) cxcList=cxcList.filter(e=>{ const d=String(e.docRef||'').toLowerCase().replace(/[^a-z0-9]/g,''); return !!d && d.indexOf(docN)>=0; });
  const cliIds={}, habs={}, ctrlSet={};
  pagos.forEach(p=>{ if(p.clienteId) cliIds[p.clienteId]=true; if(p.hab) habs[p.hab]=true; if(p.control) ctrlSet[parseInt(p.control)]=true; });
  cargos.forEach(k=>{ if(k.clienteId) cliIds[k.clienteId]=true; if(k.hab) habs[k.hab]=true; if(k.control) ctrlSet[parseInt(k.control)]=true; });
  cxcList.forEach(e=>{ if(e.control) ctrlSet[parseInt(e.control)]=true; });
  const clientes=Object.keys(cliIds).map(id=>clienteById(id)).filter(Boolean);
  const ctrls=Object.keys(ctrlSet).map(x=>parseInt(x)).filter(x=>!isNaN(x)).sort((a,b)=>a-b);
  let totBs=0,totUsd=0; pagos.forEach(p=>{ totBs+=Number(p.montoBs)||0; totUsd+=Number(p.montoUsd)||0; });
  const envios=(DB.get('enviosAdmin',[])||[]).filter(e=>{ try{ return ctrls.some(cn=>(e.html||'').indexOf(fmtControl(cn))>=0); }catch(_){ return false; } });
  return {byCtrl:byCtrl, byDoc:byDoc, dig:dig, n:n, doc:admBusqDoc, pagos:pagos, cargos:cargos, anul:anul, cxc:cxcList, clientes:clientes, habs:Object.keys(habs), ctrls:ctrls, totBs:totBs, totUsd:totUsd, envios:envios};
}

function notifItems(){
  const items=[];

  try{

    items.push({c:urg?'danger':'warn',icon:urg?'🔴':'💰',titulo:sin.length+' habitación(es) sin pagar',texto:'Total pendiente '+fmtUSD(tot)+'.'+(urg?' Ya pasó la hora de salida (12:00 m).':''),extra:chips,btn:'<button class="btn-green" style="padding:6px 12px" onclick="recepView=\'cobrar\';adminTab=\'cobrar\';cerrarNotif();render()">Ir a Cobrar</button>'});
  }

    if(atrasadas.length>0) t.push('Hay <b>'+atrasadas.length+'</b> reserva'+(atrasadas.length>1?'s':'')+' de días anteriores sin ingresar.');

  }
  // 3b) Lista de espera por sobreventa
  const _esp=reservasEnEspera();
  if(_esp.length>0){
    const _libE=habitacionesLibres().length;
    if(_libE>0) items.push({c:'ok',icon:'⏳',titulo:_esp.length+' huésped(es) en lista de espera',texto:'Se liberó habitación: hay <b>'+_libE+'</b> libre(s). Ya puedes asignarles una.',extra:'',btn:'<button class="btn-primary" style="padding:6px 12px" onclick="recepView=\'reservas\';adminTab=\'reservas\';cerrarNotif();render()">Ver lista de espera</button>'});

  }
  return items;

/* ===== Selector de formas de pago (permite dividir el pago en varias) ===== */

function pmRefToggle(sel, prefix){
  const linea=sel.closest('.pm-linea'); if(!linea) return;
  const ref=linea.querySelector('.'+prefix+'-pm-ref'); if(!ref) return;

}
function pmInitRefs(prefix){ document.querySelectorAll('#'+prefix+'-pm-lineas .'+prefix+'-pm-met').forEach(sel=>pmRefToggle(sel,prefix)); }
function pmReset(prefix, totalUsd){

function pmLineaUnica(prefix){ const r=document.querySelectorAll('#'+prefix+'-pm-lineas .pm-linea'); return r.length===1?r[0]:null; }
function pmMostrarQuitar(prefix){
  const row=pmLineaUnica(prefix); if(!row) return;

  const inp=row.querySelector('.'+prefix+'-pm-monto'); if(!inp){ btn.style.display='none'; return; }
  const val=parseFloat(inp.value)||0;
  const init=parseFloat(inp.getAttribute('data-init')||'')||0;
  btn.style.display=(val>0 && Math.abs(val-init)>0.009)?'inline-block':'none';
}
function pmLimpiar(prefix){
  const row=pmLineaUnica(prefix); if(!row) return;
  const inp=row.querySelector('.'+prefix+'-pm-monto'); if(inp) inp.value='';
  const ref=row.querySelector('.'+prefix+'-pm-ref'); if(ref) ref.value='';
  const sel=row.querySelector('.'+prefix+'-pm-met');
  if(sel){ sel.selectedIndex=0; pmRefToggle(sel, prefix); }
  pmRecalc(prefix);

function pmCapturado(prefix){
  try{
    const rows=Array.prototype.slice.call(document.querySelectorAll('#'+prefix+'-pm-lineas .pm-linea'));
    if(!rows.length) return false;
    // Con varias formas de pago ya hay algo escrito: se considera capturado.
    if(rows.length>1) return true;
    const row=rows[0];
    const inp=row.querySelector('.'+prefix+'-pm-monto');
    const m=parseFloat((inp||{}).value)||0;
    const init=inp?parseFloat(inp.getAttribute('data-init')||'')||0:0;
    const ref=((row.querySelector('.'+prefix+'-pm-ref')||{}).value||'').trim();
    return ref!=='' || (m>0 && Math.abs(m-init)>0.009);
  }catch(e){ return false; }
}

  else if(dif>0) f.innerHTML='Falta: <b style="color:#c0392b">'+fmtUSD(dif)+'</b>';

function pmLeer(prefix){
  const st=PM_STATE[prefix]||{total:0};
  const rows=Array.prototype.slice.call(document.querySelectorAll('#'+prefix+'-pm-lineas .pm-linea'));

  rows.forEach(row=>{ const met=row.querySelector('.'+prefix+'-pm-met').value; const mo=parseFloat(row.querySelector('.'+prefix+'-pm-monto').value)||0; const refEl=row.querySelector('.'+prefix+'-pm-ref'); const ref=refEl?(refEl.value||'').trim():''; if(mo>0) lineas.push({metodo:met, montoUsd:mo, ref:ref}); });
  if(lineas.length===0 && rows.length===1 && (st.total||0)>0){ const r0=rows[0]; const refEl=r0.querySelector('.'+prefix+'-pm-ref'); lineas.push({metodo:r0.querySelector('.'+prefix+'-pm-met').value, montoUsd:st.total, ref:refEl?(refEl.value||'').trim():''}); }
  if(lineas.length===0) return {ok:false, msg:'Indica al menos una forma de pago con su monto.'};
  const suma=lineas.reduce((s,l)=>s+l.montoUsd,0);
  if((st.total||0)>0 && Math.abs(suma-st.total)>0.01) return {ok:false, msg:'Los montos de las formas de pago ('+fmtUSD(suma)+') no coinciden con el total a cobrar ('+fmtUSD(st.total)+'). Ajusta los montos.'};

  return {ok:true, metodos:lineas, metodoStr:metodoStr, totalUsd:suma};
}

function renderTablero(){

  const rs=rooms();
  const total=rs.length||1;
  const ocup=rs.filter(r=>r.estado==='ocupada').length;
  const libres=rs.filter(r=>r.estado==='libre').length;

  h+='</div></div>';

  // 1) Llegadas
  h+=tabCard({color:'#2a4a73',icon:'🛎️',n:llegHoy.length,label:'Llegadas de hoy',
    sub: llegAtras.length>0 ? ('⚠️ '+llegAtras.length+' reserva(s) de días anteriores sin ingresar') : (llegHoy.length>0?'Reservas que entran hoy':'Sin llegadas con reserva para hoy'),

    btn: (llegHoy.length>0||llegAtras.length>0)?irBtn('reservas','Ver reservas','btn-primary'):'' });

function saldoDeHab(r){
  if(!r || r.estado!=='ocupada') return 0;
  const noches=nochesHab(r); const hosp=brutoHab(r); const d=descUsd(r);
  const cons=cargosDe(r).filter(c=>!c.pagado).reduce((s,c)=>s+Number(c.montoUsd||0),0);
  const ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce((s,a)=>s+Number(a.montoUsd||0),0);
  return Math.max(0,(hosp-d+cons)-ab);
}
function saldoHospDeHab(r){
  if(!r || r.estado!=='ocupada') return 0;
  var noches=nochesHab(r); var hosp=brutoHab(r); var d=descUsd(r);
  var ab=(Array.isArray(r.abonos)?r.abonos:[]).reduce(function(s,a){ return s+Number(a.montoUsd||0); },0);
  return Math.max(0,(hosp-d)-ab);

function waNum(tel){
  var d=String(tel||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.slice(0,2)==='58') return d;
  if(d.charAt(0)==='0') return '58'+d.slice(1);
  if(d.length===10) return '58'+d;
  return d;
}

}
function abrirMail(correo, asunto, cuerpo){

function reservasProximas(dias){
  const hoy=new Date(hoyISO()+'T00:00:00');
  const lim=new Date(hoy.getTime()); lim.setDate(lim.getDate()+(dias||0));

function nuevoLocalizador(){

  const usados = reservas().map(r=>String(r.loc||'').toUpperCase());
  let loc='';
  do{
    loc='LR-';
    for(let i=0;i<5;i++) loc+=abc.charAt(Math.floor(Math.random()*abc.length));
  }while(usados.indexOf(loc)>=0);

}

function pintarResHabs(){
  var box=document.getElementById('res-habs-box'); if(!box) return;
  var html=''; _resHabs.forEach(function(x,i){ html+=resHabFormHTML(i,x); });
  box.innerHTML=html;
  _resHabs.forEach(function(x,i){
    var s=document.getElementById('resh'+i+'-tipo'); if(s && x.tipo) s.value=x.tipo;
    var n=document.getElementById('resh'+i+'-num'); if(n && x.hab) n.value=String(x.hab);
    pintarAcomp('resh'+i, 'resh'+i+'-acomp-box', 'resh'+i+'-personas', Array.isArray(x.acompanantes)?x.acompanantes:[]);

function resHabsSync(){

function agregarEmpresaRapidaRes(){
  const nomEl=document.getElementById('res-emp-nuevo-nom'); const rifEl=document.getElementById('res-emp-nuevo-rif');
  const nom=nomEl?nomEl.value.trim():''; const rifTxt=rifEl?rifEl.value.trim():'';
  if(!nom){ alert('Escribe el nombre de la empresa.'); if(nomEl) nomEl.focus(); return; }
  if(!rifTxt){ alert('El RIF es obligatorio para registrar la empresa.'); if(rifEl) rifEl.focus(); return; }
  let dt='J', dn=rifTxt.toUpperCase().replace(/[\s]+/g,'');
  const m=/^([VEJGP])[-]?([0-9].*)$/.exec(dn); if(m){ dt=m[1]; dn=m[2]; } dn=dn.replace(/[^0-9]/g,'');
  if(!dn){ alert('El RIF debe tener números. Ejemplo: J-12345678'); if(rifEl) rifEl.focus(); return; }
  const list=clientes();
  const dup=list.find(c=>c.tipo==='empresa' && ((String(c.docNum||'').replace(/[^0-9]/g,'')===dn) || String(c.nombre||'').trim().toLowerCase()===nom.toLowerCase()));
  let emp;
  if(dup){ emp=dup; }
  else { emp={id:'c'+Date.now(), tipo:'empresa', nombre:nom, apellido:'', docTipo:dt, docNum:dn, correo:'', ocupacion:'', ciudad:'', telefono:'', direccion:'', notas:'', historial:[], creado:new Date().toISOString(), codigo:nuevoCodigoEmpresa()}; list.push(emp); saveClientes(list); }
  const inp=document.getElementById('res-empresaref'); if(inp){ inp.value=((emp.codigo||'')+(emp.nombre?(' — '+emp.nombre):'')).trim(); }
  const dl=document.getElementById('res-empresas-list'); if(dl){ dl.innerHTML=clientes().filter(c=>c.tipo==='empresa').map(x=>'<option value="'+escA(((x.codigo||'')+(x.nombre?(' — '+x.nombre):'')).trim())+'">').join(''); }
  autoLlenarEmpresaRes();
}
function buscarCedulaRes(){
  const inp=document.getElementById('res-docnum'); if(!inp) return;
  const q=normDoc(inp.value);
  const res=document.getElementById('res-docnum-res');
  if(!q){ if(res) res.innerHTML=''; return; }
  const list=clientes().filter(c=>c.tipo!=='empresa' && normDoc(c.docNum).includes(q));
  if(list.length===0){
    if(q.length>=5 && inp.dataset && inp.dataset.auto==='1'){ const n=document.getElementById('res-nombre'); const a=document.getElementById('res-apellido'); if(n)n.value=''; if(a)a.value=''; inp.dataset.auto='0'; }
    if(res) res.innerHTML='<span style="color:#b5651d">No está registrado aún. Si es nuevo, se guardará al crear la reserva.</span>';
    return;
  }
  const c=list.find(x=>normDoc(x.docNum)===q)||list[0];
  const n=document.getElementById('res-nombre'); const a=document.getElementById('res-apellido'); const dt=document.getElementById('res-doctipo');
  if(n) n.value=(c.nombre||''); if(a) a.value=(c.apellido||''); if(dt&&c.docTipo) dt.value=c.docTipo;
  if(list.length===1 && c.docNum && normDoc(c.docNum)!==q){ inp.value=c.docNum; }
  const er=document.getElementById('res-empresaref'); if(er && (c.empresaRef||'').trim()){ er.value=c.empresaRef; autoLlenarEmpresaRes(); }
  inp.dataset.auto='1';
  const nom=((c.nombre||'')+' '+(c.apellido||'')).trim();
  if(res){ res.innerHTML = (list.length>1)
    ? '<span style="color:var(--verde)">✓ '+esc(nom)+'</span> <span style="color:#8893a5">y '+(list.length-1)+' más parecidos · escribe la cédula completa</span>'
    : '<span style="color:var(--verde)">✓ Cliente encontrado: '+esc(nom)+' ('+docLabel(c.docTipo)+' '+esc(c.docNum)+')</span>'; }
}
function guardarReserva(loc){
  const tipoReserva=(document.getElementById('res-tiporeserva')||{}).value||'persona';
  const nombre=document.getElementById('res-nombre').value.trim();
  const docNum=document.getElementById('res-docnum').value.trim();
  const entrada=document.getElementById('res-entrada').value;
  const salida=document.getElementById('res-salida').value;
  const empRaw=document.getElementById('res-empresaref').value.trim();
  const emp=empRaw?empresaPorRef(empRaw):null;
  const empRef=emp?((emp.codigo||emp.nombre||empRaw)):empRaw;
  if(tipoReserva==='empresa'){
    if(!empRaw){ alert('Elige o escribe la empresa a la que va la reserva.'); return; }
  } else {
    if(!nombre){ alert('Escribe el nombre del huésped.'); return; }
    if(!docNum){ alert('Escribe la cédula o pasaporte del huésped. Así al llegar lo registramos automáticamente.'); return; }
  }
  if(!entrada || !salida){ alert('Elige la fecha de llegada y la de salida.'); return; }
  if(diffNoches(entrada,salida)<1 || new Date(salida)<=new Date(entrada)){ alert('La fecha de salida debe ser después de la de llegada.'); return; }
  resHabsSync();
  var _habs=_resHabs.map(function(x){ return {tipo:x.tipo||'', hab:(x.hab!=null?String(x.hab):''), tarifa:Number(x.tarifa)||0, personas:parseInt(x.personas)||1, ninos:parseInt(x.ninos)||0, acompanantes:Array.isArray(x.acompanantes)?x.acompanantes:[]}; });
  if(!_habs.length) _habs=[{tipo:'',hab:'',tarifa:0,personas:1,ninos:0,acompanantes:[]}];
  var _h0=_habs[0];
  const datos={
    canal:document.getElementById('res-canal').value,
    comisionBooking:(document.getElementById('res-canal').value==='booking')?(parseFloat((document.getElementById('res-comision')||{}).value)||15):0,
    tipoReserva:tipoReserva,
    nombre:nombre,
    apellido:document.getElementById('res-apellido').value.trim(),
    docTipo:document.getElementById('res-doctipo').value,
    docNum:docNum,
    telefono:document.getElementById('res-telefono').value.trim(),
    correo:document.getElementById('res-correo').value.trim(),
    empresaRef:empRef,
    fechaEntrada:entrada,
    fechaSalida:salida,
    noches:diffNoches(entrada,salida),
    habs:_habs,
    tipoPreferido:_h0.tipo||'',
    habPref:_h0.hab||'',
    personas:_h0.personas||1,
    ninos:_h0.ninos||0,
    acompanantes:_h0.acompanantes||[],
    tarifa:_h0.tarifa||0,
    notas:document.getElementById('res-notas').value.trim(),
    plan:(document.getElementById('res-plan')||{}).value||'solo',
    planRest:collectMealRests('res')
  };
  const list=reservas();
  if(loc){
    const r=list.find(x=>x.loc===loc); if(!r){ alert('No se encontró la reserva.'); return; }
    Object.assign(r, datos);
    saveReservas(list); cerrarModal(); render();
    alert('Reserva '+loc+' actualizada.');
  } else {
    const nuevaLoc=nuevoLocalizador();
    list.push(Object.assign({loc:nuevaLoc, estado:'pendiente', hab:'', creado:new Date().toISOString()}, datos));
    saveReservas(list); cerrarModal(); render();
    const _rc=reservas().find(x=>x.loc===nuevaLoc)||Object.assign({loc:nuevaLoc}, datos);
    modalEnvio({ titulo:'✅ Reserva creada', sub:'Número localizador: <b style="font-family:monospace;font-size:16px;color:var(--azul)">'+esc(nuevaLoc)+'</b><br>Puedes enviarlo al huésped ahora mismo:', tel:datos.telefono, correo:datos.correo, asunto:'Tu reserva en '+nombreHotelMsg()+' · '+nuevaLoc, mensaje:msgReservaTxt(_rc) });
  }
}

  const list=clientes();

function agregarHabsMulti(main){

  const errores=[]; let agregadas=0;
  tokens.forEach(function(tk){
    const n=parseInt(tk,10); if(!n){ return; }
    if(n===main){ errores.push('Hab. '+n+': es la habitación principal del check-in.'); return; }
    if(document.querySelector('.m-extra[value="'+n+'"]')){ errores.push('Hab. '+n+': ya la agregaste.'); return; }

    lista.insertAdjacentHTML('beforeend', _cardHabMulti(r, main));
    agregadas++;
  });

/* ---- Cálculo automático y desglose USD/Bs ---- */
function desgloseBox(tarifa, noches, id, pct){
  pct = Math.max(0,Math.min(100,Number(pct||0)));
  const bruto = Number(tarifa||0)*(noches||1);
  const d = bruto*pct/100;
  const totUsd = bruto - d;
  return '<div style="background:#f3f6fb;border-radius:10px;padding:14px;margin-top:4px">'+
    '<div style="display:flex;justify-content:space-between;font-size:13px;color:#55637a;margin-bottom:6px"><span>Tarifa × noches</span><span id="d-'+id+'-line">'+fmtUSD(tarifa)+' × '+(noches||1)+'</span></div>'+
    '<div id="d-'+id+'-descrow" style="display:'+(d>0.009?'flex':'none')+';justify-content:space-between;font-size:13px;color:var(--verde);font-weight:700;margin-bottom:6px"><span id="d-'+id+'-desclbl">Descuento '+pct+'%</span><span id="d-'+id+'-desc">- '+fmtUSD(d)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-weight:800;color:var(--azul);font-size:16px"><span>Total USD</span><span id="d-'+id+'-usd">'+fmtUSD(totUsd)+'</span></div>'+
    '<div style="display:flex;justify-content:space-between;font-weight:800;color:#111;font-size:16px;margin-top:4px"><span>Total Bs</span><span id="d-'+id+'-bs">'+fmtBs(precioBs(totUsd))+'</span></div>'+
    '<div style="text-align:right;font-size:11px;color:#8893a5;margin-top:6px">Tasa: '+fmtBs(tasa())+' / $1</div></div>';
}
function pintarDesglose(id, tarifa, noches, pct){
  pct = Math.max(0,Math.min(100,Number(pct||0)));
  const bruto = Number(tarifa||0)*(noches||1);
  const d = bruto*pct/100;
  const tot = bruto - d;
  document.getElementById('d-'+id+'-line').innerText = fmtUSD(tarifa)+' × '+(noches||1);
  const row=document.getElementById('d-'+id+'-descrow');
  if(row){ row.style.display = d>0.009?'flex':'none'; const l=document.getElementById('d-'+id+'-desclbl'); if(l) l.innerText='Descuento '+pct+'%'; const dd=document.getElementById('d-'+id+'-desc'); if(dd) dd.innerText='- '+fmtUSD(d); }
  document.getElementById('d-'+id+'-usd').innerText = fmtUSD(tot);
  document.getElementById('d-'+id+'-bs').innerText = fmtBs(precioBs(tot));

function cobrarYCheckout(num, btn){
  if(guardTurno()) return;
  if(procesoDoble(btn)) return;
  const r = findRoom(num);
  if(!r || r.estado!=='ocupada'){ procesoListo(btn); alert('Esa habitación ya no está ocupada (puede que su check-out ya se haya hecho).'); return; }
  const noches = nochesHab(r); const hosp = brutoHab(r);
  const enCxc = !!r.creditoCxc; const hospCobro = enCxc?0:hosp;
  const pend = cargosDe(r).filter(c=>!c.pagado);
  const consUsd = pend.reduce((s,c)=>s+Number(c.montoUsd||0),0);
  const desc = enCxc?0:descUsd(r); const totUsd = hospCobro - desc + consUsd;
  const abonos = Array.isArray(r.abonos)?r.abonos:[];
  const abonoUsd = abonos.reduce((s,a)=>s+Number(a.montoUsd||0),0);
  const saldoUsd = Math.max(0, totUsd - abonoUsd);
  const c = clienteDeHab(r); const cr = c?clienteResumen(c):null;
  const now = new Date();
  const detAb = abonoUsd>0 ? (' (ya adelantó '+fmtUSD(abonoUsd)+')') : '';
  if(saldoUsd<=0.009){
    // Ya estaba todo pagado por adelantado: no se cobra nada más
    if(!confirm((enCxc?'El hospedaje de esta habitación ya está en CXC a crédito.':'Esta cuenta ya quedó cubierta con los adelantos ('+fmtUSD(abonoUsd)+').')+' No hay saldo por cobrar aquí.\n\n¿Hacer el check-out?')) return;
    const det0 = noches+' noche(s)'+(consUsd>0?' + consumos '+fmtUSD(consUsd):'')+(enCxc?' · hospedaje a crédito en CXC (Control '+fmtControl(r.creditoCxcControl)+')':' · pagado por adelantado')+detAb;
    logKardex('checkout', {hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:det0, montoUsd:0, montoBs:0, metodo:(enCxc?'Hospedaje en CXC':'Pagado por adelantado')});
    cerrarEstadia(r.clienteId||'', num, {noches:noches, montoUsd:0, metodo:(enCxc?'Hospedaje en CXC':'Pagado por adelantado')});
    confirmCheckout(num); return;
  }
  const pm=pmLeer('co'); if(!pm.ok){ procesoListo(btn); alert(pm.msg); return; }
  const metodo = pm.metodoStr;
  const ctrl = (parseInt(r.control)||0) || siguienteControl();
  const pagos = DB.get('pagos',[]);
  pagos.unshift({ id:Date.now(), control:ctrl, dia:diaKey(now), fechaStr:now.toLocaleString('es-VE'),
    hab:num, huesped:r.huesped||'', tipo:r.tipo||'', noches:noches, metodo:metodo, metodos:pm.metodos,
    clienteId:r.clienteId||'', clienteDoc:cr?cr.doc:'', clienteCiudad:cr?cr.ciudad:'',
    montoUsd:saldoUsd, montoBs:precioBs(saldoUsd), tasa:tasa(), usuario:session().nombre });
  DB.set('pagos', pagos); confirmarControl(ctrl);
  ligarCargosControl(pend.map(c=>c.id), ctrl);
  const det = noches+' noche(s)'+(consUsd>0?' + consumos '+fmtUSD(consUsd):'')+' cobradas'+detAb;
  logKardex('checkout', {hab:num, huesped:r.huesped||'', clienteId:r.clienteId||'', detalle:det, montoUsd:saldoUsd, montoBs:precioBs(saldoUsd), metodo:metodo});
  cerrarEstadia(r.clienteId||'', num, {noches:noches, montoUsd:saldoUsd, metodo:metodo});
  confirmCheckout(num);
}

function roomCardHK(r, puedeReportar){
  const e = ESTADOS[r.estado];

  const accionable = libre && puedeReportar;
  const esNueva = r.estado==='sucia' && r.hkNueva;

  return '<div class="room '+e.c+'"'+click+'><div class="dot"></div>'+
    '<div class="num">'+r.num+'</div><div class="st">'+e.t+'</div>'+
    (esNueva?'<div class="st" style="color:#b5651d;font-weight:800;font-size:9px">🆕 NUEVA</div>':'')+

function reportarUsadaHK(num){
  const r = rooms().find(x=>x.num===num);
  if(!r || r.estado!=='libre'){ alert('Esta habitación ya no está libre.'); render(); return; }
  if(!confirm('¿Reportar la habitación '+num+' como USADA / por limpiar?\n\nEntrará a tu lista de limpieza.')) return;
  const resp = prompt('Escribe una nota de lo que encontraste en la habitación '+num+':\n\n(Ejemplo: cama usada, toallas sucias, basura; nadie la había reportado)','');
  if(resp===null) return;
  const nota = String(resp).trim();
  if(!nota){ alert('Debes escribir una nota para reportar la habitación.'); return; }
  const s = session()||{};
  updateRoom(num,{estado:'sucia', nota:nota, hkNueva:false, hkOrigen:'Ama de Llaves'});
  logKardex('limpieza',{hab:num, nota:nota, hkReporte:true, detalle:'Ama de Llaves reportó la habitación '+num+' como usada (nadie la había reportado) · '+nota, montoUsd:0, montoBs:0, metodo:''});
  alert('Listo. La habitación '+num+' quedó en "Por limpiar".');
  render();
}

/* ====== CHAT INTERNO (general + entre módulos) ====== */
let vistaChat=false;      // si estamos viendo el chat a pantalla completa
let chatCanal='general';  // canal seleccionado
let chatUltimoVisto={};   // por canal: marca de tiempo vista (por equipo)
let _chatFocar=false;     // pedir foco en el cuadro de escribir (solo al abrir/cambiar)

let chatFiltroContacto='';
let _chatContactos=null;
/* Módulos del hotel que pueden estar en el chat */
const CHAT_MODULOS = [
  ['recepcion','Recepción'],
  ['supervisor','Supervisión'],
  ['administracion','Administración'],
  ['housekeeping','Ama de Llaves'],
  ['mantenimiento','Mantenimiento'],
  ['dueno','Dueño']
];
function chatEtiqueta(rol){ const m=CHAT_MODULOS.find(x=>x[0]===rol); return m?m[1]:(ROLES[rol]||rol); }
/* ---- Chat: lista de contactos del rol actual ---- */
function chatContactos(rol){
  const out=[['general','👥 Todos']];
  if(esMaster(rol)){
    for(let i=0;i<CHAT_MODULOS.length;i++){ for(let j=i+1;j<CHAT_MODULOS.length;j++){ const a=CHAT_MODULOS[i][0], b=CHAT_MODULOS[j][0]; out.push([chatCanalModulo(a,b),'💬 '+chatEtiqueta(a)+' ↔ '+chatEtiqueta(b)]); } }
  } else {
    CHAT_MODULOS.forEach(m=>{ if(m[0]===rol) return; out.push([chatCanalModulo(rol,m[0]),'💬 '+chatEtiqueta(m[0])]); });
  }
  return out;
}
function chatNoLeidosCanal(canal, rol){
  const visto=chatVisto(canal);
  let n=0; chatMsgs().forEach(m=>{ if(m.canal===canal && m.rol!==rol && (m.ts||0)>visto) n++; });
  return n;
}
function chatFiltro(v){ chatFiltroContacto=String(v||''); const g=document.getElementById('ct-grid'); if(g&&_chatContactos) g.innerHTML=_chatContactos(); const inp=document.getElementById('ct-search'); if(inp&&inp.value!==chatFiltroContacto) inp.value=chatFiltroContacto; }
function chatPintarLista(){

  const filtro=(chatFiltroContacto||'').toLowerCase();
  let conts=chatContactos(rol);
  if(filtro) conts=conts.filter(ch=>ch[1].toLowerCase().indexOf(filtro)>=0);
  if(!conts.length) return '<div class="ct-vacio">Nada por aquí. Prueba con otro nombre.</div>';
  return conts.map(ch=>{
    const act=(chatCanal===ch[0]);
    const n=chatNoLeidosCanal(ch[0], rol);

function chatMsgs(){ const a=DB.get('chat',[]); return Array.isArray(a)?a:[]; }
function chatGuardar(arr){ DB.set('chat', arr.slice(-800)); } // guarda los últimos 800 mensajes
function chatBorrarCanal(){
  if(!(session() && esMaster(session().rol))){ alert('Solo el Master puede borrar los chats.'); return; }

  if(!confirm('Seguro, seguro. ¿Confirmas borrar todos los mensajes del chat interno?')) return;

/* clave de la conversación privada entre dos módulos (siempre ordenada) */
function chatCanalModulo(rolA, rolB){
  const p=[rolA,rolB].sort();
  return 'mod:'+p[0]+'_'+p[1];
}
/* etiqueta legible de un canal */
function chatEtiquetaCanal(canal){
  if(canal==='general') return 'Chat general';
  if(canal.indexOf('mod:')===0){
    const partes=canal.slice(4).split('_');
    return chatEtiqueta(partes[0])+' ↔ '+chatEtiqueta(partes[1]);
  }
  return canal;
}
/* el rol actual puede ver este canal? */
function chatCanalPermitido(canal, rol){
  if(canal==='general') return true;
  if(esMaster(rol)) return true;
  if(canal.indexOf('mod:')===0){
    const partes=canal.slice(4).split('_');
    return partes.indexOf(rol)>=0;
  }
  return false;
}

/* marca de "visto" guardada en el propio equipo */
function chatVisto(canal){ return Number(DB.get('chatVisto_'+canal, 0))||0; }
function chatMarcarVisto(canal){ DB.set('chatVisto_'+canal, Date.now()); chatRegistrarLeido(canal); }

/* ---- Confirmación de lectura (compartida entre equipos) ----
   chatLeidos = { canal: { rol: tsUltimoLeido } }  */
function chatLeidosMap(){ const m=DB.get('chatLeidos',{}); return (m&&typeof m==='object')?m:{}; }
function chatRegistrarLeido(canal){
  const s=session(); if(!s) return;
  const rol=s.rol;
  const msgs=chatMsgs().filter(m=>m.canal===canal);
  let ult=0; msgs.forEach(m=>{ if((m.ts||0)>ult) ult=m.ts||0; });
  if(ult<=0) return;
  const mapa=chatLeidosMap();
  if(!mapa[canal]) mapa[canal]={};
  if((Number(mapa[canal][rol])||0) < ult){ mapa[canal][rol]=ult; DB.set('chatLeidos', mapa); }
}
/* qué módulos (distintos del mío) ya leyeron un mensaje mío */
function chatQuienLeyo(canal, ts, miRol){
  const mapa=chatLeidosMap(); const porCanal=mapa[canal]||{};
  const out=[];
  Object.keys(porCanal).forEach(r=>{
    if(r===miRol) return;
    if(esMaster(r)) return; // el Master lee en silencio
    if((Number(porCanal[r])||0) >= ts) out.push(chatEtiqueta(r));
  });
  return out;
}

/* cuántos mensajes sin leer tiene el usuario en total */
function chatSinLeer(){
  const s=session(); if(!s) return 0;
  const rol=s.rol;
  const canales=['general'];
  if(esMaster(rol)){
    CHAT_MODULOS.forEach(a=>CHAT_MODULOS.forEach(b=>{ if(a[0]<b[0]){ const c=chatCanalModulo(a[0],b[0]); if(canales.indexOf(c)<0) canales.push(c); } }));
  } else {
    CHAT_MODULOS.forEach(m=>{ if(m[0]!==rol){ const c=chatCanalModulo(rol,m[0]); if(canales.indexOf(c)<0) canales.push(c); } });
  }
  let n=0;
  chatMsgs().forEach(msg=>{
    if(canales.indexOf(msg.canal)<0) return;
    if(msg.rol===rol) return; // los míos no cuentan
    if((msg.ts||0) > chatVisto(msg.canal)) n++;
  });
  return n;
}
function actualizarBadgeChat(){
  const b=document.getElementById('chat-count'); if(!b) return;
  const n=chatSinLeer();
  if(n>0){ b.style.display='flex'; b.innerText = n>9?'9+':String(n); } else { b.style.display='none'; }
}

/* guarda un mensaje y avisa a la campanita */
function chatEnviar(canal, texto){
  texto=(texto||'').trim(); if(!texto) return false;
  const s=session(); if(!s) return false;
  if(!chatCanalPermitido(canal, s.rol)){ alert('No puedes escribir en este chat.'); return false; }
  const arr=chatMsgs();
  arr.push({ id:'m'+Date.now()+Math.random().toString(36).slice(2,5),
    canal:canal, rol:s.rol, nombre:s.nombre||s.user||'', ts:Date.now(), texto:texto.slice(0,1200) });
  chatGuardar(arr);
  return true;
}

/* ====== AVISOS DE MENSAJES NUEVOS (push interno + notificación del navegador) ====== */
/* Devuelve los mensajes sin leer dirigidos a mí (con canal y quién escribe) */
function chatMensajesSinLeer(){
  const s=session(); if(!s) return [];
  const rol=s.rol;
  const canales=['general'];
  if(esMaster(rol)){
    CHAT_MODULOS.forEach(a=>CHAT_MODULOS.forEach(b=>{ if(a[0]<b[0]){ const c=chatCanalModulo(a[0],b[0]); if(canales.indexOf(c)<0) canales.push(c); } }));
  } else {
    CHAT_MODULOS.forEach(m=>{ if(m[0]!==rol){ const c=chatCanalModulo(rol,m[0]); if(canales.indexOf(c)<0) canales.push(c); } });
  }
  const out=[];
  chatMsgs().forEach(msg=>{
    if(canales.indexOf(msg.canal)<0) return;
    if(msg.rol===rol) return;
    if((msg.ts||0) <= chatVisto(msg.canal)) return;
    out.push({ canal:msg.canal, quien:chatEtiqueta(msg.rol)+(msg.nombre?(' · '+msg.nombre):''), texto:msg.texto, ts:msg.ts });
  });
  out.sort((a,b)=>a.ts-b.ts);
  return out;
}
function abrirChatCanal(canal){
  if(chatCanalPermitido(canal, session().rol)) chatCanal=canal;
  abrirChat();
}

/* --- Notificación del navegador (opcional; el usuario la permite) --- */
function soportaNotifNavegador(){ return ('Notification' in window); }
function pedirPermisoNotif(){
  if(!soportaNotifNavegador()) return;
  try{
    if(Notification.permission==='default'){ Notification.requestPermission().then(function(p){ try{ if(p==='granted') alert('Listo. Ahora te avisaremos de los mensajes nuevos aunque la app esté en segundo plano (mientras esté abierta).'); }catch(e){} }).catch(function(){}); }
  }catch(e){}
}
function notifNavegador(titulo, texto){
  if(!soportaNotifNavegador()) return;
  try{
    if(Notification.permission!=='granted') return;
    if(document.visibilityState==='visible' && document.hasFocus && document.hasFocus()) return; // ya estás mirando la app
    const n=new Notification(titulo, {body:texto, icon:'icon-192.png', tag:'chat-hotel'});
    n.onclick=function(){ try{ window.focus(); n.close(); }catch(e){} };
    setTimeout(function(){ try{ n.close(); }catch(e){} }, 9000);
  }catch(e){}
}

/* --- Revisa si entraron mensajes nuevos y avisa (se llama en cada refresco de la nube) --- */
let _chatFirmaAnterior=null;
function revisarMensajesNuevos(){
  const s=session(); if(!s) return;
  const sinleer=chatMensajesSinLeer();
  const firma=String(sinleer.length)+'|'+sinleer.map(x=>x.ts).join(',');
  const primera=(_chatFirmaAnterior===null);
  _chatFirmaAnterior=firma;
  if(primera) return; // no avisar al abrir la app, solo de los mensajes que llegan después
  if(sinleer.length===0) return;
  const ultimo=sinleer[sinleer.length-1];
  notifNavegador('💬 Nuevo mensaje · '+chatEtiquetaCanal(ultimo.canal), ultimo.quien+': '+ultimo.texto);
  if(!vistaChat || chatCanal!==ultimo.canal){ mostrarToastChat(sinleer.length, ultimo.quien, ultimo.texto, ultimo.canal); }
}

  try{ if(typeof CLOUD!=='undefined' && CLOUD.enabled){ await CLOUD.clearAll(); } }catch(e){}

  try{ SYNC_KEYS.forEach(k=> localStorage.removeItem('hotel_'+k)); }catch(e){}
  try{ ['hotel','impresion','promos','restaurantes'].forEach(k=> localStorage.removeItem('hotel_'+k)); }catch(e){}
  try{ localStorage.removeItem('hotel_session'); localStorage.removeItem('hotel_ultimoRespaldo'); }catch(e){}
  try{ sessionStorage.removeItem('hotel_avisoRespaldo'); }catch(e){}
  /* 3) Reconstruir un estado NUEVO y limpio en este equipo */
  seed(); /* habitaciones, usuario admin y cajas basicas */

  try{ Object.keys(_vacios).forEach(k=> localStorage.setItem('hotel_'+k, JSON.stringify(_vacios[k]))); }catch(e){}
  /* 4) Subir TODAS las cajas (ya vacias) a la nube, para que NINGUN otro equipo reviva datos viejos */
  try{

      CLOUD.ready=true; CLOUD._cloudKeys = SYNC_KEYS.slice();

/* ====== RECORDATORIO DE RESPALDO ====== */
function ultimoRespaldoISO(){ try{ return localStorage.getItem('hotel_ultimoRespaldo')||''; }catch(e){ return ''; } }
function marcarRespaldo(){ try{ localStorage.setItem('hotel_ultimoRespaldo', new Date().toISOString()); }catch(e){} }
function diasDesdeRespaldo(){ const iso=ultimoRespaldoISO(); if(!iso) return null; return (Date.now()-new Date(iso).getTime())/86400000; }
function respaldoVencido(){ const d=diasDesdeRespaldo(); return (d===null || d>=7); }
function textoUltimoRespaldo(){
  const iso=ultimoRespaldoISO();
  if(!iso) return '⚠️ Todavía no has descargado ningún respaldo en este equipo.';
  const f=new Date(iso); const dias=Math.floor(diasDesdeRespaldo());
  const cuando = dias<=0 ? 'hoy' : (dias===1 ? 'hace 1 día' : 'hace '+dias+' días');
  const icono = respaldoVencido() ? '⚠️' : '✅';
  return icono+' Último respaldo en este equipo: '+f.toLocaleString('es-VE')+' ('+cuando+').';
}
function avisarRespaldo(){
  try{
    const s=session(); if(!s || !esMaster(s.rol)) return;
    if(!respaldoVencido()) return;
    if(sessionStorage.getItem('hotel_avisoRespaldo')) return;
    sessionStorage.setItem('hotel_avisoRespaldo','1');
    const d=diasDesdeRespaldo();
    const msg = (d===null)
      ? 'Recordatorio de seguridad:\n\nTodavía no has descargado ningún respaldo de la base de datos en este equipo.\n\nVe a la pestaña "Datos" y toca "Descargar respaldo" para guardar una copia de seguridad.'
      : 'Recordatorio de seguridad:\n\nHace '+Math.floor(d)+' días que no descargas un respaldo de la base de datos.\n\nVe a la pestaña "Datos" y toca "Descargar respaldo" para guardar una copia nueva.';
    setTimeout(()=>{ try{ alert(msg); }catch(e){} }, 900);
  }catch(e){}
}
function importarRespaldo(ev){
  const file=ev.target.files && ev.target.files[0]; if(!file){ return; }
  const reader=new FileReader();
  reader.onload=function(e){
    let paquete;
    try{ paquete=JSON.parse(e.target.result); }catch(err){ alert('Ese archivo no es un respaldo válido (no se pudo leer).'); ev.target.value=''; return; }
    const datos=(paquete && paquete.datos && typeof paquete.datos==='object') ? paquete.datos : ((paquete && typeof paquete==='object') ? paquete : null);
    if(!datos){ alert('Ese archivo no parece un respaldo de la aplicación.'); ev.target.value=''; return; }
    const claves=Object.keys(datos).filter(k=>SYNC_KEYS.includes(k));
    if(claves.length===0){ alert('El respaldo no contiene datos reconocidos de la aplicación.'); ev.target.value=''; return; }
    const info=(paquete._fecha?('\n\nFecha del respaldo: '+new Date(paquete._fecha).toLocaleString('es-VE')):'')+(paquete.hotel?('\nHotel: '+paquete.hotel):'');
    if(!confirm('Vas a RESTAURAR el respaldo. Esto REEMPLAZA los datos actuales (habitaciones, clientes, pagos, usuarios, etc.) por los del archivo, en este equipo y en la nube.'+info+'\n\n¿Continuar?')){ ev.target.value=''; return; }
    claves.forEach(k=>{ DB.set(k, datos[k]); });
    ev.target.value='';
    alert('Respaldo restaurado correctamente. La aplicación se va a recargar.');
    setTimeout(()=>{ location.reload(); }, 700);
  };
  reader.onerror=function(){ alert('No se pudo leer el archivo.'); ev.target.value=''; };
  reader.readAsText(file);
}

function datosOcupacionTipo(){
  const rs=rooms(); const filas=[];
  const tipos=getTipos().slice();
  // incluir tipos presentes en habitaciones aunque no estén en la lista
  rs.forEach(r=>{ const t=r.tipo||'(sin tipo)'; if(tipos.indexOf(t)<0) tipos.push(t); });
  let tot={total:0,ocupadas:0,libres:0,otras:0};
  tipos.forEach(t=>{
    const grupo=rs.filter(r=>(r.tipo||'(sin tipo)')===t);
    if(grupo.length===0 && getTipos().indexOf(t)<0) return;
    const total=grupo.length;
    const ocupadas=grupo.filter(r=>r.estado==='ocupada').length;
    const libres=grupo.filter(r=>r.estado==='libre').length;
    const otras=total-ocupadas-libres;
    const pct= total? Math.round(ocupadas/total*100) : 0;
    filas.push({tipo:t, total:total, ocupadas:ocupadas, libres:libres, otras:otras, pct:pct, precio:precioBaseTipo(t)});
    tot.total+=total; tot.ocupadas+=ocupadas; tot.libres+=libres; tot.otras+=otras;
  });
  tot.pct= tot.total? Math.round(tot.ocupadas/tot.total*100) : 0;
  return {filas:filas, tot:tot};
}

/* ====== REPORTE POLICIAL ====== */
let polFiltro = 'dia';   // 'dia' | 'rango'
let polDia = '';
let polDesde = '';
let polHasta = '';
let polSoloExtr = false;

// Un huésped es extranjero si su país NO es Venezuela (sin importar el tipo de documento).
function esExtranjeroPais(pais){
  const p=String(pais==null?'':pais).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!p) return false; // sin país = se asume Venezuela = no extranjero
  return !(p==='venezuela' || p==='venezolano' || p==='venezolana' || p==='vzla' || p==='ve');
}
function polSetSoloExtr(v){ polSoloExtr=!!v; render(); }

function polInicializar(){
  if(!polDia){ const d=new Date(); polDia=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  if(!polDesde) polDesde=polDia;
  if(!polHasta) polHasta=polDia;
}
function polSetFiltro(v){ polFiltro=v; render(); }
function polSetDia(v){ polDia=v; render(); }
function polSetDesde(v){ polDesde=v; render(); }
function polSetHasta(v){ polHasta=v; render(); }

function _polDiaDe(iso){ return String(iso==null?'':iso).slice(0,10); }
/* Dia CALENDARIO LOCAL del equipo (no UTC). Antes se tomaba la fecha en UTC
   del registro, y como la hora se guarda en UTC, los check-ins hechos de
   noche (hora de Venezuela) caian en el dia siguiente y NO aparecian en el
   reporte del dia. Esto los ubica en el dia correcto segun la hora local. */
function _polDiaLocal(ts){ try{ const d=new Date(ts); if(isNaN(d.getTime())) return _polDiaDe(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch(e){ return _polDiaDe(ts); } }
function docSigla(t){ return {V:'V',E:'E',P:'P',J:'J',G:'G'}[String(t||'').toUpperCase()]||''; }
function docCorto(tipo,num){ var s=docSigla(tipo); return (s&&num)?(s+'-'+num):String(num||''); }
function polRegistros(){
  // Toma los check-ins del kardex (cada huésped que entró) y cruza con la habitación y el cliente.
  const todos = kardexAll().filter(k=>k.tipo==='checkin');
  let desde, hasta;
  if(polFiltro==='dia'){ desde=polDia; hasta=polDia; }
  else { desde=polDesde; hasta=polHasta; }
  const filas=[];
  todos.forEach(k=>{
    const dia = _polDiaLocal(k.ts);
    if(desde && dia<desde) return;
    if(hasta && dia>hasta) return;
    const r = findRoom(k.hab);
    const c = (k.clienteId?clientes().find(x=>x.id===k.clienteId):null) || null;
    let entrada = '', salida = '', nom = k.huesped||'', doc='', edad='', ec='', prof='', proc='', dest='', pais='';
    if(c){
      nom = (c.tipo==='empresa'? (c.nombre||'') : ((c.nombre||'')+' '+(c.apellido||'')).trim()) || nom;
      doc = c.docNum?docCorto(c.docTipo,c.docNum):'';
      edad = c.edad||''; ec = c.estadoCivil||''; prof = c.ocupacion||''; proc = c.ciudad||''; dest = c.destino||''; pais = c.pais||'';
    }
    // entrada/salida desde la habitación (histórico del kardex no las guarda, se toman de la room si sigue)
    if(r){ entrada = r.checkin||''; salida = r.salida||''; }
    if(!entrada && c && Array.isArray(c.historial)){ const h=c.historial.find(x=>x.hab===k.hab); if(h){ entrada = h.entrada?fechaDDMMYYYY(_polDiaDe(h.entrada)):''; salida = h.salida?fechaDDMMYYYY(_polDiaDe(h.salida)):''; } }
    filas.push({ ts:k.ts, dia:String(dia==null?'':dia), hab:String(k.hab==null?'':k.hab), nom:String(nom==null?'':nom), doc:String(doc==null?'':doc), edad:String(edad==null?'':edad), ec:String(ec==null?'':ec), prof:String(prof==null?'':prof), proc:String(proc==null?'':proc), dest:String(dest==null?'':dest), pais:String(pais==null?'':pais), entrada:String(entrada==null?'':entrada), salida:String(salida==null?'':salida) });
  });
  filas.sort((a,b)=> new Date(a.ts)-new Date(b.ts));
  if(polSoloExtr) return filas.filter(f=>esExtranjeroPais(f.pais));
  return filas;
}
function polFechaTxt(iso){ return iso?fechaDDMMYYYY(iso):'—'; }

  h += '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn-primary" onclick="imprimirPolicial()">🖨️ Imprimir (Epson LX-300)</button>';

  if(!filas.length){
    h += '<div class="empty-guia"><span class="ico">🚔</span><div class="t">No hay huéspedes registrados en '+(polFiltro==='dia'?'ese día':'ese rango')+'</div><div class="s">Cuando Recepción haga check-in a un huésped, aquí aparecerá su registro.</div></div>';
    return h;
  }

  h += '<div style="background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:12px;overflow:auto">';
  h += '<table class="users-table"><tr><th>Fecha entrada</th><th>Apellidos y nombres</th><th style="width:34px;text-align:center;padding-left:4px;padding-right:4px">Edad</th><th style="width:40px;text-align:center;padding-left:4px;padding-right:4px">E. civil</th><th>Profesión u oficio</th><th>Procedencia</th><th>Destino</th><th style="width:86px;padding-left:6px;padding-right:6px">Cédula</th><th>Fecha salida</th><th style="width:40px;text-align:center;padding-left:4px;padding-right:4px">Hab.</th></tr>';
  filas.forEach(f=>{
    h += '<tr><td style="white-space:nowrap">'+esc(f.entrada||polFechaTxt(f.dia))+'</td><td><b>'+esc(f.nom||'—')+'</b></td><td style="text-align:center;padding-left:4px;padding-right:4px">'+esc(f.edad||'—')+'</td><td style="text-align:center;padding-left:4px;padding-right:4px">'+esc(f.ec||'—')+'</td><td>'+esc(f.prof||'—')+'</td><td>'+esc(f.proc||'—')+'</td><td>'+esc(f.dest||'—')+'</td><td style="white-space:nowrap;padding-left:6px;padding-right:6px">'+esc(f.doc||'—')+'</td><td style="white-space:nowrap">'+esc(f.salida||'—')+'</td><td style="text-align:center;padding-left:4px;padding-right:4px">'+esc(f.hab||'—')+'</td></tr>';
  });
  h += '</table></div>';
  return h;
}

function aplicarBulkEstado(){
  const e=document.getElementById('bulk-estado').value;
  if(!ESTADOS[e]||e==='ocupada'){ alert('Estado no válido.'); return; }
  const sel=habsSeleccionadas();

  if(cambiables.length===0){ alert('Todas las seleccionadas están ocupadas. Haz el check-out primero.'); return; }

function bulkEliminarHabs(){
  const sel=habsSeleccionadas();
  const ocupadas=sel.filter(r=>r.estado==='ocupada');
  const borrables=sel.filter(r=>r.estado!=='ocupada');
  if(borrables.length===0){ alert('No se puede borrar: todas las seleccionadas están ocupadas. Haz check-out primero.'); return; }
  let msg='¿Eliminar '+borrables.length+' habitación(es)?';
  if(ocupadas.length) msg+=' ('+ocupadas.length+' están ocupadas y NO se borrarán).';
  if(!confirm(msg)) return;
  const nums=borrables.map(r=>r.num);
  saveRooms(rooms().filter(x=>nums.indexOf(x.num)<0));
  const reps=DB.get('reportes',[]).filter(x=>nums.indexOf(x.hab)<0); DB.set('reportes',reps);
  nums.forEach(num=>selHabs.delete(num));
  render();
}

function bulkAddFloor(){
  const piso = parseInt(document.getElementById('bf-piso').value);
  const cant = parseInt(document.getElementById('bf-cant').value);
  const tipo = document.getElementById('bf-tipo').value;
  const tarifa = parseFloat(document.getElementById('bf-tarifa').value)||0;
  if(!piso||!cant||cant<1){ alert('Revisa el número de piso y la cantidad'); return; }
  const r = rooms(); let creadas=0;
  for(let n=1;n<=cant;n++){
    const num = piso*100+n;
    if(r.find(x=>x.num===num)) continue;
    r.push({num:num,piso:piso,tipo:tipo,tarifa:tarifa,estado:'libre',huesped:'',personas:0,checkin:'',salida:'',nota:''});
    creadas++;
  }
  saveRooms(r);
  if(creadas===0) alert('Esas habitaciones ya existían.');
  render();
}
function addRoomSingle(){
  const num = parseInt(document.getElementById('ar-num').value);
  const piso = parseInt(document.getElementById('ar-piso').value);
  const tipo = document.getElementById('ar-tipo').value;
  const tarifa = parseFloat(document.getElementById('ar-tarifa').value)||0;
  if(!num||!piso){ alert('Completa número y piso'); return; }
  const r = rooms();
  if(r.find(x=>x.num===num)){ alert('Ya existe la habitación '+num); return; }
  r.push({num:num,piso:piso,tipo:tipo,tarifa:tarifa,estado:'libre',huesped:'',personas:0,checkin:'',salida:'',nota:''});
  saveRooms(r); render();
}
function editRoomModal(num){
  const r = findRoom(num);
  let body = '<button class="close" onclick="cerrarModal()">×</button>';
  body += '<h2>Editar habitación '+num+'</h2><div class="rstate" style="color:#55637a">Estado actual: '+ESTADOS[r.estado].t+'</div>';
  body += '<div class="field"><label>Número</label><input id="ed-num" type="number" value="'+r.num+'"></div>';
  body += '<div class="field"><label>Piso</label><input id="ed-piso" type="number" min="1" value="'+r.piso+'"></div>';
  body += '<div class="field"><label>Tipo</label><select id="ed-tipo" onchange="autoPrecioTipo(\'ed-tipo\',\'ed-tarifa\')">'+tipoOptions(r.tipo)+'</select></div>';
  body += '<div class="field"><label>Tarifa (USD) <span style="color:#8893a5;font-weight:400;font-size:12px">(al cambiar el tipo se pone el precio base; puedes ajustarla)</span></label><input id="ed-tarifa" type="number" min="0" step="0.01" value="'+(r.tarifa||0)+'"></div>';
  body += '<div class="divider"></div><div class="actions"><button class="btn-green" onclick="saveRoomEdit('+num+')">Guardar cambios</button>';
  body += '<button class="btn-ghost" onclick="cerrarModal()">Cancelar</button></div>';
