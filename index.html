    const nombre=g(r,col.nombre); if(!nombre) continue;
    const esEmp = norm(g(r,col.tipo)).indexOf('empresa')>=0 || norm(g(r,col.tipo))==='company';
    if(esEmp){
      let codigo=g(r,col.codigo); const nkey=norm(nombre);
      if((codigo && existCod.has(norm(codigo))) || existNom.has(nkey)){ skip++; continue; }
      if(!codigo) codigo=nuevoCodigoEmpresa();
      const d=parseDoc(r);
      const nuevo={id:'c'+(base+i), tipo:'empresa', nombre:nombre, apellido:'', docTipo:(d.dn?d.dt:'J'), docNum:d.dn, correo:g(r,col.correo), ocupacion:g(r,col.ocupacion), ciudad:g(r,col.ciudad), telefono:g(r,col.telefono), direccion:g(r,col.direccion), notas:g(r,col.notas), historial:[], creado:new Date().toISOString(), codigo:codigo, tipoComp:g(r,col.tipoComp), diasCredito:g(r,col.diasCredito)};
      list.push(nuevo); existCod.add(norm(codigo)); existNom.add(nkey); if(d.dn) existDocs.add(docKey(d.dt,d.dn)); addE++;
    } else {
      const d=parseDoc(r);
      if(d.dn && existDocs.has(docKey(d.dt,d.dn))){ skip++; continue; }
      const nuevo={id:'c'+(base+i), tipo:'persona', nombre:nombre, apellido:g(r,col.apellido), docTipo:d.dt, docNum:d.dn, correo:g(r,col.correo), ocupacion:g(r,col.ocupacion), ciudad:g(r,col.ciudad), telefono:g(r,col.telefono), direccion:g(r,col.direccion), edad:g(r,col.edad), empresaRef:g(r,col.empresaRef), notas:g(r,col.notas), historial:[], creado:new Date().toISOString()};
      list.push(nuevo); if(d.dn) existDocs.add(docKey(d.dt,d.dn)); addP++;
    }
  }
  saveClientes(list); render();
  alert('Importación terminada.\n\nAgregados: '+addP+' persona(s) y '+addE+' empresa(s).'+(skip?('\nOmitidos por estar repetidos: '+skip+'.'):'')+'\n\nYa quedaron guardados y sincronizados.');
}
function guardarCliente(){
  const tipo=document.getElementById('cl-tipo').value;
  const nombre=document.getElementById('cl-nombre').value.trim();
  const apellido=document.getElementById('cl-apellido').value.trim();
  const docTipo=document.getElementById('cl-doctipo').value;
  const docNum=document.getElementById('cl-docnum').value.trim();
  const correo=document.getElementById('cl-correo').value.trim();
  const ocupacion=document.getElementById('cl-ocup').value.trim();
  const ciudad=document.getElementById('cl-ciudad').value.trim();
  const telefono=document.getElementById('cl-telefono').value.trim();
  const direccion=document.getElementById('cl-direccion').value.trim();
  if(!nombre){ alert(tipo==='empresa'?'Escribe el nombre de la empresa':'Escribe el nombre'); return; }
  if(correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)){ alert('El correo no parece válido'); return; }
  const list=clientes();
  if(docNum && list.find(c=>c.docNum===docNum && c.docTipo===docTipo)){ alert('Ya existe un cliente con ese documento'); return; }
  const nuevoId='c'+Date.now();
  const nuevo={id:nuevoId, tipo:tipo, nombre:nombre, apellido:apellido, docTipo:docTipo, docNum:docNum, correo:correo, ocupacion:ocupacion, ciudad:ciudad, telefono:telefono, direccion:direccion, notas:'', historial:[], creado:new Date().toISOString()};
  if(tipo==='empresa'){
    nuevo.codigo=nuevoCodigoEmpresa();
    nuevo.tipoComp=(document.getElementById('cl-tipocomp')?document.getElementById('cl-tipocomp').value.trim():'');
    nuevo.diasCredito=(document.getElementById('cl-diascredito')?document.getElementById('cl-diascredito').value.trim():'');
  } else {
    nuevo.edad=(document.getElementById('cl-edad')?document.getElementById('cl-edad').value.trim():'');
    nuevo.empresaRef=(document.getElementById('cl-empresaref')?document.getElementById('cl-empresaref').value.trim():'');
  }
  list.push(nuevo);
  saveClientes(list);
  const nomReg = tipo==='empresa'?nombre:((nombre+' '+apellido).trim());
  logKardex('cliente', {hab:0, huesped:nomReg, clienteId:nuevoId, detalle:'Cliente registrado'+(docNum?' · '+docLabel(docTipo)+' '+docNum:''), montoUsd:0, montoBs:0, metodo:''});
  if(tipo==='empresa'){ alert('Empresa registrada con el código:  '+nuevo.codigo+'\n\nUsa este código para buscarla o para asociarla a un huésped que venga por ella.'); }
  render();
}

let kardexTurnoSel = '';

function kardexAll(){ return DB.get('kardex', []); }
function kardexDeTurno(id){ return kardexAll().filter(k=>k.turnoId===id); }
function logKardex(tipo, data){
  const k = kardexAll();

function horaCorta(iso){ try{ return new Date(iso).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function fechaHoraCorta(iso){ try{ return new Date(iso).toLocaleString('es-VE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function duracionTurno(t){
  const ini=new Date(t.inicio); const fin=t.fin?new Date(t.fin):new Date();
  let min=Math.round((fin-ini)/60000); const h=Math.floor(min/60); min=min%60;
  return (h>0?h+'h ':'')+min+'min';
}
const KTIPO = { checkin:{t:'Check-in',c:'var(--verde)'}, checkout:{t:'Check-out',c:'var(--rojo)'}, pago:{t:'Cobro',c:'var(--azul2)'}, anulacion:{t:'Cobro ANULADO',c:'var(--rojo)'}, cliente:{t:'Cliente nuevo',c:'var(--gris)'}, cargo:{t:'Consumo',c:'var(--naranja)'}, limpieza:{t:'Limpieza',c:'var(--azul2)'}, cambio:{t:'Cambio de hab.',c:'var(--gris)'} };

function cargarLogo(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ alert('Elige un archivo de imagen (PNG o JPG).'); return; }
  if(f.size>8000000){ alert('La imagen es demasiado pesada (máximo 8 MB). Usa una un poco más liviana.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=512; let w=img.width, hg=img.height;
      if(w>MAX||hg>MAX){ const s=Math.min(MAX/w, MAX/hg); w=Math.round(w*s); hg=Math.round(hg*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=hg;
      cv.getContext('2d').drawImage(img,0,0,w,hg);
      const data = /png/i.test(f.type) ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.85);
      const h=leerHotelForm(); h.logo=data; saveHotel(h); pintarMarca(); render();
    };
    img.onerror=function(){ alert('No se pudo leer la imagen. Prueba con otra.'); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

  html+='<div style="text-align:center"><label style="font-size:12.5px;display:block;margin-bottom:4px">Color principal</label><input type="color" id="col-principal" value="'+(cst.azul||'#0d3b66')+'" style="width:64px;height:44px;padding:2px;border:1px solid #c7d0dd;border-radius:10px;cursor:pointer;background:#fff"></div>';
  html+='<div style="text-align:center"><label style="font-size:12.5px;display:block;margin-bottom:4px">Color secundario</label><input type="color" id="col-secundario" value="'+(cst.azul2||'#1b6ca8')+'" style="width:64px;height:44px;padding:2px;border:1px solid #c7d0dd;border-radius:10px;cursor:pointer;background:#fff"></div>';
  html+='<button class="btn-primary" style="padding:10px 18px" onclick="aplicarColorPersonalizado()">Aplicar mis colores</button>';
  html+='</div>';
  html+='<p style="font-size:12px;color:#8893a5;margin-top:10px;line-height:1.6">El <b>color principal</b> es el fuerte (barra de arriba y títulos) y el <b>secundario</b> es el de los botones. Los colores de “cobrar/disponible” (verde) y de “alerta” (rojo) se mantienen siempre para que todos los entiendan igual.</p>';
  html+='</div></div>';
  if(esMaster(session().rol)){
    html+='<div style="background:#fff;padding:20px;border-radius:12px;max-width:620px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-top:20px">';
    html+='<div class="section-title" style="font-size:15px;margin-top:0">Formas de pago</div>';
    html+='<p style="font-size:12px;color:#8893a5;margin-top:0">Agrega aquí los bancos, pagos móviles y puntos de venta donde reciben los pagos. Lo que pongas aquí aparece al cobrar y en el arqueo de caja. Solo tú (Master) puedes editarlas.</p>';
    const ms=getMetodos();
    ms.forEach((m,i)=>{
      html+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">';
      html+='<input id="met-'+i+'" value="'+escA(m)+'" style="flex:1">';
      html+='<button class="btn-ghost" style="padding:6px 10px" onclick="guardarMetodo('+i+')">Guardar</button>';
      html+='<button class="btn-red" style="padding:6px 10px" onclick="eliminarMetodo('+i+')">Eliminar</button></div>';
    });
    html+='<div style="display:flex;gap:8px;align-items:center;margin-top:12px">';
    html+='<input id="met-nuevo" placeholder="ej: Punto Banesco, Pago Móvil Mercantil" style="flex:1">';
    html+='<button class="btn-green" style="padding:6px 12px" onclick="agregarMetodo()">+ Agregar</button></div>';
    html+='</div>';
    html+='<div style="background:#fff;padding:20px;border-radius:12px;max-width:620px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-top:20px">';
    html+='<div class="section-title" style="font-size:15px;margin-top:0">Número de control de los pagos</div>';
    html+='<p style="font-size:12px;color:#8893a5;margin-top:0">Cada pago recibe un número correlativo automático que aparece en el recibo, en la caja y en el arqueo. Aquí puedes indicar con qué número debe continuar el próximo pago (por ejemplo, para seguir tu talonario).</p>';
    html+='<p style="font-size:12px;color:#55637a;margin:4px 0 10px">El próximo pago usará el número: <b>'+fmtControl(peekControl())+'</b></p>';
    html+='<div style="display:flex;gap:8px;align-items:center">';
    html+='<input id="prox-control" type="number" min="1" value="'+peekControl()+'" style="flex:1">';
    html+='<button class="btn-green" style="padding:6px 12px" onclick="guardarProxControl()">Guardar</button></div>';
    html+='</div>';
  }
  return html;
}

/* ====== INICIO (con sincronización en la nube) ====== */
function hayFormularioActivo(){
  const a = document.activeElement;
  if(a){ const t=(a.tagName||'').toLowerCase(); if(t==='input'||t==='textarea'||t==='select') return true; }
  const mb = document.getElementById('modal-bg');
  if(mb && mb.style.display==='flex') return true;
  return false;
}

function startPolling(){
  if(!CLOUD.enabled) return;
  setInterval(async ()=>{
    try{
      const antes = {};
      SYNC_KEYS.forEach(k=> antes[k]=localStorage.getItem('hotel_'+k));
      await CLOUD.pullAll();
      revisarCierreForzado();
      let cambio=false;
      SYNC_KEYS.forEach(k=>{ if(antes[k]!==localStorage.getItem('hotel_'+k)) cambio=true; });
      if(cambio && !hayFormularioActivo()){
        aplicarTema(); pintarMarca();
        if(session()) render();
      }
    }catch(e){ /* sin conexión: seguimos con los datos del equipo */ }
  }, 6000);
}

/* ====== APP INSTALABLE (PWA) ====== */
let _promptInstalar = null;
function esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
function yaInstalada(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function mostrarBotonInstalar(mostrar){ const b=document.getElementById('btn-instalar'); if(b) b.style.display = mostrar ? 'inline-flex' : 'none'; }
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  _promptInstalar = e;
  if(!yaInstalada()) mostrarBotonInstalar(true);
});
window.addEventListener('appinstalled', function(){
  _promptInstalar = null;
  mostrarBotonInstalar(false);
});
function instalarApp(){
  if(_promptInstalar){
    _promptInstalar.prompt();
    _promptInstalar.userChoice.finally(function(){ _promptInstalar=null; mostrarBotonInstalar(false); });
    return;
  }
  var pasos;
  if(esIOS()){
    pasos = '<ol style="margin:10px 0 0 18px;line-height:1.7;font-size:14px">'+
      '<li>Toca el botón <b>Compartir</b> (el cuadro con la flecha hacia arriba, abajo en Safari).</li>'+
      '<li>Baja y toca <b>“Agregar a inicio”</b> / <b>“Añadir a pantalla de inicio”</b>.</li>'+
      '<li>Toca <b>Agregar</b>. Ya tendrás el ícono del hotel en tu teléfono.</li></ol>';
  } else {
    pasos = '<ol style="margin:10px 0 0 18px;line-height:1.7;font-size:14px">'+
      '<li>En la barra de direcciones, arriba a la derecha, busca el ícono de <b>instalar</b> (una pantallita con una flecha) o abre el menú <b>⋮</b>.</li>'+
      '<li>Elige <b>“Instalar Gestión Hotel Laja Real”</b> o <b>“Instalar aplicación”</b>.</li>'+
      '<li>Confirma. La app quedará en tu escritorio o pantalla de inicio.</li></ol>'+
      '<p style="font-size:12.5px;color:#667;margin-top:10px">Nota: debes abrir la página desde su enlace de internet (no desde un archivo), y con el candado de seguridad (https).</p>';
  }
  showModal('<div style="max-width:460px"><div class="section-title" style="font-size:16px">⬇️ Instalar la app</div>'+
    '<p style="font-size:14px;color:#44526a">Puedes dejar el Hotel Laja Real como una aplicación en tu equipo o teléfono:</p>'+
    pasos+
    '<div style="text-align:right;margin-top:16px"><button class="btn-primary" onclick="cerrarModal()">Entendido</button></div></div>');
}
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* sin service worker: la app funciona igual */ });
  });
  // En iPhone no existe beforeinstallprompt: mostramos el botón con instrucciones.
  if(esIOS() && !yaInstalada()) mostrarBotonInstalar(true);
}

async function bootstrap(){
  try{ await CLOUD.pullAll(); }catch(e){ /* sin conexión al iniciar: usamos datos del equipo */ }
  seed();                 // completa cajas que falten (sin pisar lo que ya hay)
  CLOUD.ready = true;
  try{ await CLOUD.pushMissing(); }catch(e){}  // primer equipo: sube lo que la nube aún no tiene
  aplicarTema(); pintarMarca(); openApp();
  startPolling();
}
bootstrap();
</script>
